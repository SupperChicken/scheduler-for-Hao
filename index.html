const HELP_DOCS = {"staff": "<p>Xem lịch của mình chỉ cần 3 bước: mở link, đăng nhập, gõ tên vào ô tìm kiếm. Muốn lịch tự gửi tới, bấm 🔔 Nhận lịch (mục 4).<\/p>\n<h2 id=\"hs1\">1. Vào trang lần đầu<\/h2>\n<ol><li>Mở link trang lịch mà người quản lý gửi qua Zalo. Nên lưu lại (ghim tin nhắn hoặc thêm vào màn hình chính điện thoại).<\/li><li>Đăng nhập một trong hai cách:<ul><li>Bấm nút <b>Google<\/b> và chọn tài khoản Gmail.<\/li><li>Hoặc bấm <b>Tạo tài khoản<\/b> bằng email, mở thư xác minh (xem cả mục Thư rác), bấm link trong thư, quay lại bấm <b>Tôi đã xác minh<\/b>.<\/li><\/ul><\/li><li>Nếu trang báo <b>Chưa được cấp quyền<\/b>: gửi email bạn vừa dùng cho người quản lý. Khi được thêm, tải lại trang là vào được.<\/li><\/ol>\n<p>Lần sau mở link là vào thẳng, không cần đăng nhập lại.<\/p>\n<h2 id=\"hs2\">2. Xem lịch của mình<\/h2>\n<ol><li>Trang mở sẵn tab <b>Lịch tuần<\/b>.<\/li><li>Kiểm tra tuần ở thanh trên cùng (ví dụ <i>05/10 – 11/10/2026<\/i>). Bấm <b>‹<\/b> / <b>›<\/b> để sang tuần trước, tuần sau, hoặc bấm vào ô tuần để chọn.<\/li><li>Gõ tên mình vào ô <b>Tìm nhân viên<\/b>. Bảng chỉ còn dòng của bạn.<\/li><li>Đọc từ trái sang phải, thứ Hai đến Chủ nhật. Mỗi ô là chuyến được xếp hoặc trạng thái nghỉ của ngày đó. Cột <i>CN trước<\/i> là Chủ nhật tuần trước, để biết giờ nghỉ.<\/li><li>Trên máy tính, đưa chuột lên một chuyến để xem số hiệu và giờ bay.<\/li><\/ol>\n<p>Lịch tự cập nhật khi người làm lịch sửa, không cần tải lại trang. Muốn lưu về máy, bấm <b>Xuất Excel<\/b>.<\/p>\n<h2 id=\"hs3\">3. Ký hiệu trong ô<\/h2>\n<table><thead><tr><th>Thấy trong ô<\/th><th>Nghĩa là<\/th><\/tr><\/thead><tbody><tr><td>Chip nền sáng, ví dụ <code>AK1<\/code><\/td><td>Chuyến ban ngày<\/td><\/tr><tr><td>Chip nền xanh đậm, ví dụ <code>LJ3<\/code><\/td><td>Chuyến ban đêm<\/td><\/tr><tr><td>Chữ nghiêng sau chuyến, ví dụ <code>AK1/S<\/code><\/td><td>Vị trí bạn đảm nhận (S = Supervisor…)<\/td><\/tr><tr><td>🔒<\/td><td>Người làm lịch đã chốt ô này<\/td><\/tr><tr><td><b>OFF<\/b> (nền xám)<\/td><td>Ngày nghỉ. <i>OFF1/2<\/i> là nghỉ nửa ngày<\/td><\/tr><tr><td><b>NP<\/b>, ốm (nền tím)<\/td><td>Nghỉ phép, nghỉ ốm<\/td><\/tr><tr><td><b>SBY<\/b> (nền xanh dương)<\/td><td>Trực dự phòng<\/td><\/tr><tr><td>Ô viền đỏ<\/td><td>Lịch đang có vấn đề, người làm lịch sẽ sửa<\/td><\/tr><tr><td>Ô trống<\/td><td>Chưa xếp việc<\/td><\/tr><\/tbody><\/table>\n<p>Dải vàng <b>Tuần đã chốt<\/b> ở đầu trang nghĩa là lịch tuần đó là bản cuối cùng.<\/p>\n<h2 id=\"hs4\">4. Nhận lịch qua email hoặc Telegram<\/h2>\n<p>Bạn có thể nhận lịch của mình tự động, không cần mở trang.<\/p>\n<ol><li>Bấm <b>🔔 Nhận lịch<\/b> trên thanh trên cùng.<\/li><li>Chọn <b>tên của bạn<\/b> trong danh sách.<\/li><li>Chọn cách nhận:<ul><li><b>Email<\/b>: đánh dấu và kiểm tra địa chỉ email.<\/li><li><b>Telegram<\/b>: bấm <b>Kết nối Telegram<\/b>, Telegram mở ra, bấm <b>Start<\/b>. Khi bot nhắn \"✅ Đã kết nối\" là xong (có thể mất vài giờ, khi người làm lịch mở trang).<\/li><\/ul><\/li><li>Chọn nhận khi <b>Có lịch tuần mới<\/b> và/hoặc khi <b>Lịch của tôi bị thay đổi<\/b>, bấm <b>Lưu<\/b>.<\/li><\/ol>\n<p>Tin nhắn ghi lịch 7 ngày của bạn; ngày bị đổi có dấu \"◀ mới\". Muốn ngừng: <b>🔔 Nhận lịch → Tắt nhận tin<\/b>. Lịch cũng được gửi trong nhóm Zalo của tổ như trước.<\/p>\n<h2 id=\"hs5\">5. Các tab và câu hỏi thường gặp<\/h2>\n<table><thead><tr><th>Tab<\/th><th>Xem gì<\/th><\/tr><\/thead><tbody><tr><td><b>Lịch tuần<\/b><\/td><td>Lịch của mọi người trong tuần<\/td><\/tr><tr><td><b>Quân số<\/b><\/td><td>Mỗi chuyến mỗi ngày có những ai làm<\/td><\/tr><tr><td><b>Thống kê<\/b><\/td><td>Số ca đêm, số ngày làm, số OFF của từng người<\/td><\/tr><\/tbody><\/table>\n<ul><li><b>Muốn đổi ca hoặc xin nghỉ?<\/b> Báo người làm lịch như trước. Trang chỉ để xem, bạn không sửa được.<\/li><li><b>Không thấy tên mình?<\/b> Kiểm tra đúng tuần chưa, gõ ngắn hơn (ví dụ chỉ gõ tên). Vẫn không có thì báo người làm lịch.<\/li><li><b>Tuần sau chưa có?<\/b> Người làm lịch chưa tạo. Quay lại xem sau.<\/li><li><b>Dùng máy khác hoặc máy chung?<\/b> Bấm <b>Đăng xuất<\/b> ở góc phải trên cùng khi xem xong.<\/li><li><b>Cần xem lại hướng dẫn này?<\/b> Bấm <b>📖 Hướng dẫn<\/b> trên thanh trên cùng. Trong đó có nút tải về file Word hoặc in / lưu PDF.<\/li><\/ul>\n<p>Bản quyền © 2026 ThienNV · thiennv@vnpt-technology.vn · 0888.99.33.00<\/p>", "editor": "<h2 id=\"hs1\">Giới thiệu<\/h2>\n<p>Phân Ca Sân Bay là trang web chia lịch và chấm công cho nhân viên mặt đất. Trang tự xếp người vào chuyến theo luật nghỉ ngơi, đếm quân số từng chuyến và xuất ra Excel có màu. Dữ liệu lưu trên Firebase nên mọi người cùng thấy một bản duy nhất, cập nhật ngay khi có người sửa.<\/p>\n<p>Có hai vai trò:<\/p>\n<table><thead><tr><th>Vai trò<\/th><th>Làm được gì<\/th><\/tr><\/thead><tbody><tr><td><b>Người làm lịch<\/b> (editor)<\/td><td>Tạo tuần mới, sửa lịch bay, nhập OFF/NP, tự động chia, sửa tay, nhập dữ liệu từ ảnh, chốt tuần, chỉnh cài đặt, xuất Excel<\/td><\/tr><tr><td><b>Người xem<\/b> (viewer)<\/td><td>Xem Lịch tuần, Quân số, Thống kê; tìm tên mình; xuất Excel. Không sửa được gì<\/td><\/tr><\/tbody><\/table>\n<p>Chủ dự án (email ghi trong dòng <code>OWNERS<\/code> của luật Firebase) luôn là người làm lịch và là người cấp quyền cho người khác.<\/p>\n<p><b>Mẹo:<\/b> trên máy tính, đưa chuột lên bất kỳ nút nào để xem hướng dẫn nhanh của nút đó.<\/p>\n<p><b>Đọc lại hướng dẫn trong trang:<\/b> bấm <b>📖 Hướng dẫn<\/b> trên thanh trên cùng. Người làm lịch thấy cả hai bản (cho người làm lịch và cho nhân viên); người xem chỉ thấy bản cho nhân viên. Mỗi bản tải về được dạng Word hoặc in / lưu PDF.<\/p>\n<h2 id=\"hs2\">Đăng nhập và quyền truy cập<\/h2>\n<p>Mở link trang (dạng <code>https://&lt;tên&gt;.github.io/&lt;kho&gt;/<\/code>) rồi chọn một trong hai cách:<\/p>\n<ol><li><b>Đăng nhập bằng Google<\/b>: bấm nút Google, chọn tài khoản Gmail.<\/li><li><b>Email và mật khẩu<\/b>: lần đầu bấm <b>Tạo tài khoản<\/b>, mở thư xác minh trong hộp thư (xem cả mục Thư rác), bấm link, quay lại trang bấm <b>Tôi đã xác minh<\/b>. Quên mật khẩu thì bấm <b>Quên mật khẩu<\/b>.<\/li><\/ol>\n<p>Nếu trang báo <b>Chưa được cấp quyền<\/b>, hãy gửi email đăng nhập cho người quản lý. Người quản lý thêm email đó vào danh sách, bạn tải lại trang là vào được.<\/p>\n<p><b>Cấp quyền (người quản lý):<\/b> vào <b>Cài đặt &amp; dữ liệu → Quyền truy cập<\/b>.<\/p>\n<ul><li>Ô <b>Người làm lịch<\/b>: mỗi dòng một email, được sửa mọi thứ.<\/li><li>Ô <b>Người xem<\/b>: mỗi dòng một email, chỉ xem.<\/li><li>Bấm <b>Lưu danh sách<\/b>. Xóa email khỏi danh sách là người đó mất quyền ngay.<\/li><li><b>Chép link trang để gửi mọi người<\/b>: chép đường dẫn để dán vào Zalo.<\/li><\/ul>\n<p>Góc phải thanh trên cùng hiện email đang dùng, vai trò, số người khác đang mở trang và nút Đăng xuất.<\/p>\n<h2 id=\"hs3\">Màn hình chính<\/h2>\n<p>Thanh trên cùng chứa mọi thao tác hay dùng; các tab bên dưới chia theo việc. Các nút sửa (tạo tuần, nhập, chia lịch, hoàn tác) chỉ người làm lịch mới thấy.<\/p>\n<table><thead><tr><th>Nút<\/th><th>Tác dụng<\/th><\/tr><\/thead><tbody><tr><td><b>‹ / ›<\/b> và ô chọn tuần<\/td><td>Chuyển sang tuần trước, tuần sau, hoặc chọn tuần bất kỳ đã có<\/td><\/tr><tr><td><b>+ Tuần mới<\/b><\/td><td>Tạo tuần tiếp theo (xem <i>Quy trình mỗi tuần<\/i>)<\/td><\/tr><tr><td><b>↶ Hoàn tác<\/b> / <b>↷<\/b><\/td><td>Bỏ thao tác vừa làm / làm lại. Phím tắt Ctrl+Z, Ctrl+Y<\/td><\/tr><tr><td><b>📷 Nhập từ ảnh<\/b><\/td><td>Chụp hoặc chọn ảnh sổ tay, AI tự đọc rồi hiện bảng kiểm tra<\/td><\/tr><tr><td><b>⇪ Nhập dữ liệu<\/b><\/td><td>Nhập từ ảnh, dán văn bản, CSV hoặc Excel, chọn rõ loại dữ liệu<\/td><\/tr><tr><td><b>Tự động chia<\/b><\/td><td>Máy tự xếp người vào chuyến<\/td><\/tr><tr><td><b>🔔 Nhận lịch<\/b><\/td><td>Đăng ký nhận lịch của mình qua Email / Telegram (mọi người đều thấy)<\/td><\/tr><tr><td><b>📖 Hướng dẫn<\/b><\/td><td>Mở hướng dẫn này, tải Word hoặc in / lưu PDF<\/td><\/tr><tr><td>Chấm tròn trạng thái<\/td><td>Xanh <i>Đã lưu · đồng bộ<\/i>; vàng <i>Đang lưu<\/i>; đỏ là chưa lưu được, kèm lý do<\/td><\/tr><\/tbody><\/table>\n<table><thead><tr><th>Tab<\/th><th>Ai thấy<\/th><th>Dùng để<\/th><\/tr><\/thead><tbody><tr><td><b>Lịch tuần<\/b><\/td><td>Mọi người<\/td><td>Bảng lịch chính, sửa từng ô, đếm quân số cuối bảng<\/td><\/tr><tr><td><b>Order nghỉ<\/b><\/td><td>Người làm lịch<\/td><td>Nhập OFF, NP, ốm, SBY cho cả tuần<\/td><\/tr><tr><td><b>Quân số<\/b><\/td><td>Mọi người<\/td><td>Mỗi chuyến mỗi ngày đã đủ người chưa<\/td><\/tr><tr><td><b>Lịch bay<\/b><\/td><td>Người làm lịch<\/td><td>Bật/tắt chuyến (BAY/CANX), sửa giờ, định mức riêng<\/td><\/tr><tr><td><b>Thống kê<\/b><\/td><td>Mọi người<\/td><td>Mức công bằng, cảnh báo, chi tiết từng người<\/td><\/tr><tr><td><b>Chấm công<\/b><\/td><td>Người làm lịch<\/td><td>OVER, BÙ, giờ công<\/td><\/tr><tr><td><b>Cài đặt &amp; dữ liệu<\/b><\/td><td>Người làm lịch<\/td><td>Nhân viên, slot, mã trạng thái, luật, nhập/xuất, quyền<\/td><\/tr><\/tbody><\/table>\n<h2 id=\"hs4\">Quy trình mỗi tuần<\/h2>\n<p>Mỗi tuần người làm lịch đi qua 8 bước, thường mất 10–20 phút.<\/p>\n<ol><li><b>Tạo tuần:<\/b> bấm <b>+ Tuần mới<\/b>, kiểm tra ngày thứ Hai, chọn một trong ba cách:<ul><li><i>Chép lịch bay từ tuần đang mở<\/i> (nên dùng): phân công để trống, mang theo CN cuối tuần và số đêm để xoay vòng.<\/li><li><i>Chép cả phân công<\/i>: giữ nguyên ai làm slot nào theo thứ, bỏ trạng thái nghỉ.<\/li><li><i>Tuần trống theo lịch bay mặc định<\/i>.<\/li><\/ul><\/li><li><b>Lịch bay:<\/b> vào tab Lịch bay, bấm <b>BAY ↔ CANX<\/b> cho chuyến huỷ, sửa giờ nếu đổi, đặt định mức riêng nếu ngày đó cần nhiều/ít người hơn.<\/li><li><b>Order nghỉ:<\/b> vào tab Order nghỉ, chọn OFF, NP, ốm… cho từng người. Hoặc bấm <b>📷 Nhập từ ảnh<\/b> và chụp trang sổ đăng ký nghỉ.<\/li><li><b>Tự động chia:<\/b> bấm <b>Tự động chia → Chia lịch<\/b>. Mất khoảng 1 giây.<\/li><li><b>Kiểm tra:<\/b> xem bảng đếm cuối tab Lịch tuần hoặc tab Quân số; ô đỏ là chuyến thiếu người. Xem tab Thống kê để biết cảnh báo và độ công bằng.<\/li><li><b>Sửa tay:<\/b> bấm vào ô cần đổi. Ô nào đã ưng thì bấm 🔒 để khóa, lần chia sau máy không đổi ô đó.<\/li><li><b>Gửi lịch:<\/b> bấm <b>📣 Gửi lịch<\/b> để gửi qua Email / Telegram và chép tin cho Zalo (xem mục <i>Gửi lịch cho nhân viên<\/i>).<\/li><li><b>Cuối tuần:<\/b> nhập chấm công (OVER/BÙ), xuất Excel nếu cần gửi, rồi bấm <b>🔒 Chốt tuần<\/b>.<\/li><\/ol>\n<p>Nếu có người xin nghỉ sau khi đã chia: nhập nghỉ ở Order nghỉ, rồi bấm <b>Tự động chia → Chỉ lấp chỗ trống<\/b>. Máy gỡ người đó khỏi chuyến (trừ ô đã khóa) và xếp người thay.<\/p>\n<h2 id=\"hs5\">Tab Lịch tuần<\/h2>\n<p>Mỗi dòng là một nhân viên, mỗi cột là một ngày từ thứ Hai đến Chủ nhật. Trong ô là các chuyến được xếp hoặc trạng thái nghỉ.<\/p>\n<p><b>Đọc ô:<\/b><\/p>\n<ul><li>Chip màu là một chuyến (slot); 🔒 là ô đã khóa.<\/li><li>Chữ OFF, NP, ốm, SBY… là trạng thái nghỉ hoặc trực.<\/li><li>Viền đỏ là ô vi phạm luật (thiếu giờ nghỉ, trùng giờ, quá số đêm, đang nghỉ mà vẫn có chuyến…). Đưa chuột lên ô để xem lý do.<\/li><\/ul>\n<p><b>Sửa một ô (người làm lịch):<\/b> bấm vào ô, bảng bên phải mở ra.<\/p>\n<ol><li><b>Trạng thái<\/b>: chọn OFF, NP, ốm… hoặc để trống nếu đi làm.<\/li><li><b>Chuyến đã xếp<\/b>: bấm 🔓/🔒 để khóa hoặc mở khóa từng chuyến; bấm × để bỏ chuyến.<\/li><li><b>Thêm chuyến<\/b>: chọn vị trí (Thường, Supervisor…) rồi bấm chuyến. Dòng mờ là chuyến không hợp lệ (trùng giờ, thiếu nghỉ); vẫn thêm được khi cần ngoại lệ, lịch sẽ báo đỏ.<\/li><li><b>Ghi chú<\/b>: ghi thêm nếu cần.<\/li><li>Dùng <b>‹ Ngày trước / Ngày sau ›<\/b>, <b>↑ Người trên / ↓ Người dưới<\/b> để sửa liền nhiều ô mà không đóng bảng.<\/li><\/ol>\n<p><b>Thanh công cụ trên bảng:<\/b><\/p>\n<table><thead><tr><th>Công cụ<\/th><th>Tác dụng<\/th><\/tr><\/thead><tbody><tr><td>Ô <i>Tìm nhân viên<\/i><\/td><td>Gõ tên để chỉ hiện người đó. Nhân viên dùng để xem lịch của mình<\/td><\/tr><tr><td><i>Tất cả nhóm<\/i><\/td><td>Lọc theo nhóm<\/td><\/tr><tr><td><i>Chỉ người có cảnh báo<\/i><\/td><td>Ẩn người không có vấn đề để tập trung sửa<\/td><\/tr><tr><td><i>Đếm quân số cuối bảng<\/i><\/td><td>Bật bảng đếm giống hàm COUNT trong Excel<\/td><\/tr><tr><td><b>↓ Xuống bảng đếm<\/b><\/td><td>Cuộn thẳng xuống bảng đếm<\/td><\/tr><tr><td><b>🔒 Chốt tuần<\/b><\/td><td>Khóa cả tuần (xem mục <i>Chốt tuần<\/i>)<\/td><\/tr><tr><td><b>📣 Gửi lịch<\/b><\/td><td>Gửi lịch cho nhân viên qua Email / Telegram, chép tin cho Zalo<\/td><\/tr><\/tbody><\/table>\n<p><b>Bảng đếm cuối bảng:<\/b> mỗi dòng là một chuyến, mỗi ô ghi <i>đã xếp / cần<\/i>. Ô đỏ là thiếu người, ô xanh là đủ. Bấm vào ô để xem ai đang làm và thêm người phù hợp ngay tại đó.<\/p>\n<h2 id=\"hs6\">Khi chia không đủ người<\/h2>\n<p>Nếu Tự động chia báo còn thiếu, bấm <b>🛠 Đề xuất sửa nhanh<\/b> (hoặc nút <b>🛠 Đề xuất lấp … chỗ thiếu<\/b> ở tab Quân số).<\/p>\n<ol><li><b>Đủ người không?<\/b> Bảng 7 ngày ghi <i>số lượt cần / số lượt tối đa<\/i> (số người đi làm được × số chuyến tối đa mỗi người/ngày). Ô đỏ nghĩa là dù chia khéo cũng không đủ: phải giảm định mức, thêm người (huỷ bớt OFF/NP ngày đó) hoặc cho làm thêm chuyến.<\/li><li><b>Từng chỗ thiếu:<\/b> mỗi chỗ có sẵn nút bấm:<ul><li><b>Xếp [tên]<\/b>: người này rảnh và hợp lệ.<\/li><li><b>Dời OFF [tên] sang [ngày] rồi xếp<\/b>: chỉ với OFF do máy tự thêm.<\/li><li><b>Xếp ngoại lệ [tên] (vượt: …)<\/b>: người gần đủ điều kiện nhất, chỉ vượt 1 luật nhẹ (ví dụ đã có 2 chuyến/ngày, nghỉ chưa đủ 6h). Ô được khoá 🔒 và chỉ cảnh báo vàng \"Ngoại lệ đã duyệt\".<\/li><li><b>Giảm định mức −1<\/b> cho chuyến đó ngày đó, hoặc <b>/SE → NV thường<\/b> khi thiếu người có vị trí đặc biệt.<\/li><\/ul><\/li><li><b>Thử nới luật cho cả tuần:<\/b> máy thử chia lại với từng cách (3 chuyến/ngày, thêm 1 ca đêm/tuần, đóng quầy sớm hơn 15 phút, nghỉ tối thiểu ít hơn 1 giờ, mở quầy 2,5 tiếng) và cho biết mỗi cách lấp được bao nhiêu chỗ. Bấm <b>Áp dụng &amp; chia lại<\/b> cho cách phù hợp.<\/li><\/ol>\n<p>Nếu còn nhiều chỗ có người rảnh, trang hiện nút <b>Tự động lấp chỗ trống<\/b> ở đầu để máy lấp trước.<\/p>\n<h2 id=\"hs7\">Tab Lịch bay, Order nghỉ, Quân số<\/h2>\n<h3 id=\"hs8\">Lịch bay<\/h3>\n<p>Lịch bay thay đổi theo tuần nên mỗi tuần có bản riêng; sửa tuần này không ảnh hưởng tuần khác.<\/p>\n<ul><li>Bấm <b>BAY<\/b> để chuyển thành <b>CANX<\/b> khi chuyến bị huỷ ngày đó (bấm lại để bật).<\/li><li>Sửa số hiệu và giờ ngay trong ô. Giờ ghi 4 chữ số, ví dụ <code>0215<\/code>; máy dùng giờ này để tính trùng giờ và giờ nghỉ.<\/li><li>Bấm dòng <b>định mức<\/b> để đặt số người riêng cho ngày đó (ghi <i>(riêng)<\/i> khi khác mặc định).<\/li><li><b>Đặt lại theo lịch bay mặc định<\/b>: bỏ mọi thay đổi của tuần, lấy lại từ Cài đặt → Slot.<\/li><li><b>Nhập từ ảnh / văn bản<\/b>: dán hoặc chụp lịch bay hãng gửi.<\/li><\/ul>\n<h3 id=\"hs9\">Chuyến delay<\/h3>\n<ol><li>Ở tab Lịch bay, bấm <b>⏱ báo delay<\/b> dưới chuyến bị delay (ví dụ TW4 đêm T2), nhập số phút hoặc bấm nhanh +30' … +180'.<\/li><li>Bảng bên dưới liệt kê người làm chuyến đó (kể cả người trong ca làm chung G2/G3) và ca hôm sau của họ. Ai bị <b>thiếu nghỉ<\/b> thì chọn:<ul><li><b>Đổi sang ca trễ hơn<\/b>: trang đổi ca với một người không bị delay (người đó lên ca sớm hơn).<\/li><li><b>Giữ nguyên ca (người này muốn)<\/b>: lịch giữ nguyên, chỉ cảnh báo vàng.<\/li><\/ul><\/li><li>Bấm <b>Áp dụng<\/b>. Trang báo lại ai đã đổi với ai; chưa ưng thì bấm Hoàn tác. Ô đã khoá 🔒 không bị đổi.<\/li><\/ol>\n<h3 id=\"hs10\">Order nghỉ<\/h3>\n<p>Nhập nghỉ của cả tuần trước khi chia. Chọn trong ô là lưu ngay.<\/p>\n<ul><li>Mỗi ô là danh sách: Nghỉ (OFF, OFF1/2…), Phép/ốm (NP, ốm…), Standby (SBY), Việc khác (học, TKT…).<\/li><li>Đầu cột ghi tổng OFF và phép/ốm từng ngày để cân số người nghỉ. Cột cuối là tổng OFF của mỗi người.<\/li><li>Ô hiện chip chuyến bên dưới là người đó đã có chuyến; nhập nghỉ vào đó sẽ báo đỏ ở Lịch tuần cho đến khi chia lại.<\/li><li><b>Xoá hết OFF tự thêm<\/b>: bỏ các ngày OFF máy tự thêm khi chia, giữ OFF bạn nhập.<\/li><\/ul>\n<h3 id=\"hs11\">Quân số<\/h3>\n<p>Bảng chuyến × ngày, mỗi ô ghi <i>đã xếp / định mức<\/i>; dòng nhỏ bên dưới là vị trí đặc biệt (Supervisor…). Ô đỏ là thiếu người. Bấm vào ô để xem ai đang làm, bấm <b>Bỏ<\/b> để gỡ người, hoặc chọn người phù hợp trong danh sách gợi ý để thêm.<\/p>\n<h2 id=\"hs12\">Tự động chia<\/h2>\n<p><b>Cách tính giờ làm:<\/b> mỗi chuyến tính từ lúc mở quầy (3 tiếng trước giờ bay) đến lúc đóng quầy (1 tiếng trước giờ bay). Vì vậy một người được ghép 2 chuyến cách nhau từ 2 tiếng (như AK3 16:05 + FD4 18:10, FD1 10:05 + OD 12:50) giống cách chia tay, còn chuyến sát giờ (MH 11:25 + FD3 12:00) bị chặn. Đổi ở Cài đặt → Quy tắc (Phút làm trước / sau giờ chuyến).<\/p>\n<p><b>Học theo các tuần đã chia:<\/b> khi bấm Tự động chia, máy đọc 4 tuần gần nhất và ưu tiên xếp mỗi người vào hãng / chuyến họ hay làm, cặp chuyến hay ghép (G3 + TW1, RS + Z2, EK + MH…), và hạn chế quá 5 đêm/tuần. Lượt do người chia đặt được tính nặng hơn lượt máy tự xếp. Muốn máy học nhanh: nhập file Excel lịch đã chia tay của 1–2 tuần gần nhất (⇪ Nhập dữ liệu → Excel). Chỉnh mức ưu tiên ở Cài đặt → Quy tắc. Các chuyến đêm TW (TW26, TW14, TW30) mở quầy làm chung: xếp người vào ca <b>G3<\/b> (G3/S là sup cho cả 3 chuyến; lên ca 22:25 đêm có TW26, 22:00 đêm không có) và <b>G2<\/b> (lên ca 00:50). Lịch xếp trước đây bị trùng giờ: bấm <b>Tự động chia → Chỉ lấp chỗ trống<\/b>, máy tự gỡ chỗ trùng (trừ ô khoá) rồi xếp lại.<\/p>\n<p>Bấm <b>Tự động chia<\/b>, chọn cách chia rồi bấm <b>Chia lịch<\/b>. Máy xếp từng ngày: lấp vị trí khó trước (Supervisor, vị trí đặc biệt, slot ít người làm được), chọn người hợp lệ đang ít việc nhất, rồi cân bằng giờ đêm giữa mọi người.<\/p>\n<table><thead><tr><th>Cách chia<\/th><th>Khi nào dùng<\/th><\/tr><\/thead><tbody><tr><td><b>Chỉ lấp chỗ trống<\/b><\/td><td>Đã có lịch, chỉ cần bù chỗ thiếu (có người xin nghỉ đột xuất, thêm chuyến). Giữ mọi phân công hiện có<\/td><\/tr><tr><td><b>Xếp lại toàn bộ<\/b><\/td><td>Tuần mới, hoặc muốn một phương án khác. Bỏ phân công chưa khóa và OFF tự thêm rồi chia từ đầu<\/td><\/tr><\/tbody><\/table>\n<ul><li><i>Tự thêm 1 ngày OFF cho người chưa có<\/i>: máy chọn ngày ít người nghỉ nhất. Ở tab Order nghỉ, OFF tự thêm có viền nét đứt để phân biệt với OFF bạn nhập.<\/li><li>Máy <b>không bao giờ<\/b> đổi ô đã khóa 🔒 và trạng thái nghỉ bạn nhập.<\/li><li>Mỗi lần <i>Xếp lại<\/i> cho phương án hơi khác. Chưa ưng thì bấm <b>↶ Hoàn tác<\/b>.<\/li><li>Chạy xong, trang báo số lượt đã xếp và chuyến còn thiếu (nếu có), kèm nút <b>Xem quân số<\/b>.<\/li><\/ul>\n<p>Trên thanh công cụ tab Lịch tuần còn có hai nút hỗ trợ: <b>Khoá phân công hiện có<\/b> (khóa hết ô đã xếp để lần chia sau giữ nguyên) và <b>Xoá phân công chưa khoá<\/b> (làm trống để chia lại).<\/p>\n<h2 id=\"hs13\">Nhập dữ liệu từ ảnh, văn bản, CSV, Excel<\/h2>\n<p>Cách nhanh nhất: bấm <b>📷 Nhập từ ảnh<\/b>, chụp trang sổ hoặc chọn ảnh nhận qua Zalo. AI tự nhận biết loại dữ liệu và hiện bảng kiểm tra. Muốn chọn rõ hơn thì bấm <b>⇪ Nhập dữ liệu<\/b>.<\/p>\n<p><b>Bước 1 – Loại dữ liệu:<\/b><\/p>\n<table><thead><tr><th>Loại<\/th><th>Nhập gì<\/th><\/tr><\/thead><tbody><tr><td>Tự nhận biết<\/td><td>AI tự xem ảnh là loại nào<\/td><\/tr><tr><td>Phân ca<\/td><td>Chuyến + trạng thái của từng người, từng ngày<\/td><\/tr><tr><td>OFF / NP / nghỉ<\/td><td>Chỉ trạng thái, giữ nguyên chuyến đã xếp<\/td><\/tr><tr><td>Chấm công<\/td><td>Phút OVER / BÙ ngày, đêm<\/td><\/tr><tr><td>Lịch bay<\/td><td>Chuyến, giờ, CANX theo ngày<\/td><\/tr><\/tbody><\/table>\n<p><b>Bước 2 – Nguồn:<\/b><\/p>\n<table><thead><tr><th>Nguồn<\/th><th>Cách đọc<\/th><th>Cần AI?<\/th><\/tr><\/thead><tbody><tr><td>Ảnh chụp, ảnh màn hình, PDF<\/td><td>Bấm <b>Đọc bằng AI<\/b><\/td><td>Có<\/td><\/tr><tr><td>Dán bảng từ Excel / Google Sheets<\/td><td>Bấm <b>Đọc như bảng<\/b><\/td><td>Không<\/td><\/tr><tr><td>Văn bản tự do (tin Zalo, email)<\/td><td>Bấm <b>Đọc bằng AI<\/b><\/td><td>Có<\/td><\/tr><tr><td>File CSV / TSV / TXT<\/td><td>Đọc theo cột<\/td><td>Không<\/td><\/tr><tr><td>File Excel mẫu cũ<\/td><td><b>Chọn file Excel…<\/b><\/td><td>Không<\/td><\/tr><\/tbody><\/table>\n<p>Với ảnh: chọn nhiều ảnh cùng lúc được; ảnh nghiêng bấm <b>⟳ Xoay<\/b>; ảnh chọn nhầm bấm <b>Bỏ<\/b>. Trong lúc đọc, trang hiện tiến độ từng ảnh; bấm <b>Dừng<\/b> để huỷ. AI báo bận thì trang tự thử lại; ảnh nào vẫn lỗi thì bấm <b>Đọc lại ảnh lỗi<\/b>.<\/p>\n<p><b>Bước 3 – Kiểm tra:<\/b><\/p>\n<ol><li>Bảng kiểm tra hiện ảnh gốc bên cạnh, mỗi dòng ghi nội dung đọc được và nội dung đang có trong lịch.<\/li><li>Dòng vàng là cần xem lại (tên chưa khớp, chữ mờ). Bật <i>Chỉ hiện dòng cần xem lại<\/i> để lọc.<\/li><li>Sửa trực tiếp: chọn lại nhân viên, ngày, trạng thái, chuyến; bỏ chọn dòng không muốn nhập.<\/li><li>Bấm <b>Kiểm tra xong, nhập vào lịch…<\/b>. Trang hỏi lại <i>Dữ liệu đã chuẩn chưa?<\/i>.<\/li><li>Xác nhận: trang <b>tự tạo bản sao lưu<\/b> của tuần rồi mới ghi.<\/li><\/ol>\n<p><b>Nhập sai thì sao:<\/b> bấm <b>↶ Hoàn tác<\/b> ngay sau khi nhập. Nếu đã làm thêm nhiều việc, vào <b>Cài đặt &amp; dữ liệu → Nhập / xuất dữ liệu → Xem và khôi phục…<\/b>, chọn bản sao lưu trước lần nhập đó và bấm <b>Khôi phục<\/b>. Trang giữ 30 bản gần nhất.<\/p>\n<p><b>Mẹo chụp ảnh:<\/b> chụp thẳng, đủ sáng, cả bảng nằm trong khung; bảng dài thì chụp nhiều ảnh. Viết tên đúng như danh sách nhân viên sẽ giảm dòng vàng.<\/p>\n<h2 id=\"hs14\">Thống kê, Chấm công, Xuất Excel<\/h2>\n<h3 id=\"hs15\">Thống kê<\/h3>\n<ul><li>Hàng số liệu trên cùng: vị trí còn thiếu, tỷ lệ đã phủ (%), số lỗi, số cảnh báo.<\/li><li><b>Mức độ công bằng<\/b>: biểu đồ từng người, chọn thước đo <i>Giờ công đêm<\/i>, <i>Số ca đêm<\/i>, <i>Số slot<\/i>, <i>Ngày làm<\/i>. Vạch vàng là trung bình.<\/li><li><b>Cảnh báo và vi phạm<\/b>: dòng đỏ là lỗi phải sửa, dòng vàng là cảnh báo. Bấm một dòng để nhảy đến ô đó.<\/li><li><b>Chi tiết theo nhân viên<\/b>: slot, đêm, đêm tuần trước, giờ đêm, ngày làm, OFF, phép/ốm, SBY và số chuyến theo từng hãng.<\/li><\/ul>\n<h3 id=\"hs16\">Chấm công<\/h3>\n<ol><li>Chọn ngày ở hàng nút phía trên.<\/li><li>Nhập số <b>phút<\/b> OVER ngày, OVER đêm, BÙ ngày, BÙ đêm cho từng người. Gõ xong là lưu.<\/li><li>Các cột tổng, giờ công và giờ đêm tự tính. Giờ công mặc định = số ngày làm × 8 giờ (đổi ở Cài đặt → Quy tắc).<\/li><\/ol>\n<p>Có thể chụp sổ chấm công rồi nhập bằng <b>📷 Nhập từ ảnh<\/b>.<\/p>\n<h3 id=\"hs17\">Xuất Excel<\/h3>\n<p>Bấm <b>Xuất Excel<\/b> (tab Lịch tuần) hoặc <b>Tải file Excel<\/b> (Cài đặt → Nhập / xuất). File có màu giống trên web, gồm 7 sheet: Lịch tuần (kèm bảng đếm quân số), Quân số, Lịch bay, Order nghỉ, Thống kê, Chấm công, Cảnh báo. Khổ in ngang, có số trang. Người xem cũng xuất được.<\/p>\n<h2 id=\"hs18\">Chốt tuần và nhân viên nghỉ việc<\/h2>\n<p>Chốt tuần giữ lịch đã chạy và chấm công đúng như lúc đó, kể cả khi sau này danh sách nhân viên hoặc chuyến thay đổi.<\/p>\n<ol><li>Mở tuần đã xong và đã chấm công.<\/li><li>Bấm <b>🔒 Chốt tuần<\/b> trên thanh công cụ tab Lịch tuần, xác nhận.<\/li><li>Đầu trang hiện dải <b>Tuần đã chốt<\/b> kèm thời điểm và người chốt.<\/li><\/ol>\n<p>Tuần đã chốt không sửa được: không nhập dữ liệu, không tự động chia, không sửa cài đặt trong lúc đang mở tuần đó. Vẫn xem và xuất Excel bình thường. Cần sửa thì bấm <b>Mở khoá để sửa<\/b> trên dải báo, sửa xong chốt lại.<\/p>\n<p><b>Nhân viên nghỉ việc, chuyến bỏ hẳn:<\/b> khi bấm <b>Xoá<\/b> ở Cài đặt, trang hỏi lại và gợi ý:<\/p>\n<ul><li><b>Chuyển sang tạm nghỉ<\/b> (với người) hoặc <b>Tắt slot<\/b> (với chuyến): ẩn khỏi các tuần mới nhưng tuần cũ vẫn còn tên. Nên chọn cách này.<\/li><li><b>Xoá hẳn<\/b>: chỉ dùng khi nhập nhầm. Tuần đã chốt vẫn giữ tên; tuần chưa chốt sẽ mất dòng của người đó.<\/li><\/ul>\n<h2 id=\"hs19\">Cài đặt &amp; dữ liệu<\/h2>\n<p>Cài đặt dùng chung cho mọi tuần chưa chốt; sửa xong là lưu và tính lại cảnh báo ngay.<\/p>\n<table><thead><tr><th>Mục<\/th><th>Chỉnh gì<\/th><\/tr><\/thead><tbody><tr><td><b>Nhân viên<\/b><\/td><td>Tên, nhóm, loại (Chuyến bay / Ticket / PVDB), vị trí được xếp (/S, /C, /G…), Không đêm, Tự động chia (bỏ chọn = chỉ xếp tay), Đang làm (bỏ chọn = tạm nghỉ), Chỉ làm (để trống = mọi hãng; ghi ví dụ AK, FD, VZ1 để giới hạn), ghi chú. <b>+ Thêm nhân viên<\/b> ở đầu bảng<\/td><\/tr><tr><td><b>Slot chuyến bay<\/b><\/td><td>Hãng, số hiệu, giờ, tuyến, giờ đêm, phút làm trước/sau chuyến (mặc định mở quầy 3 tiếng trước giờ bay), <b>Lên ca<\/b>, <b>Lên ca nếu có chuyến<\/b> (vd TW3=2225), <b>Xuống ca<\/b>, <b>Làm chung chuyến<\/b> (vd G3 làm chung TW3, TW4, TW5), số người cần theo từng vị trí, ngày bay mặc định T2→CN. <b>+ Thêm slot<\/b><\/td><\/tr><tr><td><b>Mã trạng thái<\/b><\/td><td>OFF, NP, ốm, SBY, học…: ý nghĩa, có chặn xếp chuyến không, loại (nghỉ / phép / standby / việc khác), tính bao nhiêu OFF. <b>+ Thêm mã<\/b><\/td><\/tr><tr><td><b>Quy tắc chia lịch<\/b><\/td><td>Tối đa slot/ngày, giờ nghỉ tối thiểu giữa 2 ngày, tối đa ca đêm/tuần, OFF tối thiểu, tối đa ngày làm, phút trước/sau chuyến, giờ ranh giới qua đêm, cặp slot được làm cùng giờ, giờ công mỗi ca, tự thêm OFF, tên nhóm<\/td><\/tr><tr><td><b>Nhập / xuất dữ liệu<\/b><\/td><td>Nhập từ ảnh/văn bản, bản sao lưu tự động, nhập file Excel mẫu cũ, tải file Excel, tải/khôi phục bản sao lưu toàn bộ (JSON), xoá tuần, Đọc ảnh bằng AI, Thư viện của trang<\/td><\/tr><tr><td><b>Quyền truy cập<\/b><\/td><td>Danh sách email người làm lịch và người xem<\/td><\/tr><tr><td><b>Gửi tin<\/b><\/td><td>Bật gửi lịch qua Email (Gmail) và Telegram, xem danh sách người đăng ký<\/td><\/tr><\/tbody><\/table>\n<p><b>Bật AI đọc ảnh (người quản lý làm một lần):<\/b><\/p>\n<ol><li>Mở aistudio.google.com/apikey, đăng nhập Google, bấm <b>Create API key<\/b>, chép khoá (dạng <code>AQ.Ab…<\/code>).<\/li><li>Vào <b>Nhập / xuất dữ liệu → Đọc ảnh bằng AI<\/b>, dán khoá, bấm <b>Bật cho cả nhóm<\/b>.<\/li><li>Bấm <b>Kiểm tra khoá<\/b> để thử. <b>Đổi khoá<\/b> khi cần thay, <b>Tắt AI<\/b> để ngừng.<\/li><\/ol>\n<p>Khoá lưu trên Firebase, chỉ người làm lịch dùng được. Không dán khoá vào file nào trên GitHub.<\/p>\n<p><b>Thư viện của trang (một lần):<\/b> bấm <b>Tải bộ thư viện (lib.zip)<\/b>, giải nén ra thư mục <code>lib<\/code>, tải cả thư mục lên kho GitHub cùng chỗ với <code>index.html<\/code>. Khi đã xong, mục này hiện <i>✓ Đã lưu trong kho GitHub<\/i>.<\/p>\n<p><b>Sao lưu định kỳ:<\/b> cuối mỗi tuần bấm <b>Tải bản sao lưu<\/b> để giữ một file JSON trên máy. File này chứa tên nhân viên, không đưa lên GitHub.<\/p>\n<h2 id=\"hs20\">Gửi lịch cho nhân viên (Zalo, SMS, Email, Telegram)<\/h2>\n<p>Cách đơn giản nhất chỉ cần <b>số điện thoại<\/b> và/hoặc <b>email<\/b> của từng người. Nhân viên không phải đăng ký gì.<\/p>\n<p><b>Nhập danh bạ (một lần):<\/b> vào <b>Cài đặt &amp; dữ liệu → Gửi tin → Danh bạ nhận lịch<\/b>.<\/p>\n<ul><li>Gõ SĐT, email vào từng dòng, hoặc bấm <b>Dán nhanh cả danh sách<\/b>: mỗi dòng <i>Tên, SĐT, email<\/i> (chép từ Excel/Zalo được), bấm <b>Điền vào danh bạ<\/b>.<\/li><li>Danh bạ chỉ người làm lịch xem được.<\/li><\/ul>\n<p><b>Gửi mỗi tuần:<\/b> bấm <b>📣 Gửi lịch<\/b> ở tab Lịch tuần, chọn <b>Lịch cả tuần<\/b> hoặc <b>Chỉ người có thay đổi<\/b> (ngày đổi được đánh dấu \"◀ mới\"). Ở danh sách <b>Gửi từng người<\/b>:<\/p>\n<table><thead><tr><th>Nút<\/th><th>Làm gì<\/th><th>Bạn cần làm<\/th><\/tr><\/thead><tbody><tr><td><b>Zalo<\/b><\/td><td>Chép sẵn tin và mở khung chat Zalo của số điện thoại đó<\/td><td>Dán (giữ ngón tay → Dán) rồi gửi<\/td><\/tr><tr><td><b>SMS<\/b><\/td><td>Mở tin nhắn điện thoại soạn sẵn (dùng trên điện thoại)<\/td><td>Bấm gửi<\/td><\/tr><tr><td><b>Email<\/b><\/td><td>Mở thư soạn sẵn trong ứng dụng email<\/td><td>Bấm gửi<\/td><\/tr><tr><td><b>Chép<\/b><\/td><td>Chép tin để dán vào bất cứ đâu<\/td><td><\/td><\/tr><\/tbody><\/table>\n<p>Nút <b>Chép tin cho nhóm Zalo<\/b> tạo tin báo \"lịch đã có\" kèm danh sách người bị đổi lịch, để dán vào nhóm Zalo của tổ.<\/p>\n<p><b>Tuỳ chọn: gửi tự động, không phải bấm từng người<\/b><\/p>\n<ul><li><b>Email tự động<\/b> (miễn phí qua Gmail, khoảng 100 thư/ngày): ở Cài đặt → Gửi tin, làm 5 bước tạo Google Apps Script (khoảng 10 phút, một lần). Sau đó bấm <b>Gửi ngay<\/b> là email tự đi tới mọi người có email trong danh bạ.<\/li><li><b>Telegram tự động:<\/b> tạo bot với @BotFather, dán mã bot. Telegram không gửi được theo số điện thoại, nên nhân viên phải tự bấm <b>🔔 Nhận lịch → Kết nối Telegram<\/b> một lần.<\/li><li>Zalo không có cách gửi tự động miễn phí, nên dùng nút Zalo ở trên.<\/li><\/ul>\n<p>Nhân viên vẫn có thể tự bấm <b>🔔 Nhận lịch<\/b> để tự nhập email của mình; người làm lịch không cần làm gì thêm.<\/p>\n<h2 id=\"hs21\">Câu hỏi thường gặp và xử lý lỗi<\/h2>\n<table><thead><tr><th>Gặp<\/th><th>Cách xử lý<\/th><\/tr><\/thead><tbody><tr><td><i>Chưa được cấp quyền<\/i><\/td><td>Gửi email đăng nhập cho người quản lý để thêm vào Quyền truy cập<\/td><\/tr><tr><td>Không thấy nút sửa, Tự động chia<\/td><td>Tài khoản đang là Người xem<\/td><\/tr><tr><td><i>Tuần này đã chốt nên không sửa được<\/i><\/td><td>Bấm <b>Mở khoá để sửa<\/b> trên dải báo đầu trang<\/td><\/tr><tr><td><i>Không có quyền ghi… hãy dán lại firestore.rules<\/i><\/td><td>Người quản lý dán file <code>firestore.rules<\/code> mới vào Firebase và bấm Publish<\/td><\/tr><tr><td><i>AI đọc ảnh chưa được bật<\/i><\/td><td>Người quản lý bật theo mục <i>Cài đặt<\/i>. Trong lúc chờ, dùng Dán văn bản<\/td><\/tr><tr><td><i>Gemini đang quá tải<\/i><\/td><td>Trang tự thử lại. Nếu vẫn lỗi, đợi vài phút rồi bấm <b>Đọc lại ảnh lỗi<\/b><\/td><\/tr><tr><td>AI đọc sai tên<\/td><td>Chọn lại tên trong bảng kiểm tra trước khi nhập<\/td><\/tr><tr><td>Nhập nhầm dữ liệu<\/td><td>↶ Hoàn tác, hoặc khôi phục bản sao lưu tự động<\/td><\/tr><tr><td>Chuyến vẫn thiếu sau khi chia<\/td><td>Không còn người hợp lệ (đã nghỉ, thiếu giờ nghỉ, hết số đêm). Bấm ô đỏ ở Quân số để thêm ngoại lệ, hoặc nới quy tắc<\/td><\/tr><tr><td>Người khác không thấy thay đổi<\/td><td>Xem chấm trạng thái đã xanh <i>Đã lưu · đồng bộ<\/i> chưa. Tab ở nền quá 1 phút sẽ tự đồng bộ khi mở lại<\/td><\/tr><tr><td>Nhân viên bấm Start mà chưa kết nối Telegram<\/td><td>Người làm lịch mở trang, vào Cài đặt → Gửi tin → <b>Cập nhật kết nối<\/b>. Nếu đã quá 1 ngày, nhân viên bấm Kết nối lại<\/td><\/tr><tr><td>Email báo <i>Sai khoá bí mật<\/i><\/td><td>Bấm <b>Chép mã Apps Script<\/b> lại, dán đè vào Apps Script, Triển khai → Quản lý triển khai → sửa → Phiên bản mới<\/td><\/tr><tr><td>GitHub đã cập nhật mà trang chưa đổi<\/td><td>Đợi 1–2 phút rồi tải lại trang (Ctrl+F5)<\/td><\/tr><\/tbody><\/table>\n<p>Bản quyền © 2026 ThienNV · thiennv@vnpt-technology.vn · 0888.99.33.00<\/p>"};
/* ---------- Hướng dẫn sử dụng trong trang ---------- */
/* HELP_DOCS được build.py tạo từ help_staff.md và help_editor.md */
const HelpUI = {
  open: false, which: 'staff',
  docs() {
    const editor = !S.ro && !(typeof FBX !== 'undefined' && FBX.role === 'viewer');
    const list = [{ k: 'staff', name: 'Cho nhân viên xem lịch', title: 'Hướng dẫn xem lịch cho nhân viên' }];
    if (editor && !S.gate) list.push({ k: 'editor', name: 'Cho người làm lịch', title: 'Hướng dẫn sử dụng cho người làm lịch' });
    return list;
  },
  show(which) {
    const list = this.docs();
    this.which = list.some(d => d.k === which) ? which : (list.length > 1 && !S.ro ? 'editor' : 'staff');
    this.open = true; this.render();
  },
  close() { this.open = false; const h = $('#helpHost'); if (h) h.innerHTML = ''; document.body.classList.remove('helpopen'); },
  render() {
    let h = $('#helpHost');
    if (!h) { h = document.createElement('div'); h.id = 'helpHost'; document.body.appendChild(h); }
    const list = this.docs(), cur = list.find(d => d.k === this.which) || list[0];
    const body = HELP_DOCS[cur.k] || '';
    const toc = [...body.matchAll(/<h2 id="(hs\d+)">(.*?)<\/h2>/g)].map(m => '<a href="#' + m[1] + '" data-hgo="' + m[1] + '">' + m[2] + '</a>').join('');
    h.innerHTML = '<div class="hwrap" role="dialog" aria-modal="true" aria-label="Hướng dẫn sử dụng"><div class="hpanel">' +
      '<div class="hhead"><b>📖 Hướng dẫn sử dụng</b>' +
      (list.length > 1 ? '<div class="seg">' + list.map(d => '<button data-hact="doc" data-k="' + d.k + '" class="' + (d.k === cur.k ? 'on' : '') + '">' + d.name + '</button>').join('') + '</div>' : '') +
      '<span class="spacer"></span>' +
      '<button class="btn sm" data-hact="word" data-tip="Tải bản hướng dẫn này về máy dạng file Word (.doc), mở bằng Word hoặc Google Docs">⬇ Tải Word</button>' +
      '<button class="btn sm" data-hact="print" data-tip="Mở hộp thoại in. Chọn máy in, hoặc chọn &quot;Lưu dưới dạng PDF&quot; để có file PDF">🖨 In / Lưu PDF</button>' +
      '<button class="btn sm" data-hact="close" aria-label="Đóng" data-tip="Đóng hướng dẫn (Esc)">✕</button></div>' +
      (toc ? '<nav class="htoc">' + toc + '</nav>' : '') +
      '<article class="hdoc" id="helpDoc"><h1>' + esc(cur.title) + '</h1>' + body + '</article></div></div>';
    document.body.classList.add('helpopen');
    h.querySelector('.hdoc').scrollTop = 0;
  },
  fileHtml(cur) {
    const css = 'body{font-family:Calibri,Arial,sans-serif;font-size:11pt;color:#14213d;line-height:1.45}h1{font-size:18pt;color:#14213d}h2{font-size:14pt;color:#1f2f57;border-bottom:1px solid #d7dde6;padding-bottom:3px;margin-top:18pt}h3{font-size:12pt;color:#1f2f57}table{border-collapse:collapse;width:100%;margin:6pt 0}th,td{border:1px solid #b8c2d1;padding:4pt 6pt;vertical-align:top;text-align:left}th{background:#14213d;color:#fff}tr:nth-child(even) td{background:#f3f6fa}code{font-family:Consolas,monospace;background:#eef1f4;padding:0 3px}.foot{margin-top:18pt;color:#7c889e;font-size:9pt}';
    return '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>' + esc(cur.title) + '</title><style>' + css + '</style></head><body><h1>' + esc(cur.title) + '</h1>' + HELP_DOCS[cur.k] + '<p class="foot">' + esc(COPYRIGHT) + '</p></body></html>';
  },
  async download() {
    const cur = this.docs().find(d => d.k === this.which);
    const name = (cur.k === 'staff' ? 'Huong-dan-xem-lich-nhan-vien' : 'Huong-dan-nguoi-lam-lich') + '.doc';
    const blob = new Blob(['﻿' + this.fileHtml(cur)], { type: 'application/msword' });
    if (Store.dl) return saveFile(name, blob);
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); toast('Đã tải ' + name);
  },
  print() {
    document.body.classList.add('helpprint');
    const done = () => { document.body.classList.remove('helpprint'); removeEventListener('afterprint', done); };
    addEventListener('afterprint', done);
    try { window.print(); } catch (e) { toast('Trình duyệt này không cho in. Hãy dùng nút Tải Word.'); }
    setTimeout(done, 60000);
  }
};

    '.hwrap{position:fixed;inset:0;z-index:70;background:rgba(10,15,28,.5);display:flex;justify-content:center;align-items:stretch;padding:16px}' +

    '@media (max-width:640px){.hwrap{padding:0}.hpanel{border-radius:0}.hdoc{padding:4px 14px 24px}.hhead .seg{order:5;width:100%}}' +
    '@media print{body.helpprint>*:not(#helpHost){display:none!important}body.helpprint .hwrap{position:static;background:none;padding:0;display:block}body.helpprint .hpanel{box-shadow:none;width:auto;display:block}body.helpprint .hhead,body.helpprint .htoc{display:none}body.helpprint .hdoc{overflow:visible;padding:0;color:#000;font-size:11pt}body.helpprint .hdoc th{background:#eee}}';
  document.head.appendChild(css);
  document.addEventListener('click', e => {
    const g = e.target.closest('[data-hgo]');
    if (g) { e.preventDefault(); const t = document.getElementById(g.dataset.hgo); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    const t = e.target.closest('[data-hact]'); if (!t) { if (e.target.classList && e.target.classList.contains('hwrap')) HelpUI.close(); return; }
    const a = t.dataset.hact;
    if (a === 'open') HelpUI.show(t.dataset.k);
    else if (a === 'close') HelpUI.close();
    else if (a === 'doc') { HelpUI.which = t.dataset.k; HelpUI.render(); }
    else if (a === 'word') HelpUI.download();
    else if (a === 'print') HelpUI.print();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && HelpUI.open) { HelpUI.close(); e.stopPropagation(); } }, true);
})();

/* ---------- Gửi lịch cho nhân viên: Email (Google Apps Script), Telegram (bot), Zalo (chép tin) ---------- */
const NOTIFY = {
  pub: null,        // config/notify: { email: bool, tgBot: 'ten_bot' } — mọi người đọc được
  sec: null,        // secrets/notify: { gasUrl, gasKey, tgToken, tgOffset } — chỉ người làm lịch
  subs: [],         // danh sách đăng ký (người làm lịch)
  mine: null,       // đăng ký của chính mình
  inited: false, busy: false, log: [],
  contacts: {},     // danh bạ do người làm lịch nhập: { staffId: { phone, email } } — chỉ người làm lịch đọc được
  ctLoaded: false,
  async loadContacts() {
    if (this.fb()) { if (!this.isEditor()) return; try { const s = await FBX.fs.doc('secrets/contacts').get(); this.contacts = (s.exists && s.data().map) || {}; } catch (e) { this.contacts = {}; } }
    else { try { this.contacts = JSON.parse(localStorage.getItem('pcsb:contacts') || '{}'); } catch (e) { this.contacts = {}; } }
    this.ctLoaded = true;
  },
  async saveContacts() {
    if (this.fb()) await FBX.fs.doc('secrets/contacts').set({ map: this.contacts, by: FBX.user.email, at: new Date().toISOString() });
    else { try { localStorage.setItem('pcsb:contacts', JSON.stringify(this.contacts)); } catch (e) {} }
  },
  phoneOf(sid) { const p = String((this.contacts[sid] || {}).phone || '').replace(/[^\d+]/g, ''); return p.replace(/^\+?84/, '0'); },
  emailOf(sid) { return String((this.contacts[sid] || {}).email || '').trim(); },
  fb() { return Store.mode === 'fb' && typeof FBX !== 'undefined' && FBX.user && FBX.fs && FBX.role; },
  isEditor() { return this.fb() && FBX.role === 'editor'; },
  async init() {
    if (this.inited || !this.fb()) return; this.inited = true;
    try { const s = await FBX.fs.doc('config/notify').get(); this.pub = s.exists ? s.data() : {}; } catch (e) { this.pub = {}; }
    try { const s = await FBX.fs.doc('subs/' + FBX.user.uid).get(); this.mine = s.exists ? s.data() : null; } catch (e) { this.mine = null; }
    if (this.isEditor()) {
      try { const s = await FBX.fs.doc('secrets/notify').get(); this.sec = s.exists ? s.data() : {}; } catch (e) { this.sec = {}; }
      await this.loadSubs(); await this.loadContacts();
      if (this.sec.tgToken) this.tgSync().catch(() => {});
    }
    this.bar();
  },
  async loadSubs() {
    try { const q = await FBX.fs.collection('subs').get(); this.subs = q.docs.map(d => Object.assign({ uid: d.id }, d.data())); }
    catch (e) { this.subs = []; this.subsErr = e && e.code; }
  },
  bar() { const b = $('#bNotify'); if (b) b.hidden = !this.fb(); },

  /* ---------- soạn nội dung ---------- */
  link() { return STANDALONE ? location.origin + location.pathname : ''; },
  dayLines(w, sid) {
    const cm = C.codeMap(S.cfg), out = [];
    for (let d = 0; d < 7; d++) {
      const c = C.cellOf(w, sid, d), parts = [];
      if (c && c.status) { const k = cm[C.key(c.status)]; parts.push(c.status + (k && k.label && C.key(k.label) !== C.key(c.status) ? ' (' + k.label + ')' : '')); }
      for (const it of (c && c.items) || []) {
        const s = slotById(it.slot);
        parts.push(it.slot + (s ? (s.covers || s.start ? ' ca ' + C.shiftText(S.cfg, w, s, d) : (s.time ? ' ' + C.fmtTime(s.time) : '')) : '') + (it.role ? ' /' + it.role : '') + (s && s.night ? ' 🌙' : ''));
      }
      if (c && c.note) parts.push('· ' + c.note);
      out.push(parts.join(', ') || '—');

  },
  staffMsg(w, sf, prev, mode) {
    const lines = this.dayLines(w, sf.id);
    const changed = prev ? lines.map((l, d) => l !== prev[d]) : lines.map(() => false);
    const head = (mode === 'changes' && prev ? '🔄 Lịch của bạn vừa thay đổi' : '📅 Lịch tuần') + ' ' + weekName(w.start);
    const rows = lines.map((l, d) => ({ day: C.dayLabel(w.start, d), text: l, changed: changed[d] }));
    const text = head + '\n' + sf.name + '\n\n' + rows.map(r => r.day + ': ' + r.text + (r.changed ? '  ◀ mới' : '')).join('\n') + (this.link() ? '\n\nXem đầy đủ: ' + this.link() : '');
    const h = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const tg = '<b>' + h(head) + '</b>\n' + h(sf.name) + '\n\n' + rows.map(r => (r.changed ? '<b>' : '') + h(r.day) + ': ' + h(r.text) + (r.changed ? '</b>  ◀ mới' : '')).join('\n') + (this.link() ? '\n\n<a href="' + h(this.link()) + '">Xem đầy đủ</a>' : '');
    const html = '<div style="font-family:Arial,sans-serif;font-size:14px;color:#14213d"><h2 style="font-size:17px;margin:0 0 4px">' + h(head) + '</h2><div style="margin-bottom:10px;color:#4a5874">' + h(sf.name) + '</div>' +
      '<table style="border-collapse:collapse;min-width:320px">' + rows.map(r => '<tr style="background:' + (r.changed ? '#fff3c4' : '#ffffff') + '"><td style="padding:6px 10px;border:1px solid #d7dde6;font-weight:bold;white-space:nowrap">' + h(r.day) + '</td><td style="padding:6px 10px;border:1px solid #d7dde6">' + h(r.text) + (r.changed ? ' <b style="color:#b26a00">◀ mới</b>' : '') + '</td></tr>').join('') + '</table>' +
      (this.link() ? '<p style="margin-top:12px"><a href="' + h(this.link()) + '" style="background:#f2b705;color:#14213d;padding:8px 14px;border-radius:6px;text-decoration:none;font-weight:bold">Xem lịch đầy đủ</a></p>' : '') +
      '<p style="color:#7c889e;font-size:11px;margin-top:16px">Bạn nhận thư này vì đã bật "Nhận lịch" trong trang Phân Ca Sân Bay. Muốn tắt: mở trang → 🔔 Nhận lịch → Tắt nhận tin.<br>' + h(COPYRIGHT) + '</p></div>';
    const subject = (mode === 'changes' && prev ? '[Thay đổi] ' : '') + 'Lịch ' + weekName(w.start) + ' · ' + sf.name;
    return { lines, changed: changed.some(Boolean), text, tg, html, subject };
  },

    return t;
  },

  /* ---------- Telegram ---------- */
  async tg(method, params) {
    const tok = this.sec && this.sec.tgToken; if (!tok) throw new Error('Chưa có mã bot Telegram');
    const r = await fetch('https://api.telegram.org/bot' + tok + '/' + method, { method: 'POST', body: new URLSearchParams(params || {}) });
    const j = await r.json().catch(() => ({}));
    if (!j.ok) { const e = new Error(j.description || ('Telegram lỗi ' + r.status)); e.code = j.error_code; e.retry = j.parameters && j.parameters.retry_after; throw e; }
    return j.result;
  },
  async tgSync() {
    if (!this.isEditor() || !this.sec || !this.sec.tgToken) return 0;
    const off = +this.sec.tgOffset || 0;
    const ups = await this.tg('getUpdates', { offset: off ? off + 1 : 0, timeout: 0, allowed_updates: JSON.stringify(['message']) });
    if (!ups.length) return 0;
    let linked = 0, maxId = off;
    for (const u of ups) {
      maxId = Math.max(maxId, u.update_id);
      const m = u.message; if (!m || !m.chat) continue;
      const txt = String(m.text || '').trim(); const mm = txt.match(/^\/start\s+(\S+)/) || txt.match(/^([A-Z0-9]{8})$/);
      const sub = mm && this.subs.find(s => s.tg && s.tg.code === mm[1]);
      if (sub) {
        sub.tg = Object.assign({}, sub.tg, { chatId: String(m.chat.id), user: (m.from && (m.from.username || m.from.first_name)) || '', at: new Date().toISOString() });
        try { await FBX.fs.doc('subs/' + sub.uid).set({ tg: sub.tg }, { merge: true }); linked++; } catch (e) {}
        const sf = staffById(sub.staffId);
        this.tg('sendMessage', { chat_id: m.chat.id, text: '✅ Đã kết nối với lịch của ' + (sf ? sf.name : sub.email) + '. Từ giờ lịch sẽ được gửi vào đây.' }).catch(() => {});
      } else if (txt) {
        this.tg('sendMessage', { chat_id: m.chat.id, text: 'Để nhận lịch: mở trang lịch → bấm 🔔 Nhận lịch → Kết nối Telegram.' }).catch(() => {});
      }
    }
    this.sec.tgOffset = maxId;
    try { await FBX.fs.doc('secrets/notify').set({ tgOffset: maxId }, { merge: true }); } catch (e) {}
    return linked;
  },
  /* ---------- Email ---------- */
  async gas(payload) {
    const url = this.sec && this.sec.gasUrl; if (!url) throw new Error('Chưa cài máy gửi email');
    let r;
    try { r = await fetch(url, { method: 'POST', body: JSON.stringify(Object.assign({ key: this.sec.gasKey }, payload)), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow' }); }
    catch (e) { throw new Error('Không gọi được máy gửi email. Kiểm tra lại link Apps Script và mục "Ai có quyền truy cập: Bất kỳ ai".'); }
    const j = await r.json().catch(() => null);
    if (!j) throw new Error('Máy gửi email trả lời không đúng. Kiểm tra đã chọn "Ứng dụng web" khi triển khai.');
    if (!j.ok) throw new Error(j.error === 'sai khoá' ? 'Sai khoá bí mật: hãy chép lại mã Apps Script mới nhất và triển khai lại.' : (j.error || 'Lỗi gửi email'));
    return j;
  },
  scriptCode(key) {
    return [
      '// Máy gửi email cho Phân Ca Sân Bay · ' + COPYRIGHT,
      '// Dán toàn bộ vào script.google.com, rồi Triển khai → Ứng dụng web (Thực thi: Tôi · Truy cập: Bất kỳ ai).',
      "const KEY = '" + key + "';",
      'function doPost(e) {',
      '  let req;',
      "  try { req = JSON.parse(e.postData.contents); } catch (x) { return out({ ok: false, error: 'bad json' }); }",
      "  if (req.key !== KEY) return out({ ok: false, error: 'sai khoá' });",
      '  if (req.ping) return out({ ok: true, quota: MailApp.getRemainingDailyQuota() });',
      '  const results = [];',
      '  (req.messages || []).forEach(function (m) {',
      "    try { MailApp.sendEmail({ to: m.to, subject: m.subject, htmlBody: m.html, body: m.text, name: req.from || 'Phân Ca Sân Bay' }); results.push({ to: m.to, ok: true }); }",
      '    catch (x) { results.push({ to: m.to, ok: false, error: String(x) }); }',
      '  });',
      '  return out({ ok: true, results: results, quota: MailApp.getRemainingDailyQuota() });',
      '}',
      "function doGet() { return out({ ok: true, app: 'pcsb-mail' }); }",
      'function out(o) { return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }',
      'function thuQuyen() { MailApp.getRemainingDailyQuota(); } // chạy hàm này 1 lần để cấp quyền gửi thư'
    ].join('\n');
  },
  async saveSec(patch) {
    this.sec = Object.assign({}, this.sec || {}, patch, { by: FBX.user.email, at: new Date().toISOString() });

  /* ---------- Gửi ---------- */
  async plan(mode) {
    const w = S.week; const last = await this.lastLog(w.start);
    const prevLines = last && last.lines || null;
    const staff = S.cfg.staff.filter(s => s.active && s.kind === 'flight' || (s.active && w.cells[s.id]));
    const msgs = {}; const changedNames = [];
    for (const sf of staff) {
      const prev = prevLines && prevLines[sf.id];
      const m = this.staffMsg(w, sf, prev, mode); msgs[sf.id] = m;
      if (prev && m.changed) changedNames.push(sf.name + ' (' + m.lines.map((l, d) => l !== prev[d] ? DAYS[d] : '').filter(Boolean).join(', ') + ')');
    }
    const want = sub => mode === 'week' ? (sub.events || {}).week !== false : (sub.events || {}).changes !== false;
    const targets = this.subs.filter(s => s.on !== false && s.staffId && msgs[s.staffId] && want(s) && (mode === 'week' || !prevLines || msgs[s.staffId].changed || !prevLines[s.staffId]));
    const changedOrNew = sid => mode === 'week' || !prevLines || msgs[sid].changed || !prevLines[sid];
    const email = []; const seen = new Set();
    if (this.sec && this.sec.gasUrl) {
      for (const s of targets) if (s.email && s.email.on && s.email.addr) { const k = s.staffId + '|' + s.email.addr.toLowerCase(); if (!seen.has(k)) { seen.add(k); email.push({ staffId: s.staffId, addr: s.email.addr }); } }
      for (const sid in msgs) { const a = this.emailOf(sid); if (!a || !changedOrNew(sid)) continue; const k = sid + '|' + a.toLowerCase(); if (!seen.has(k)) { seen.add(k); email.push({ staffId: sid, addr: a }); } }
    }
    const tg = targets.filter(s => s.tg && s.tg.on !== false && s.tg.chatId && this.sec && this.sec.tgToken);
    return { w, last, prevLines, staff, msgs, changedNames, targets, email, tg };
  },
  async send(mode, opt, onLog) {
    const P = await this.plan(mode); const log = (t, cls) => onLog && onLog(t, cls);
    let ok = 0, fail = 0;
    if (opt.tg && P.tg.length) {
      try { await this.tgSync(); } catch (e) {}
      log('Telegram: gửi ' + P.tg.length + ' người…');
      for (const s of P.tg) {
        const m = P.msgs[s.staffId], sf = staffById(s.staffId);
        for (let attempt = 0; attempt < 3; attempt++) {
          try { await this.tg('sendMessage', { chat_id: s.tg.chatId, text: m.tg, parse_mode: 'HTML', disable_web_page_preview: 'true' }); ok++; log('✓ Telegram · ' + sf.name, 'ok'); break; }
          catch (e) {
            if (e.code === 429 && attempt < 2) { await new Promise(r => setTimeout(r, ((e.retry || 2) + 1) * 1000)); continue; }
            fail++; log('✗ Telegram · ' + sf.name + ': ' + (e.code === 403 ? 'người này đã chặn bot hoặc chưa bấm Start' : e.message), 'err'); break;
          }
        }
        await new Promise(r => setTimeout(r, 60));
      }
    }
    if (opt.email && P.email.length) {
      log('Email: gửi ' + P.email.length + ' người…');
      const all = P.email.map(s => { const m = P.msgs[s.staffId]; return { to: s.addr, subject: m.subject, html: m.html, text: m.text, _n: staffById(s.staffId).name }; });
      for (let i = 0; i < all.length; i += 20) {
        const chunk = all.slice(i, i + 20);
        try {
          const j = await this.gas({ messages: chunk.map(({ _n, ...m }) => m), from: 'Phân Ca Sân Bay' });
          (j.results || []).forEach((r, k) => { const n = chunk[k] ? chunk[k]._n : r.to; if (r.ok) { ok++; log('✓ Email · ' + n, 'ok'); } else { fail++; log('✗ Email · ' + n + ': ' + r.error, 'err'); } });
          if (j.quota != null) log('Gmail còn gửi được ' + j.quota + ' thư hôm nay.');
        } catch (e) { fail += chunk.length; log('✗ Email: ' + e.message, 'err'); break; }
      }
    }
    if (ok || opt.markSent) { const lines = {}; for (const sid in P.msgs) lines[sid] = P.msgs[sid].lines; await this.saveLog(P.w.start, lines).catch(() => {}); }
    return { ok, fail };
  },

  /* ---------- Giao diện: nhân viên đăng ký ---------- */
  async openSub() {

          const d = N.readSubForm(); if (!d.staffId) { toast('Chọn tên của bạn'); break; }
          if (d.email.on && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email.addr)) { toast('Email chưa đúng'); break; }
          await N.saveSub(d); toast('Đã lưu. Bạn sẽ nhận lịch khi người làm lịch gửi.'); N.panel(''); break;
        }
        case 'sub-off': await FBX.fs.doc('subs/' + FBX.user.uid).delete(); N.mine = null; toast('Đã tắt nhận tin'); N.panel(''); break;
        case 'copy-script': N.copy(N.scriptCode(N._pendingKey)); toast('Đã chép mã. Dán vào script.google.com'); break;
        case 'gas-save': {
          const url = ($('#nGas').value || '').trim();
          if (!/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(url)) { toast('Link phải bắt đầu bằng https://script.google.com/macros/s/…'); break; }
          const old = N.sec; N.sec = Object.assign({}, N.sec || {}, { gasUrl: url, gasKey: N._pendingKey });
          t.disabled = true; t.textContent = 'Đang thử…';
          try {
            const j = await N.gas({ messages: [{ to: FBX.user.email, subject: 'Thử gửi lịch · Phân Ca Sân Bay', html: '<p>Máy gửi email đã hoạt động. ✅</p><p style="color:#7c889e;font-size:11px">' + esc(COPYRIGHT) + '</p>', text: 'Máy gửi email đã hoạt động.' }] });
            const r0 = (j.results || [])[0]; if (r0 && !r0.ok) throw new Error(r0.error);
            await N.saveSec({ gasUrl: url, gasKey: N._pendingKey }); await N.savePub({ email: true });
            toast('Đã bật email. Kiểm tra hộp thư ' + FBX.user.email);
          } catch (err) { N.sec = old; toast(err.message); }
          render(); break;
        }
        case 'gas-off': await N.saveSec({ gasUrl: '' }); await N.savePub({ email: false }); toast('Đã tắt email'); render(); break;
        case 'tg-save': {
          const v = ($('#nTgTok').value || '').trim();
          if (v.startsWith('••')) { toast('Mã đã lưu. Dán mã mới nếu muốn đổi.'); break; }
          if (!/^\d+:[\w-]{20,}$/.test(v)) { toast('Mã bot dạng 123456789:AA… (chép nguyên từ BotFather)'); break; }
          const old = N.sec; N.sec = Object.assign({}, N.sec || {}, { tgToken: v, tgOffset: 0 });
          try { const me = await N.tg('getMe'); await N.saveSec({ tgToken: v, tgOffset: 0 }); await N.savePub({ tgBot: me.username }); toast('Đã bật Telegram: @' + me.username); }
          catch (err) { N.sec = old; toast('Mã bot không đúng: ' + err.message); }
          render(); break;
        }
        case 'tg-sync': { await N.loadSubs(); const n = await N.tgSync(); toast(n ? 'Đã kết nối thêm ' + n + ' người' : 'Không có kết nối mới'); render(); break; }
        case 'tg-off': await N.saveSec({ tgToken: '' }); await N.savePub({ tgBot: '' }); toast('Đã tắt Telegram'); render(); break;
        case 'subs-reload': await N.loadSubs(); try { await N.tgSync(); } catch (x) {} render(); break;
        case 'sub-del': await FBX.fs.doc('subs/' + t.dataset.uid).delete(); await N.loadSubs(); render(); break;
      }
    } catch (err) {
      N.busy = false;
      toast((err && err.code === 'permission-denied') ? 'Không có quyền. Người quản lý cần dán lại file firestore.rules mới vào Firebase.' : ('Lỗi: ' + (err && err.message || err)));
    }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#notifyHost') && $('#notifyHost').innerHTML) NOTIFY.panel(''); });
  setInterval(() => { if (NOTIFY.fb() && !NOTIFY.inited) NOTIFY.init(); NOTIFY.bar(); }, 2000);
})();

/* ---------- Đề xuất sửa nhanh khi chia không đủ người ---------- */
const FIX = { sims: null, simRunning: false };
function fixPanel(html) {
  let h = $('#fixHost'); if (!h) { h = document.createElement('div'); h.id = 'fixHost'; document.body.appendChild(h); }
  h.innerHTML = html ? '<div class="hwrap" data-fx="bg"><div class="hpanel npanel" style="width:min(860px,100%)">' + html + '</div></div>' : '';
  document.body.classList.toggle('helpopen', !!html);
}
function openFixes() { FIX.sims = null; renderFixes(); }
function renderFixes() {
  const w = S.week; if (!w) return;
  const pos = C.shortPositions(S.cfg, w);
  const cap = C.capacity(S.cfg, w);
  let b = '<div class="hhead"><b>🛠 Đề xuất lấp chỗ thiếu · ' + esc(weekName(w.start)) + '</b><span class="spacer"></span><button class="btn sm" data-fx="close" aria-label="Đóng">✕</button></div><div class="hdoc">';
  if (!pos.length) { b += '<p style="color:var(--ok)"><b>✓ Đủ người cho mọi chuyến.</b></p></div>'; fixPanel(b); return; }
  // sức chứa
  const over = cap.filter(x => x.need > x.max);
  b += '<h3>Đủ người không?</h3><p class="help">Mỗi người làm tối đa ' + S.cfg.rules.maxSlotsPerDay + ' chuyến/ngày. Cột đỏ: số lượt cần nhiều hơn số người đi làm được × ' + S.cfg.rules.maxSlotsPerDay + ', nên dù chia khéo cũng không đủ. Khi đó phải giảm định mức, thêm người (đổi OFF / huỷ nghỉ) hoặc cho làm thêm chuyến.</p><div class="capg">' +
    cap.map(x => '<div class="capc' + (x.need > x.max ? ' bad' : x.need > x.max * 0.95 ? ' warn' : '') + '"><b>' + DAYS[x.d] + '</b><span>' + x.need + ' / ' + x.max + '</span><small>' + x.people + ' người</small></div>').join('') + '</div>' +
    (over.length ? '<p class="help" style="color:var(--err)">' + over.map(x => DAYS[x.d] + ' thiếu ít nhất ' + (x.need - x.max) + ' lượt').join(' · ') + '.</p>' : '');
  // từng chỗ thiếu
  const groups = {}; pos.forEach(p => { const k = p.slot + '|' + p.d + '|' + p.role; (groups[k] = groups[k] || Object.assign({ n: 0 }, p)).n++; });
  const list = Object.values(groups).sort((a, b) => a.d - b.d || a.slot.localeCompare(b.slot));
  const candMap = {}; let freeN = 0; for (const g of list.slice(0, 40)) { candMap[g.slot + '|' + g.d + '|' + g.role] = C.diagnose(S.cfg, w, g, 3); if (candMap[g.slot + '|' + g.d + '|' + g.role].some(c => c.kind === 'free')) freeN++; }
  if (freeN) b += '<div class="issue warn" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span>' + freeN + ' chỗ vẫn còn người rảnh hợp lệ. Bấm để máy tự lấp trước, rồi xem lại các chỗ còn lại.</span><button class="btn pri sm" data-fx="autofill">Tự động lấp chỗ trống</button></div>';
  b += '<h3>Từng chỗ thiếu (' + pos.length + ')</h3><p class="help">Bấm một đề xuất là áp dụng ngay (bấm Hoàn tác nếu không ưng). "Xếp ngoại lệ" sẽ khoá 🔒 ô đó và chỉ cảnh báo vàng.</p><div class="fxlist">';
  for (const g of list.slice(0, 40)) {
    const cands = candMap[g.slot + '|' + g.d + '|' + g.role] || C.diagnose(S.cfg, w, g, 3);
    b += '<div class="fxrow"><div class="fxh"><b>' + esc(g.slot) + (g.role !== 'A' ? '/' + g.role : '') + '</b> ' + esc(C.dayLabel(w.start, g.d)) + ' · thiếu ' + g.n + '</div><div class="fxa">' +
      cands.map(c => {
        const lab = c.kind === 'free' ? 'Xếp ' + c.name : c.kind === 'moveOff' ? (() => { const t = C.offTarget(S.cfg, w, c.sid, g.d); return t >= 0 ? 'Dời OFF ' + c.name + ' sang ' + DAYS[t] + ' rồi xếp' + (c.why.length ? ' (vượt: ' + c.why.join(', ') + ')' : '') : ''; })() : 'Xếp ngoại lệ ' + c.name + ' (vượt: ' + c.why.join(', ') + ')';
        return lab ? '<button class="btn sm' + (c.kind === 'free' ? ' pri' : '') + '" data-fx="assign" data-sid="' + c.sid + '" data-slot="' + esc(g.slot) + '" data-d="' + g.d + '" data-role="' + g.role + '" data-kind="' + c.kind + '">' + esc(lab) + '</button>' : '';
      }).join('') +
      '<button class="btn sm" data-fx="dem" data-slot="' + esc(g.slot) + '" data-d="' + g.d + '" data-role="' + g.role + '" data-tip="Giảm định mức chuyến này trong ngày này đi 1 người">Giảm định mức −1</button>' +
      (g.role !== 'A' ? '<button class="btn sm" data-fx="role2a" data-slot="' + esc(g.slot) + '" data-d="' + g.d + '" data-role="' + g.role + '" data-tip="Đổi vị trí /' + g.role + ' thiếu thành nhân viên thường">/' + g.role + ' → NV thường</button>' : '') +
      (cands.length ? '' : '<span class="muted">Không có ai gần đủ điều kiện.</span>') + '</div></div>';
  }
  if (list.length > 40) b += '<p class="muted">… và ' + (list.length - 40) + ' chỗ khác.</p>';
  b += '</div>';
  // thử nới luật
  b += '<h3>Thử nới luật cho cả tuần</h3>';
  if (!FIX.sims) b += '<p class="help">Máy thử chia lại với từng cách nới luật và cho biết mỗi cách lấp được bao nhiêu chỗ.</p><button class="btn" data-fx="sim"' + (FIX.simRunning ? ' disabled' : '') + '>' + (FIX.simRunning ? 'Đang thử…' : 'Thử các cách nới luật') + '</button>';
  else b += '<div class="fxlist">' + FIX.sims.map((s, i) => '<div class="fxrow"><div class="fxh">' + esc(s.label) + '</div><div class="fxa"><span class="' + (s.left < FIX.base ? '' : 'muted') + '">còn thiếu <b>' + s.left + '</b> (hiện tại ' + FIX.base + ')</span>' + (s.left < FIX.base ? '<button class="btn sm pri" data-fx="apply-sim" data-i="' + i + '">Áp dụng & chia lại</button>' : '') + '</div></div>').join('') + '</div>';
  b += '</div>';
  fixPanel(b);
}
const FIX_SCEN = () => {
  const r = S.cfg.rules;
  return [
    { label: 'Cho làm tối đa ' + (r.maxSlotsPerDay + 1) + ' chuyến/ngày (hiện ' + r.maxSlotsPerDay + ')', rules: { maxSlotsPerDay: r.maxSlotsPerDay + 1 } },
    { label: 'Giờ nghỉ tối thiểu ' + (r.minRestHours - 1) + 'h (hiện ' + r.minRestHours + 'h)', rules: { minRestHours: Math.max(4, r.minRestHours - 1) } },
    { label: 'Tối đa ' + (r.maxNightsPerWeek + 1) + ' ca đêm/tuần (hiện ' + r.maxNightsPerWeek + ')', rules: { maxNightsPerWeek: r.maxNightsPerWeek + 1 } },
    { label: 'Quầy đóng ' + (Math.abs(+r.afterMin || 0) + 15) + ' phút trước giờ bay (hiện ' + Math.abs(+r.afterMin || 0) + ')', rules: { afterMin: (+r.afterMin || 0) - 15 } },
    { label: 'Mở quầy ' + ((r.beforeMin - 30) / 60) + ' tiếng trước giờ bay (hiện ' + (r.beforeMin / 60) + ')', rules: { beforeMin: r.beforeMin - 30 } }
  ];
};
async function runSims() {
  FIX.simRunning = true; renderFixes();
  const L = await historyModel().catch(() => null);
  const count = cfg => { const res = C.autoAssign(cfg, S.week, { mode: 'fill', learn: L, seed: 5 }); return C.shortPositions(cfg, res.week).length; };
  await new Promise(r => setTimeout(r, 20));
  FIX.base = count(S.cfg); const out = [];
  for (const sc of FIX_SCEN()) {
    await new Promise(r => setTimeout(r, 10));
    const cfg = Object.assign({}, S.cfg, { rules: Object.assign({}, S.cfg.rules, sc.rules) });
    out.push(Object.assign({ left: count(cfg) }, sc));
  }
  out.sort((a, b) => a.left - b.left);
  FIX.sims = out; FIX.simRunning = false; renderFixes();
}
(function () {
  const css = document.createElement('style');
  css.textContent = '.capg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:8px 0}.capc{border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center;display:flex;flex-direction:column;font-size:13px}.capc small{color:var(--mute);font-size:11px}.capc.bad{border-color:var(--err);background:var(--errSoft)}.capc.warn{border-color:var(--warn);background:var(--warnSoft)}' +
    '.fxlist{display:flex;flex-direction:column;gap:6px}.fxrow{border:1px solid var(--line2);border-radius:8px;padding:8px 10px}.fxh{font-size:13px;margin-bottom:6px}.fxa{display:flex;flex-wrap:wrap;gap:6px;align-items:center}' +
    '@media (max-width:640px){.capg{grid-template-columns:repeat(4,1fr)}}';
  document.head.appendChild(css);
  document.addEventListener('click', e => {
    const a0 = e.target.closest('[data-act="fixes"]'); if (a0) { closeModal(); openFixes(); return; }
    const t = e.target.closest('[data-fx]'); if (!t) return;
    const a = t.dataset.fx;
    if (a === 'bg') { if (e.target === t) fixPanel(''); return; }
    if (a === 'close') { fixPanel(''); return; }
    if (a === 'sim') { runSims(); return; }
    if (a === 'autofill') { fixPanel(''); runAuto('fill', S.cfg.rules.autoOff, true); return; }
    if (a === 'apply-sim') {
      const sc = FIX.sims[+t.dataset.i]; fixPanel('');
      if (mutateCfg(c => Object.assign(c.rules, sc.rules)) === false) return;
      runAuto('fill', S.cfg.rules.autoOff, true); return;
    }
    const slot = t.dataset.slot, d = +t.dataset.d, role = t.dataset.role;
    if (a === 'dem' || a === 'role2a') {
      mutateWeek(w => {
        const p = C.planOf(S.cfg, w, slot, d); w.plan[slot] = w.plan[slot] || {};
        const dm = Object.assign({}, p.demand || {});
        dm[role] = Math.max(0, (+dm[role] || 0) - 1); if (!dm[role]) delete dm[role];
        if (a === 'role2a') dm.A = (+dm.A || 0) + 1;
        w.plan[slot][d] = Object.assign({ on: p.on, label: p.label }, w.plan[slot][d] || {}, { demand: dm });
      }, { noRender: true });
      FIX.sims = null; render(); renderFixes(); return;
    }
    if (a === 'assign') {
      const sid = t.dataset.sid, kind = t.dataset.kind; const nm = (staffById(sid) || {}).name;
      mutateWeek(w => {
        if (kind === 'moveOff') {
          const to = C.offTarget(S.cfg, w, sid, d);
          const c0 = C.ensureCell(w, sid, d); c0.status = ''; c0.autoOff = false;
          if (to >= 0) { const c1 = C.ensureCell(w, sid, to); c1.status = 'OFF'; c1.autoOff = true; }
        }
        const it = { slot, role: role === 'A' ? '' : role, lock: true };
        if (kind !== 'free' && C.checkAssign(C.makeCtx(S.cfg, w), staffById(sid), slot, d, role).length) it.ok = true;
        C.ensureCell(w, sid, d).items.push(it);
      }, { noRender: true });
      toast('Đã xếp ' + nm + ' vào ' + slot + ' ' + DAYS[d]); FIX.sims = null; render(); renderFixes();
    }
  });
})();

boot();
})();
