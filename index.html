<body>
<title>Phân Ca Sân Bay</title>
<!-- Phân Ca Sân Bay · Bản quyền © 2026 ThienNV · thiennv@vnpt-technology.vn · 0888.99.33.00 -->
<meta name="author" content="ThienNV - thiennv@vnpt-technology.vn - 0888.99.33.00">
<meta name="copyright" content="© 2026 ThienNV">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Bố cục: thanh điều khiển trên cùng + bảng lớn cuộn ngang, ngăn chỉnh sửa trượt bên phải. Màu lấy cảm hứng từ bảng chỉ dẫn sân bay: chữ xanh than, nhấn vàng tín hiệu. */
:root{
  --bg:#eef1f4; --panel:#ffffff; --panel2:#f6f8fa; --ink:#14213d; --ink2:#4a5874; --mute:#7c889e;
  --line:#d7dde6; --line2:#e7ebf0; --accent:#f2b705; --accentInk:#14213d; --accentSoft:#fff3c4;
  --night:#1f2f57; --nightInk:#e8eeff; --dayChip:#e6ecf5; --dayInk:#14213d;
  --ok:#1f8a4c; --okSoft:#e3f4ea; --warn:#b26a00; --warnSoft:#fff1d9; --err:#c62f2f; --errSoft:#fde6e4;
  --off:#8a94a6; --offSoft:#eceff3; --leave:#7a4bb8; --leaveSoft:#efe7fa; --sby:#1c6fb8; --sbySoft:#e2effb;
  --g1:#f6e3dc; --g2:#dcf0fa; --g3:#e2f3dc; --g4:#fbe9df; --g5:#fbf7d6; --g6:#d9e9f6; --g7:#ebe8f3;
  --shadow:0 8px 30px rgba(20,33,61,.14);
  --f-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1524; --panel:#161e31; --panel2:#1b2439; --ink:#e7ecf6; --ink2:#b3bdd2; --mute:#8590a8;
  --line:#2c3852; --line2:#232d44; --accent:#f2b705; --accentInk:#14213d; --accentSoft:#3a3112;
  --night:#3b5394; --nightInk:#f1f4ff; --dayChip:#25304a; --dayInk:#dfe6f5;
  --ok:#48c07a; --okSoft:#15301f; --warn:#e8a33c; --warnSoft:#33270f; --err:#ff6b62; --errSoft:#3a1a1a;
  --off:#97a1b5; --offSoft:#232b3e; --leave:#b892ef; --leaveSoft:#2b2140; --sby:#6cb2f0; --sbySoft:#15283d;
  --g1:#2f2420; --g2:#182c36; --g3:#1d2c1b; --g4:#33251c; --g5:#2f2c17; --g6:#172636; --g7:#24223a;
  --shadow:0 8px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1524; --panel:#161e31; --panel2:#1b2439; --ink:#e7ecf6; --ink2:#b3bdd2; --mute:#8590a8;
  --line:#2c3852; --line2:#232d44; --accent:#f2b705; --accentInk:#14213d; --accentSoft:#3a3112;
  --night:#3b5394; --nightInk:#f1f4ff; --dayChip:#25304a; --dayInk:#dfe6f5;
  --ok:#48c07a; --okSoft:#15301f; --warn:#e8a33c; --warnSoft:#33270f; --err:#ff6b62; --errSoft:#3a1a1a;
  --off:#97a1b5; --offSoft:#232b3e; --leave:#b892ef; --leaveSoft:#2b2140; --sby:#6cb2f0; --sbySoft:#15283d;
  --g1:#2f2420; --g2:#182c36; --g3:#1d2c1b; --g4:#33251c; --g5:#2f2c17; --g6:#172636; --g7:#24223a;
  --shadow:0 8px 30px rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
.ro .edit-only{display:none!important}
/* đăng nhập & người dùng */
.gate .tabs,.gate .weeknav,.gate #bUndo,.gate #bRedo,.gate #saveSt,.gate [data-act="auto"]{display:none!important}
.userbox{display:flex;align-items:center;gap:8px;font-size:12px;flex-wrap:wrap}
.userbox .who{opacity:.85;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.userbox .online{color:#9fe0b4;font-weight:600;white-space:nowrap}
.gatebox{max-width:440px;margin:6vh auto 0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 22px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.gatebox h2{margin:0;font-size:20px}
.gatebox .btn{white-space:normal;text-align:center}
.gatebox p{margin:0}
.gatebox code{font-family:var(--f-mono);font-size:12.5px;background:var(--panel2);padding:1px 5px;border-radius:4px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px;font-weight:600}
.gl{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--panel);font-size:13px;font-weight:700}
.or{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.fl{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink2)}
.fl .inp{padding:9px 10px}
.foothead td{background:var(--accentSoft)!important;color:var(--ink)!important}
tr.foot td.cv{padding:4px 6px}
tr.foot td.cv b{font-size:13px}
tr.foot.tot td{background:var(--panel2);font-weight:600}
tr.foot.tot td.sum.hi{color:var(--err)}
td.lvc{min-width:118px}
td.lvc select{width:100%;font-weight:600}
td.lvc.k-off{background:var(--offSoft)} td.lvc.k-leave{background:var(--leaveSoft)} td.lvc.k-sby{background:var(--sbySoft)}
td.lvc.autoff select{border-style:dashed}
.copy{padding-inline:16px;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--panel);color:var(--ink2);font-size:12px;text-align:center;user-select:text}
.copy b{color:var(--ink)}
.issue.okk{background:var(--okSoft);color:var(--ok)}

.ro td.cell{cursor:default}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-ui);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
a{color:var(--sby)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* khung ứng dụng */
.app{display:flex;flex-direction:column;min-height:100%}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--ink);color:#fff;padding-inline:16px;padding-block:10px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
:root[data-theme="dark"] .top{background:#0a0f1c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .top{background:#0a0f1c}}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.01em;font-size:16px;white-space:nowrap}
.brand .tile{width:30px;height:30px;border-radius:6px;background:var(--accent);color:var(--accentInk);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;font-weight:600}
.weeknav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.weeknav .wk{font-weight:600;font-variant-numeric:tabular-nums;padding:0 6px;white-space:nowrap}
.tbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.18)}
.tbtn.pri{background:var(--accent);color:var(--accentInk);border-color:var(--accent);font-weight:600}
.tbtn.pri:hover{filter:brightness(1.05)}
.tbtn:disabled{opacity:.45;cursor:default}
.top select.tsel{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:6px;padding:5px 8px}
.top select.tsel option{color:#14213d}
.spacer{flex:1}
.save{font-size:12px;opacity:.85;display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#7fd19b;display:inline-block}
.dot.busy{background:var(--accent)} .dot.local{background:#9aa6bd} .dot.bad{background:#ff6b62}

.tabs{display:flex;gap:2px;padding-inline:16px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:11px 14px 9px;border-bottom:3px solid transparent;cursor:pointer;color:var(--ink2);font-weight:500;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab .badge{margin-left:6px}
.main{padding-inline:16px;padding-block:14px 40px;flex:1;min-width:0}

/* thanh công cụ trong tab */
.bar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:12px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accentInk);font-weight:600}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--panel);font-weight:600}
.btn.danger{color:var(--err);border-color:color-mix(in srgb,var(--err) 40%,var(--line))}
.btn.sm{padding:3px 8px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:default}
.inp,.sel{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 9px;min-width:0}
.inp.sm,.sel.sm{padding:3px 6px;font-size:12.5px}
.inp:focus,.sel:focus{border-color:var(--ink2);outline:none}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.muted{color:var(--mute)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:18px;padding:0 6px;border-radius:9px;font-size:11.5px;font-weight:600;background:var(--line2);color:var(--ink2);font-variant-numeric:tabular-nums}
.badge.err{background:var(--err);color:#fff} .badge.warn{background:var(--warn);color:#fff} .badge.ok{background:var(--ok);color:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:5px 10px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--panel);font-weight:600}

/* tóm tắt */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.kpi .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-weight:600}
.kpi .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.kpi .s{font-size:12px;color:var(--ink2)}
.kpi.err .v{color:var(--err)} .kpi.ok .v{color:var(--ok)} .kpi.warn .v{color:var(--warn)}

/* bảng chung */
.scroll{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);max-height:calc(100vh - 210px);min-height:240px}
table.g{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
table.g th,table.g td{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:6px 8px;vertical-align:top;text-align:left}
table.g thead th{position:sticky;top:0;z-index:3;background:var(--panel2);font-size:12px;font-weight:600;color:var(--ink2);white-space:nowrap;border-bottom:1px solid var(--line)}
table.g thead th.today{background:var(--accentSoft);color:var(--ink)}
table.g .stick{position:sticky;left:0;z-index:2;background:var(--panel)}
table.g thead .stick{z-index:4;background:var(--panel2)}
table.g tr.grp td{background:var(--panel2);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--ink2);padding:5px 10px}
table.g tr.grp td.stick{z-index:2}
.name{min-width:170px;max-width:220px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:5px solid transparent}
.gc1{border-left-color:#e3a58f!important} .gc2{border-left-color:#6cc3e8!important} .gc3{border-left-color:#8ccc7d!important}
.gc4{border-left-color:#eeaa82!important} .gc5{border-left-color:#e2d35a!important} .gc6{border-left-color:#5b9fd6!important} .gc7{border-left-color:#a597c9!important}
.name small{display:block;font-weight:400;color:var(--mute);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tagx{font-family:var(--f-mono);font-size:10.5px;padding:0 4px;border-radius:4px;background:var(--line2);color:var(--ink2);margin-left:4px;font-weight:600}

/* ô lịch */
td.cell{min-width:118px;max-width:150px;cursor:pointer;background:var(--panel);transition:background .1s}
td.cell:hover{background:var(--panel2)}
td.cell.sel{box-shadow:inset 0 0 0 2px var(--accent)}
td.cell.err{background:var(--errSoft)}
td.cell.warn{background:var(--warnSoft)}
td.cell.carry{background:var(--panel2);cursor:default;min-width:96px;opacity:.85}
.st{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;margin:0 3px 3px 0;background:var(--line2);color:var(--ink2);white-space:nowrap}
.st.k-off{background:var(--offSoft);color:var(--off);background-image:repeating-linear-gradient(135deg,transparent 0 5px,color-mix(in srgb,var(--off) 14%,transparent) 5px 7px)}
.st.k-leave{background:var(--leaveSoft);color:var(--leave)}
.st.k-sby{background:var(--sbySoft);color:var(--sby)}
.st.auto{outline:1px dashed var(--off)}
.its{display:flex;flex-wrap:wrap;gap:3px}
.chip{font-family:var(--f-mono);font-size:11.5px;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--dayChip);color:var(--dayInk);white-space:nowrap;line-height:1.5}
.chip.n{background:var(--night);color:var(--nightInk)}
.chip i{font-style:normal;opacity:.75}
.chip.bad{outline:2px solid var(--err);outline-offset:-1px}
.chip .lk{font-size:9px;margin-left:2px}
.nt{font-size:11px;color:var(--mute);margin-top:2px;max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td.sum{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2);min-width:46px}
td.sum.hi{color:var(--err);font-weight:700}

/* quân số */
td.cv{min-width:96px;cursor:pointer;text-align:center}
td.cv b{font-size:15px;font-variant-numeric:tabular-nums;display:block}
td.cv small{font-size:10.5px;color:var(--ink2);display:block;white-space:nowrap;font-family:var(--f-mono)}
td.cv.ok{background:var(--okSoft)} td.cv.ok b{color:var(--ok)}
td.cv.short{background:var(--errSoft)} td.cv.short b{color:var(--err)}
td.cv.over{background:var(--warnSoft)} td.cv.over b{color:var(--warn)}
td.cv.off{background:repeating-linear-gradient(135deg,var(--panel) 0 6px,var(--panel2) 6px 12px);color:var(--mute)}
td.cv.off b{font-size:12px;color:var(--mute)}
td.cv.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.slotname{font-family:var(--f-mono);font-weight:600}
.slotname small{display:block;font-family:var(--f-ui);font-weight:400;color:var(--mute);font-size:11px}

/* lịch bay */
td.fp{min-width:132px}
td.fp .row{display:flex;gap:6px;align-items:center}
td.fp.offd{background:repeating-linear-gradient(135deg,var(--panel) 0 6px,var(--panel2) 6px 12px)}
td.fp input.inp{width:100%;font-family:var(--f-mono);font-size:12px;padding:3px 6px}
.tog{border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:11px;font-weight:700;cursor:pointer;background:var(--okSoft);color:var(--ok);white-space:nowrap}
.tog.offb{background:var(--errSoft);color:var(--err)}
.dm{font-size:10.5px;color:var(--ink2);font-family:var(--f-mono);margin-top:3px;cursor:pointer;display:inline-block}
.dm.ovr{color:var(--warn);font-weight:700}

/* ngăn chỉnh sửa */
.drawer{position:fixed;z-index:50;top:0;right:0;bottom:0;width:min(420px,100vw);background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column}
.drawer header{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;padding-top:calc(14px + env(safe-area-inset-top,0px))}
.drawer header h3{margin:0;font-size:16px;line-height:1.3;text-wrap:balance}
.drawer header .sub{font-size:12.5px;color:var(--ink2)}
.drawer .body{overflow:auto;padding:12px 16px 24px;display:flex;flex-direction:column;gap:14px;flex:1;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.sec h4{margin:0 0 6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute)}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.li{display:flex;gap:8px;align-items:center;padding:7px 9px;border-bottom:1px solid var(--line2);min-width:0}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .why{font-size:11.5px;color:var(--err)}
.li .meta{font-size:11.5px;color:var(--mute)}
.li.dis{opacity:.62}
.li.clickable{cursor:pointer} .li.clickable:hover{background:var(--panel2)}
.issue{font-size:12.5px;padding:6px 9px;border-radius:6px;background:var(--errSoft);color:var(--err)}
.issue.warn{background:var(--warnSoft);color:var(--warn)}
.x{border:0;background:none;cursor:pointer;font-size:20px;line-height:1;color:var(--ink2);padding:2px 6px;margin-left:auto}
.scrim{position:fixed;inset:0;background:rgba(10,15,28,.35);z-index:45}

/* hộp thoại */
.modal{position:fixed;z-index:60;inset:0;display:grid;place-items:center;padding:16px;background:rgba(10,15,28,.45)}
.modal .box{background:var(--panel);border-radius:12px;box-shadow:var(--shadow);width:min(520px,100%);max-height:90vh;overflow:auto;padding:18px}
.modal h3{margin:0 0 8px;font-size:17px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.opt{display:flex;gap:10px;padding:10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;margin-top:8px}
.opt:has(input:checked){border-color:var(--ink);background:var(--panel2)}
.opt b{display:block}
.opt span{font-size:12.5px;color:var(--ink2)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:8px;z-index:70;box-shadow:var(--shadow);max-width:calc(100vw - 32px);font-size:13.5px}

/* thống kê */
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:980px){.two{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.card h3{margin:0 0 10px;font-size:14px}
.bars{display:flex;flex-direction:column;gap:3px;max-height:520px;overflow:auto}
.barrow{display:grid;grid-template-columns:120px minmax(0,1fr) 40px;gap:8px;align-items:center;font-size:12px}
.barrow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:12px;background:var(--line2);border-radius:3px;position:relative;overflow:hidden}
.track .fill{position:absolute;inset:0 auto 0 0;background:var(--night);border-radius:3px}
.track .avg{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--accent)}
.barrow .vv{text-align:right;font-variant-numeric:tabular-nums}
.issues{display:flex;flex-direction:column;gap:5px;max-height:520px;overflow:auto}
.issues .issue{cursor:pointer}

/* cài đặt */
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
table.g td input.inp,table.g td select.sel{width:100%}
td.c{text-align:center}
.help{font-size:12.5px;color:var(--ink2);max-width:72ch}

<script>
/* Phân Ca Sân Bay · Bản quyền © 2026 ThienNV · thiennv@vnpt-technology.vn · 0888.99.33.00 */
/* ===== CORE: mô hình dữ liệu, kiểm tra luật, chia lịch tự động, nhập/xuất ===== */
const Core = (() => {
  const DAYS = ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'];
  const ROLE_DEFS = [
    { id: 'S', name: 'Supervisor (/S)' },
    { id: 'C', name: '/C' },
    { id: 'G', name: '/G' },
    { id: 'GC', name: '/GC' },
    { id: 'SE', name: '/SE' }
  ];
  const ROLE_IDS = ROLE_DEFS.map(r => r.id);
  const GROUPS = [
    { id: 1, name: 'Trưởng ca' },
    { id: 2, name: 'Giám sát' },
    { id: 3, name: 'Nhân viên chính' },
    { id: 4, name: 'Nhân viên LJ' },
    { id: 5, name: 'Nhân viên HX' },
    { id: 6, name: 'Chuyên hãng' },
    { id: 7, name: 'Ticket / PVDB / khác' }
  ];
  const FILL_GROUP = { F0D9D0: 1, CAEDFB: 2, D9F2D0: 3, FAE2D5: 4, FFFFCC: 5, C1E4F5: 6 };

  const uid = () => Math.random().toString(36).slice(2, 9);
  const clone = o => JSON.parse(JSON.stringify(o));
  const norm = s => String(s == null ? '' : s).replace(/ /g, ' ').replace(/\s+/g, ' ').trim();
  const key = s => norm(s).toUpperCase().normalize('NFC');

  /* ---------- mặc định ---------- */
  function defaultRules() {
    return {
      maxSlotsPerDay: 2, minRestHours: 6, maxNightsPerWeek: 6, minOffPerWeek: 1,
      maxWorkDays: 7, nightCutoffHour: 6, beforeMin: 120, afterMin: 0,
      overlapOK: 'LJ3+LJ4, VZ1+VZ2, BX1+BX1-2',
      autoOff: true, hoursPerShift: 8, wLoad: 1, wNight: 0.6, wPrevNight: 0.3, wSameSlot: 1.5,
      wSupOnAgent: 1.2, wNewDay: 0.6, balancePasses: 3
    };
  }
  function defaultCodes() {
    return [
      { code: 'OFF', label: 'Nghỉ (OFF)', block: 'all', off: 1, kind: 'off' },
      { code: 'OFF1/2 + S', label: 'Nghỉ nửa ngày + S', block: 'none', off: 0.5, kind: 'off' },
      { code: 'OFF1/2 + D', label: 'Nghỉ nửa ngày + D', block: 'none', off: 0.5, kind: 'off' },
      { code: 'NP', label: 'Nghỉ phép', block: 'all', off: 0, kind: 'leave' },
      { code: 'ỐM', label: 'Nghỉ ốm', block: 'all', off: 0, kind: 'leave' },
      { code: 'TS', label: 'Thai sản', block: 'all', off: 0, kind: 'leave' },
      { code: 'CT', label: 'Công tác', block: 'all', off: 0, kind: 'leave' },
      { code: 'HOC', label: 'Học / đào tạo', block: 'none', off: 0, kind: 'duty' },
      { code: 'TRAIN', label: 'Training', block: 'none', off: 0, kind: 'duty' },
      { code: 'HỌP', label: 'Họp', block: 'none', off: 0, kind: 'duty' },
      { code: 'SBY', label: 'Standby', block: 'none', off: 0, kind: 'sby' },
      { code: 'H X/ SBY', label: 'Standby HX', block: 'none', off: 0, kind: 'sby' },
      { code: 'E K/ SBY', label: 'Standby EK', block: 'none', off: 0, kind: 'sby' },
      { code: 'K Đ', label: 'Không làm đêm', block: 'night', off: 0, kind: 'duty' },
      { code: 'TĐS', label: 'Trực sáng', block: 'none', off: 0, kind: 'duty' },
      { code: 'TĐC', label: 'Trực chiều', block: 'none', off: 0, kind: 'duty' },
      { code: 'TĐT', label: 'Trực tối', block: 'none', off: 0, kind: 'duty' },
      { code: 'TĐSC', label: 'Trực sáng-chiều', block: 'none', off: 0, kind: 'duty' },
      { code: 'GÃY S/T', label: 'Ca gãy sáng/tối', block: 'none', off: 0, kind: 'duty' },
      { code: 'B X', label: 'Ca BX (ngày)', block: 'none', off: 0, kind: 'duty' },
      { code: 'BU', label: 'Bù', block: 'none', off: 0, kind: 'duty' },
      { code: 'BRD', label: 'Hỗ trợ boarding', block: 'none', off: 0, kind: 'duty' },
      { code: 'Đ', label: 'Đ', block: 'none', off: 0, kind: 'duty' }
    ];
  }
  // Slot mặc định suy ra từ file LỊCH 5-11OCT26 (định mức = số người thực tế được xếp)
  function defaultSlots() {
    const S = (id, airline, flight, time, route, demand, o = {}) => Object.assign({
      id, airline, flight, time, route, demand, night: false, nightWeight: 0,
      days: [1, 1, 1, 1, 1, 1, 1], dayLabels: {}, before: null, after: null, active: true, note: ''
    }, o);
    return [
      S('TW1', 'TW', 'TW008', '1145', 'ICN', { S: 1, A: 4 }),
      S('TW3', 'TW', 'TW26', '0050', 'CJJ', {}, { active: false, days: [1, 0, 0, 0, 1, 0, 0], note: 'Chưa có định mức trong file' }),
      S('TW4', 'TW', 'TW14', '0125', 'ICN', {}, { active: false, note: 'Chưa có định mức trong file' }),
      S('TW5', 'TW', 'TW30', '0130', 'TAE', {}, { active: false, note: 'Chưa có định mức trong file' }),
      S('LJ2', 'LJ', '', '0000', '', {}, { active: false, night: true, nightWeight: 3 }),
      S('LJ3', 'LJ', 'LJ082', '0015', 'ICN', { S: 1, GC: 1, A: 3 }, { night: true, nightWeight: 2.5 }),
      S('LJ4', 'LJ', 'LJ112', '0100', 'PUS', { S: 1, GC: 1, A: 3 }, { night: true, nightWeight: 3 }),
      S('AK1', 'AK', 'AK643', '1120', '', { S: 1, G: 1, A: 2 }, { days: [1, 1, 1, 1, 0, 1, 0] }),
      S('AK2', 'AK', 'AK649', '1220', '', { S: 1, G: 1, A: 2 }),
      S('AK3', 'AK', 'AK641', '1605', '', { S: 1, G: 1, A: 2 }),
      S('Z2', 'Z2', 'Z2823', '0855', '', { S: 1, G: 1, A: 2 }, { dayLabels: { 1: 'Z2827 1100', 3: 'Z2827 1100', 5: 'Z2827 1100' } }),
      S('RS', 'RS', 'RS512', '0040', '', { S: 1, A: 4 }, { night: true, nightWeight: 3 }),
      S('VZ1', 'VZ', 'VZ965', '1040', '', { S: 1, A: 3 }),
      S('VZ2', 'VZ', 'VZ961', '1315', '', { S: 1, A: 3 }),
      S('VZ3', 'VZ', 'VZ963', '1810', '', { A: 2 }, { note: 'VJQT' }),
      S('FD1', 'FD', 'FD635', '1005', '', { S: 1, G: 1, A: 2 }),
      S('FD3', 'FD', 'FD637', '1200', '', { S: 1, G: 1, A: 2 }),
      S('FD4', 'FD', 'FD639', '1810', '', { S: 1, G: 1, A: 2 }),
      S('OD', 'OD', 'OD503', '1250', '', { S: 1, A: 4 }, { days: [0, 1, 1, 1, 1, 1, 0] }),
      S('BX1', 'BX', 'BX774', '0045', '', { A: 3 }, { night: true, nightWeight: 3, note: 'Chỉ chuyến BX774' }),
      S('BX1-2', 'BX', 'BX774+BX7325', '0210', '', { S: 1, A: 3 }, { night: true, nightWeight: 4.5, before: 240, note: 'Làm cả BX774 và BX7325 (file cũ tính 3 + 1.5 giờ)' }),
      S('HX0', 'HX', 'HX543', '0400', '', { S: 1, C: 1, A: 3 }, { night: true, nightWeight: 4, overnight: false, days: [1, 1, 1, 0, 0, 0, 0], note: 'Chuyến 04:00 sáng sớm của chính ngày đó' }),
      S('HX1', 'HX', 'HX549', '1620', '', { S: 1, C: 1, A: 4 }),
      S('HX2', 'HX', 'HX547', '2050', '', { S: 1, C: 1, A: 4 }, { days: [1, 1, 1, 0, 0, 0, 0], note: 'A321' }),
      S('MH', 'MH', 'MH749', '1435', '', { S: 1, C: 1, A: 3 }, { days: [1, 0, 1, 1, 1, 1, 1], dayLabels: { 1: 'MH747 1125', 3: 'MH747 1125', 5: 'MH747 1125' } }),
      S('MH2', 'MH', 'MH8781', '1755', 'BKI', { S: 1, C: 1, A: 2 }, { days: [0, 0, 0, 1, 0, 0, 0] }),
      S('EK', 'EK', 'EK371', '2330', '', { S: 1, C: 1, G: 1, A: 7 }, { night: true, nightWeight: 2, days: [1, 0, 1, 0, 1, 0, 1] }),
      S('G1', 'G', 'Nhóm G1', '0200', '', {}, { active: false, night: true, nightWeight: 2 }),
      S('G2', 'G', 'Nhóm G2', '0200', '', { SE: 1, A: 7 }, { night: true, nightWeight: 3, days: [1, 0, 0, 0, 1, 0, 0] }),
      S('G3', 'G', 'Nhóm G3', '0200', '', { S: 1, SE: 1, A: 6 }, { night: true, nightWeight: 3.5 })
    ];
  }
  function emptyConfig() {
    return { version: 1, staff: [], slots: defaultSlots(), codes: defaultCodes(), rules: defaultRules(), groups: clone(GROUPS) };
  }
  function newStaff(name, o = {}) {
    return Object.assign({ id: 's' + uid(), name: norm(name), group: 3, roles: [], tags: [], noNight: false,
      allow: [], auto: true, active: true, kind: 'flight', note: '' }, o);
  }

  /* ---------- tuần ---------- */
  function mondayOf(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd);
    return isoDate(d);
  }
  function isoDate(d) { const p = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); }
  function addDays(iso, n) { const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return isoDate(d); }
  function dayLabel(start, d) { const x = new Date(addDays(start, d) + 'T00:00:00'); return DAYS[d] + ' ' + String(x.getDate()).padStart(2, '0') + '/' + String(x.getMonth() + 1).padStart(2, '0'); }

  function newWeek(cfg, start, prev) {
    const w = { start, plan: {}, cells: {}, carry: {}, prevNights: {}, over: {}, base: {}, notes: '' };
    for (const s of cfg.slots) {
      w.plan[s.id] = {};
      for (let d = 0; d < 7; d++) {
        const pp = prev && prev.plan && prev.plan[s.id] && prev.plan[s.id][d];
        w.plan[s.id][d] = pp ? { on: pp.on, label: pp.label, demand: pp.demand ? clone(pp.demand) : undefined }
          : { on: !!(s.active && s.days[d]), label: s.dayLabels[d] || (s.flight + ' ' + s.time + (s.route ? ' ' + s.route : '')).trim() };
      }
    }
    if (prev) {
      const st = stats(cfg, prev);
      for (const sf of cfg.staff) {
        const c = prev.cells[sf.id] && prev.cells[sf.id][6];
        if (c) w.carry[sf.id] = { status: c.status || '', note: c.note || '', items: (c.items || []).map(i => ({ slot: i.slot, role: i.role })) };
        w.prevNights[sf.id] = st.per[sf.id] ? st.per[sf.id].nights : 0;
      }
    }
    return w;
  }
  function fmtTime(t) { t = String(t || '').padStart(4, '0'); return t.slice(0, 2) + ':' + t.slice(2); }

  /* ---------- truy vấn ---------- */
  const slotMap = cfg => { const m = {}; cfg.slots.forEach(s => m[s.id] = s); return m; };
  const codeMap = cfg => { const m = {}; cfg.codes.forEach(c => m[key(c.code)] = c); return m; };
  function planOf(cfg, week, slotId, d) {
    const p = week.plan[slotId] && week.plan[slotId][d];
    const s = cfg.slots.find(x => x.id === slotId);
    if (!s) return { on: false, label: '', demand: {} };
    if (!p) return { on: !!(s.active && s.days[d]), label: s.dayLabels[d] || s.flight, demand: s.demand };
    return { on: !!p.on, label: p.label || '', demand: p.demand || s.demand };
  }
  function timeOfLabel(label, fallback) { const m = String(label || '').match(/\b(\d{4})\b/); return m ? m[1] : fallback; }
  // khung giờ làm (phút tính từ 00:00 thứ Hai). Chuyến trước giờ nightCutoff thuộc đêm của ngày đó.
  function windowOf(cfg, week, slot, d) {
    const r = cfg.rules;
    const label = week ? planOf(cfg, week, slot.id, d >= 0 ? d : 6).label : '';
    const t = String(timeOfLabel(label, slot.time) || '1200').padStart(4, '0');
    let m = +t.slice(0, 2) * 60 + +t.slice(2);
    if (m < r.nightCutoffHour * 60 && slot.overnight !== false) m += 1440;
    const before = slot.before != null && slot.before !== '' ? +slot.before : r.beforeMin;
    const after = slot.after != null && slot.after !== '' ? +slot.after : r.afterMin;
    const base = d * 1440;
    return { s: base + m - before, e: base + m + after, std: base + m };
  }
  function cellOf(week, sid, d) { return (week.cells[sid] && week.cells[sid][d]) || null; }
  function ensureCell(week, sid, d) {
    week.cells[sid] = week.cells[sid] || {};
    week.cells[sid][d] = week.cells[sid][d] || { status: '', note: '', items: [] };
    if (!week.cells[sid][d].items) week.cells[sid][d].items = [];
    return week.cells[sid][d];
  }
  function blockRange(block, d) {
    const b = d * 1440;
    if (block === 'all') return [b - 60, b + 1440 + 360];
    if (block === 'am') return [b, b + 13 * 60];
    if (block === 'pm') return [b + 12 * 60, b + 1440 + 360];
    if (block === 'night') return [b + 21 * 60, b + 1440 + 360];
    return null;
  }
  function statusCode(cfg, cm, cell) {
    if (!cell || !cell.status) return null;
    return cm[key(cell.status)] || null;
  }

  /* ---------- kiểm tra một phân công ---------- */
  // trả về danh sách lý do vi phạm (rỗng = hợp lệ). ctx chứa cache.
  function makeCtx(cfg, week) {
    const sm = slotMap(cfg), cm = codeMap(cfg);
    const ctx = { cfg, week, sm, cm, per: {} };
    for (const sf of cfg.staff) ctx.per[sf.id] = personState(ctx, sf);
    return ctx;
  }
  function personState(ctx, sf) {
    const { cfg, week, sm } = ctx;
    const st = { items: [], nights: 0, nightHours: 0, load: 0, days: new Set(), bySlot: {}, perDay: [0, 0, 0, 0, 0, 0, 0] };
    const c0 = week.carry && week.carry[sf.id];
    if (c0) for (const it of c0.items || []) { const s = sm[it.slot]; if (s) { const w = windowOf(cfg, null, s, -1); st.items.push({ d: -1, slot: it.slot, s: w.s, e: w.e }); } }
    for (let d = 0; d < 7; d++) {
      const c = cellOf(week, sf.id, d); if (!c) continue;
      for (const it of c.items || []) {
        const s = sm[it.slot]; if (!s) continue;
        const w = windowOf(cfg, week, s, d);
        st.items.push({ d, slot: it.slot, role: it.role, tag: it.tag, s: w.s, e: w.e });
        st.load++; st.perDay[d]++; st.days.add(d);
        st.bySlot[it.slot] = (st.bySlot[it.slot] || 0) + 1;
        if (s.night) { st.nights++; st.nightHours += +s.nightWeight || 0; }
      }
    }
    return st;
  }
  function overlapPairs(r) {
    const set = new Set();
    String(r.overlapOK || '').split(',').map(x => x.trim()).filter(Boolean).forEach(p => { const [a, b] = p.split('+').map(x => x.trim()); if (a && b) { set.add(a + '+' + b); set.add(b + '+' + a); } });
    return set;
  }
  function checkAssign(ctx, sf, slotId, d, role, opts = {}) {
    const { cfg, week, sm, cm } = ctx; const r = cfg.rules; const why = [];
    const s = sm[slotId]; if (!s) return ['Slot không tồn tại'];
    const plan = planOf(cfg, week, slotId, d);
    if (!plan.on) why.push(slotId + ' không bay ngày này (CANX)');
    if (!sf.active || sf.kind !== 'flight') why.push('Nhân viên không ở nhóm chia chuyến');
    if (role && role !== 'A' && !(sf.roles || []).includes(role)) why.push('Chưa được làm vị trí /' + role);
    if (sf.allow && sf.allow.length && !sf.allow.includes(slotId) && !sf.allow.includes(s.airline)) why.push('Không thuộc hãng được làm');
    if (s.night && sf.noNight) why.push('Nhân viên không làm đêm');
    const w = windowOf(cfg, week, s, d);
    const cell = cellOf(week, sf.id, d);
    const code = statusCode(cfg, cm, cell);
    if (code && code.block !== 'none') {
      const br = blockRange(code.block, d);
      if (br && w.s < br[1] && w.e > br[0]) why.push('Trùng trạng thái ' + code.code);
    }
    // trạng thái ngày hôm trước kéo sang (vd OFF hôm trước không chặn sáng nay)
    const st = ctx.per[sf.id];
    const others = st.items.filter(i => !(opts.ignore && i.d === opts.ignore.d && i.slot === opts.ignore.slot));
    const sameDay = others.filter(i => i.d === d);
    if (sameDay.some(i => i.slot === slotId)) why.push('Đã xếp ' + slotId + ' trong ngày');
    const okPairs = ctx.okPairs || (ctx.okPairs = overlapPairs(r));
    const units = new Set(sameDay.map(i => i.tag === 'LJ3-4' ? 'LJ3-4' : i.slot));
    if (units.size >= r.maxSlotsPerDay && !(opts.tag === 'LJ3-4' && units.has('LJ3-4'))) why.push('Quá ' + r.maxSlotsPerDay + ' slot/ngày');
    for (const i of others) {
      if (i.slot === slotId && i.d === d) continue;
      if (w.s < i.e && w.e > i.s && !(i.d === d && okPairs.has(i.slot + '+' + slotId))) { why.push('Trùng giờ với ' + i.slot + (i.d !== d ? ' (' + (i.d < 0 ? 'CN trước' : DAYS[i.d]) + ')' : '')); continue; }
      if (i.d !== d) {
        const gap = i.e <= w.s ? w.s - i.e : (w.e <= i.s ? i.s - w.e : 0);
        const adjacent = Math.abs(i.d - d) === 1;
        if (adjacent && gap < r.minRestHours * 60) why.push('Nghỉ < ' + r.minRestHours + 'h so với ' + i.slot + ' ' + (i.d < 0 ? 'CN trước' : DAYS[i.d]));
      }
    }
    const nightsOther = others.filter(i => i.d >= 0 && sm[i.slot] && sm[i.slot].night).length;
    if (s.night && nightsOther >= r.maxNightsPerWeek) why.push('Quá ' + r.maxNightsPerWeek + ' đêm/tuần');
    const daysOther = new Set(others.filter(i => i.d >= 0).map(i => i.d));
    if (!daysOther.has(d) && daysOther.size >= r.maxWorkDays) why.push('Quá ' + r.maxWorkDays + ' ngày làm/tuần');
    return why;
  }

  /* ---------- quân số ---------- */
  function coverage(cfg, week) {
    const cov = {};
    for (const s of cfg.slots) {
      cov[s.id] = {};
      for (let d = 0; d < 7; d++) {
        const p = planOf(cfg, week, s.id, d);
        const need = p.on ? clone(p.demand || {}) : {};
        cov[s.id][d] = { on: p.on, label: p.label, need, have: {}, people: [], short: 0, over: 0 };
      }
    }
    for (const sf of cfg.staff) for (let d = 0; d < 7; d++) {
      const c = cellOf(week, sf.id, d); if (!c) continue;
      for (const it of c.items || []) {
        const x = cov[it.slot] && cov[it.slot][d]; if (!x) continue;
        const role = it.role && ROLE_IDS.includes(it.role) ? it.role : 'A';
        x.have[role] = (x.have[role] || 0) + 1;
        x.people.push({ sid: sf.id, role });
      }
    }
    for (const sid in cov) for (let d = 0; d < 7; d++) {
      const x = cov[sid][d];
      let short = 0, over = 0, needT = 0, haveT = 0;
      for (const r of ['S', 'C', 'G', 'GC', 'SE']) {
        const n = +x.need[r] || 0, h = x.have[r] || 0; needT += n; haveT += h;
        if (h < n) short += n - h;
      }
      needT += +x.need.A || 0; haveT += x.have.A || 0;
      // vị trí đặc biệt thừa có thể bù cho nhân viên thường
      const extraSpecial = ['S', 'C', 'G', 'GC', 'SE'].reduce((a, r) => a + Math.max(0, (x.have[r] || 0) - (+x.need[r] || 0)), 0);
      const aShort = Math.max(0, (+x.need.A || 0) - (x.have.A || 0) - extraSpecial);
      short += aShort;
      over = Math.max(0, haveT - needT);
      x.short = short; x.over = over; x.needT = needT; x.haveT = haveT;
    }
    return cov;
  }

  /* ---------- thống kê ---------- */
  function stats(cfg, week) {
    const sm = slotMap(cfg), cm = codeMap(cfg); const per = {};
    for (const sf of cfg.staff) {
      const p = { slots: 0, nights: 0, nightHours: 0, off: 0, leave: 0, sby: 0, workDays: 0, bySlot: {}, byAirline: {}, dutyHours: 0 };
      for (let d = 0; d < 7; d++) {
        const c = cellOf(week, sf.id, d); if (!c) continue;
        const code = statusCode(cfg, cm, c);
        if (code) { if (code.kind === 'off') p.off += +code.off || 0; if (code.kind === 'leave') p.leave++; if (code.kind === 'sby') p.sby++; }
        const its = c.items || [];
        if (its.length) p.workDays++;
        for (const it of its) {
          const s = sm[it.slot]; if (!s) continue;
          p.slots++; p.bySlot[it.slot] = (p.bySlot[it.slot] || 0) + 1;
          p.byAirline[s.airline] = (p.byAirline[s.airline] || 0) + 1;
          if (s.night) { p.nights++; p.nightHours += +s.nightWeight || 0; }
          const w = windowOf(cfg, week, s, d); p.dutyHours += (w.e - w.s) / 60;
        }
      }
      p.prevNights = +(week.prevNights && week.prevNights[sf.id]) || 0;
      per[sf.id] = p;
    }
    return { per };
  }

  /* ---------- toàn bộ cảnh báo ---------- */
  function validate(cfg, week) {
    const ctx = makeCtx(cfg, week);
    const cellIssues = {}; const list = [];
    const add = (sid, d, msg, level, slot) => {
      const k = sid + '|' + d; (cellIssues[k] = cellIssues[k] || []).push({ msg, level, slot });
      list.push({ sid, d, msg, level, slot });
    };
    for (const sf of cfg.staff) {
      if (sf.kind !== 'flight') continue;
      for (let d = 0; d < 7; d++) {
        const c = cellOf(week, sf.id, d); if (!c) continue;
        for (const it of c.items || []) {
          const why = checkAssign(ctx, sf, it.slot, d, it.role, { ignore: { d, slot: it.slot }, tag: it.tag });
          for (const m of why) add(sf.id, d, it.slot + ': ' + m, 'err', it.slot);
        }
      }
      const st = stats(cfg, { ...week, cells: { [sf.id]: week.cells[sf.id] || {} } }).per[sf.id];
      const cm = codeMap(cfg);
      let offLike = 0;
      for (let d = 0; d < 7; d++) { const c = cellOf(week, sf.id, d); const code = statusCode(cfg, cm, c); if (code && (code.kind === 'off' || code.kind === 'leave')) offLike += code.kind === 'off' ? +code.off : 1; else if (!c || !(c.items || []).length && !(c.status)) offLike += 0; }
      if (sf.active && offLike < cfg.rules.minOffPerWeek) add(sf.id, -1, 'Chưa có ngày OFF trong tuần', 'warn');
      if (st.nights > cfg.rules.maxNightsPerWeek) add(sf.id, -1, st.nights + ' đêm (tối đa ' + cfg.rules.maxNightsPerWeek + ')', 'err');
    }
    const cov = coverage(cfg, week);
    for (const sid in cov) for (let d = 0; d < 7; d++) {
      const x = cov[sid][d];
      if (x.short > 0) list.push({ sid: null, slot: sid, d, msg: sid + ' ' + DAYS[d] + ': thiếu ' + x.short + ' người', level: 'err' });
      if (!x.on && x.haveT > 0) list.push({ sid: null, slot: sid, d, msg: sid + ' ' + DAYS[d] + ': chuyến huỷ nhưng còn ' + x.haveT + ' người', level: 'warn' });
    }
    return { cellIssues, list, cov };
  }

  /* ---------- chia lịch tự động ---------- */
  function rng(seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return ((s >>> 0) % 10000) / 10000; }; }

  function autoAssign(cfg, weekIn, opts = {}) {
    const week = clone(weekIn); const r = cfg.rules; const rand = rng(opts.seed || 7);
    const sm = slotMap(cfg), cm = codeMap(cfg);
    const flightStaff = cfg.staff.filter(s => s.active && s.kind === 'flight' && s.auto !== false);
    const allStaff = cfg.staff;
    // 1. dọn
    if (opts.mode === 'rebuild') {
      for (const sf of allStaff) for (let d = 0; d < 7; d++) {
        const c = cellOf(week, sf.id, d); if (!c) continue;
        c.items = (c.items || []).filter(i => i.lock);
        if (c.autoOff) { c.status = ''; c.autoOff = false; }
      }
    }
    // gỡ phân công ở chuyến đã huỷ (không khoá)
    for (const sf of allStaff) for (let d = 0; d < 7; d++) {
      const c = cellOf(week, sf.id, d); if (!c) continue;
      c.items = (c.items || []).filter(i => i.lock || planOf(cfg, week, i.slot, d).on);
      // gỡ phân công (không khoá) trùng với trạng thái nghỉ mới nhập (OFF, NP, ốm…)
      const code = statusCode(cfg, cm, c);
      if (code && code.block !== 'none') {
        const br = blockRange(code.block, d);
        c.items = c.items.filter(i => { if (i.lock || !sm[i.slot]) return true; const w = windowOf(cfg, week, sm[i.slot], d); return !(br && w.s < br[1] && w.e > br[0]); });
      }
    }
    // 2. tự thêm ngày OFF
    if (r.autoOff) {
      const offCount = [0, 0, 0, 0, 0, 0, 0];
      const isOffLike = c => { const code = statusCode(cfg, cm, c); return code && (code.kind === 'off' || code.kind === 'leave'); };
      for (const sf of allStaff) for (let d = 0; d < 7; d++) if (isOffLike(cellOf(week, sf.id, d))) offCount[d]++;
      const demandDay = [0, 1, 2, 3, 4, 5, 6].map(d => cfg.slots.reduce((a, s) => { const p = planOf(cfg, week, s.id, d); return a + (p.on ? Object.values(p.demand || {}).reduce((x, y) => x + (+y || 0), 0) : 0); }, 0));
      const order = flightStaff.slice().sort(() => rand() - 0.5);
      for (const sf of order) {
        let offs = 0;
        for (let d = 0; d < 7; d++) { const c = cellOf(week, sf.id, d); const code = statusCode(cfg, cm, c); if (code && code.kind === 'off') offs += +code.off || 0; if (code && code.kind === 'leave') offs += 1; }
        if (offs >= r.minOffPerWeek) continue;
        let best = -1, bestV = 1e9;
        for (let d = 0; d < 7; d++) {
          const c = cellOf(week, sf.id, d);
          if (c && ((c.items || []).length || c.status)) continue;
          const prevNight = d > 0 && (cellOf(week, sf.id, d - 1)?.items || []).some(i => sm[i.slot]?.night);
          const v = offCount[d] * 3 + demandDay[d] / 20 + (prevNight ? -1 : 0) + rand();
          if (v < bestV) { bestV = v; best = d; }
        }
        if (best >= 0) { const c = ensureCell(week, sf.id, best); c.status = 'OFF'; c.autoOff = true; offCount[best]++; }
      }
    }
    // 3. tham lam theo ngày
    const ctx = makeCtx(cfg, week);
    const refresh = sid => { ctx.per[sid] = personState(ctx, cfg.staff.find(s => s.id === sid)); };
    const isSup = sf => (sf.roles || []).includes('S');
    const score = (sf, slot, d, role) => {
      const st = ctx.per[sf.id];
      let v = st.load * r.wLoad + (st.bySlot[slot.id] || 0) * r.wSameSlot;
      if (slot.night) v += st.nightHours * r.wNight + ((week.prevNights && week.prevNights[sf.id]) || 0) * r.wPrevNight;
      if ((role === 'A' || !role) && isSup(sf)) v += r.wSupOnAgent;
      if ((role === 'A' || !role) && (sf.roles || []).length > 1) v += 0.3 * ((sf.roles || []).length - 1);
      if (!st.perDay[d]) v += r.wNewDay;
      return v + rand() * 0.25;
    };
    const unfilled = [];
    let filled = 0;
    for (let d = 0; d < 7; d++) {
      const cov = coverage(cfg, week);
      const positions = [];
      for (const s of cfg.slots) {
        const x = cov[s.id][d]; if (!x.on) continue;
        for (const role of ['S', 'C', 'G', 'GC', 'SE', 'A']) {
          let n = (+x.need[role] || 0) - (x.have[role] || 0);
          for (let i = 0; i < n; i++) positions.push({ slot: s, role });
        }
      }
      const candCache = {};
      const candsFor = p => {
        const k = p.slot.id + '|' + p.role;
        if (!candCache[k]) candCache[k] = flightStaff.filter(sf => checkAssign(ctx, sf, p.slot.id, d, p.role).length === 0);
        return candCache[k];
      };
      while (positions.length) {
        let bi = -1, bc = null;
        for (let i = 0; i < positions.length; i++) {
          const cands = candsFor(positions[i]);
          if (bc === null || cands.length < bc.length) { bi = i; bc = cands; if (!cands.length) break; }
        }
        const p = positions.splice(bi, 1)[0];
        if (!bc.length) { unfilled.push({ slot: p.slot.id, d, role: p.role }); continue; }
        let best = null, bv = 1e9;
        for (const sf of bc) { const v = score(sf, p.slot, d, p.role); if (v < bv) { bv = v; best = sf; } }
        ensureCell(week, best.id, d).items.push({ slot: p.slot.id, role: p.role === 'A' ? '' : p.role, auto: true });
        refresh(best.id); filled++;
        // chỉ người vừa được giao thay đổi khả năng: cập nhật lại cache
        for (const k in candCache) {
          const [sl, ro] = k.split('|');
          const ok = checkAssign(ctx, best, sl, d, ro).length === 0;
          const arr = candCache[k]; const i = arr.indexOf(best);
          if (!ok && i >= 0) arr.splice(i, 1); else if (ok && i < 0) arr.push(best);
        }
      }
    }
    // 4. sửa chỗ trống: chuyển một phân công của người khác để giải phóng
    const still = [];
    for (const u of unfilled) {
      let done = false;
      const slot = sm[u.slot];
      for (const sf of flightStaff) {
        if (done) break;
        const why = checkAssign(ctx, sf, u.slot, u.d, u.role);
        if (!why.length) { ensureCell(week, sf.id, u.d).items.push({ slot: u.slot, role: u.role === 'A' ? '' : u.role, auto: true }); refresh(sf.id); done = true; break; }
        const c = cellOf(week, sf.id, u.d); if (!c) continue;
        for (const it of (c.items || []).slice()) {
          if (it.lock) continue;
          // thử bỏ it của sf, giao it cho người khác, rồi sf nhận chỗ trống
          c.items = c.items.filter(x => x !== it); refresh(sf.id);
          if (checkAssign(ctx, sf, u.slot, u.d, u.role).length === 0) {
            const alt = flightStaff.find(o => o.id !== sf.id && checkAssign(ctx, o, it.slot, u.d, it.role || 'A').length === 0);
            if (alt) {
              ensureCell(week, alt.id, u.d).items.push(Object.assign({}, it, { auto: true })); refresh(alt.id);
              c.items.push({ slot: u.slot, role: u.role === 'A' ? '' : u.role, auto: true }); refresh(sf.id);
              done = true; break;
            }
          }
          c.items.push(it); refresh(sf.id);
        }
      }
      if (done) filled++; else still.push(u);
    }
    // 5. cân bằng: chuyển phân công từ người tải cao sang người tải thấp
    let moves = 0;
    for (let pass = 0; pass < (r.balancePasses || 0); pass++) {
      let changed = false;
      const ordered = flightStaff.slice().sort((a, b) => cost(b) - cost(a));
      for (const A of ordered) {
        for (let d = 0; d < 7; d++) {
          const c = cellOf(week, A.id, d); if (!c) continue;
          for (const it of (c.items || []).slice()) {
            if (it.lock || !it.auto) continue;
            const slot = sm[it.slot]; const role = it.role || 'A';
            const ca = cost(A);
            let best = null, bestGain = 0.9;
            for (const B of flightStaff) {
              if (B.id === A.id) continue;
              if (checkAssign(ctx, B, it.slot, d, role).length) continue;
              const cb = cost(B);
              const w = slot.night ? (+slot.nightWeight || 0) * r.wNight + 1 : 1;
              const gain = (ca - cb) - w;
              if ((role === 'A') && isSup(B) && !isSup(A)) continue;
              if (gain > bestGain) { bestGain = gain; best = B; }
            }
            if (best) {
              c.items = c.items.filter(x => x !== it); refresh(A.id);
              ensureCell(week, best.id, d).items.push(it); refresh(best.id);
              moves++; changed = true;
            }
          }
        }
      }
      if (!changed) break;
    }
    function cost(sf) { const st = ctx.per[sf.id]; return st.load * r.wLoad + st.nightHours * r.wNight; }
    return { week, report: { filled, unfilled: still, moves } };
  }

  /* ---------- đọc file Excel (dạng bảng giá trị) ---------- */
  // aoa: mảng các dòng (giá trị đã tính); fills: hàm (r,c) -> mã màu ARGB hoặc null
  const FLIGHT_RE = /^(TW\d|LJ\d|AK\d|Z2|RS|VZ\d|FD\d|OD|BX1-2|BX\d|HX\d|MH\d?|EK|G\d|LJ3-4)(?:\s*\/\s*([A-Z0-9 ]+))?$/;
  function parseToken(tok, cfg, cm) {
    let t = norm(tok); if (!t) return null;
    let up = t.toUpperCase().replace(/^Z 2/, 'Z2').replace(/^M H/, 'MH');
    const code = cm[key(t)];
    if (code) return { type: 'status', code: code.code };
    const m = up.replace(/\s+(?=\/)/g, '').match(FLIGHT_RE);
    if (m) {
      let slot = m[1]; let rr = (m[2] || '').replace(/\s/g, '');
      if (slot === 'MH1') slot = 'MH';
      if (slot === 'BX2') slot = 'BX1-2';
      let role = '', tag = '';
      if (rr) { if (ROLE_IDS.includes(rr)) role = rr; else tag = rr; }
      const slots = slot === 'LJ3-4' ? ['LJ3', 'LJ4'] : [slot];
      return { type: 'items', items: slots.map(s => ({ slot: s, role, tag: slot === 'LJ3-4' ? 'LJ3-4' : tag })) };
    }
    return { type: 'note', text: t };
  }
  function parseCell(text, cfg, cm) {
    const out = { status: '', note: [], items: [] };
    const raw = norm(text); if (!raw) return out;
    const whole = cm[key(raw)];
    if (whole) { out.status = whole.code; return out; }
    if (/^OFF\s*1\/2/i.test(raw)) { out.status = /D$/i.test(raw) ? 'OFF1/2 + D' : 'OFF1/2 + S'; return out; }
    let parts = raw.split(/\s*\+\s*|\s+-\s+/);
    for (const p of parts) {
      const t = parseToken(p, cfg, cm);
      if (!t) continue;
      if (t.type === 'status' && !out.status) out.status = t.code;
      else if (t.type === 'items') out.items.push(...t.items);
      else if (t.type === 'status') out.note.push(t.code);
      else {
        // ghép trạng thái ở đầu chuỗi: "K Đ/ SBY", "BU A K 03OCT"
        const st = cfg.codes.slice().sort((a, b) => b.code.length - a.code.length).find(c => key(t.text).startsWith(key(c.code)));
        if (st && !out.status) { out.status = st.code; const rest = norm(t.text.slice(st.code.length).replace(/^\/\s*/, '')); if (rest) out.note.push(rest); }
        else out.note.push(t.text);
      }
    }
    return out;
  }
  function splitName(raw) {
    let name = norm(raw); const tags = []; let noNight = false;
    const m = name.match(/\s+(KD|AKFD|VZTW|VZBX|LJ)$/i);
    if (m) { tags.push(m[1].toUpperCase()); name = norm(name.slice(0, m.index)); if (m[1].toUpperCase() === 'KD') noNight = true; }
    return { name, tags, noNight };
  }
  function parseRosterAOA(aoa, fills, cfgIn) {
    const cfg = cfgIn ? clone(cfgIn) : emptyConfig();
    const cm = codeMap(cfg);
    const cellStr = (r, c) => (aoa[r] && aoa[r][c] != null) ? aoa[r][c] : '';
    // tìm dòng ngày
    let start = null;
    for (let r = 0; r < Math.min(6, aoa.length) && !start; r++) {
      const v = cellStr(r, 2);
      if (v instanceof Date) start = isoDate(v);
      else if (typeof v === 'number' && v > 40000) { const d = new Date(Math.round((v - 25569) * 86400000)); start = isoDate(new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate())); }
      else if (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}/.test(v)) start = v.slice(0, 10);
    }
    if (!start) throw new Error('Không thấy ngày bắt đầu tuần ở ô C1. Kiểm tra lại định dạng file.');
    start = mondayOf(start);
    const week = newWeek(cfg, start, null);
    // xác định dòng nhân viên: cột Q (16) là số
    let firstStaff = -1, ticketRow = -1;
    for (let r = 0; r < aoa.length; r++) {
      const a = norm(cellStr(r, 0)).toUpperCase();
      if (firstStaff < 0 && a && typeof cellStr(r, 16) === 'number') firstStaff = r;
      if (a === 'TICKET') { ticketRow = r; break; }
    }
    if (firstStaff < 0) throw new Error('Không tìm thấy danh sách nhân viên (cột A + số đếm ở cột Q).');
    // lịch bay
    const rowToSlot = { BX2: 'BX1-2', 'Z2': 'Z2' };
    for (let r = 0; r < firstStaff; r++) {
      let a = norm(cellStr(r, 0)).toUpperCase().replace(/\s/g, ''); if (!a) continue;
      const sid = rowToSlot[a] || a;
      const s = cfg.slots.find(x => x.id === sid); if (!s) continue;
      for (let d = 0; d < 7; d++) {
        const v = norm(cellStr(r, 2 + 2 * d));
        const canx = /CANX|CNX/i.test(v);
        week.plan[s.id] = week.plan[s.id] || {};
        const label = norm(v.replace(/CANX|CNX/ig, ''));
        week.plan[s.id][d] = { on: !!v && !canx, label: label || (week.plan[s.id][d] && week.plan[s.id][d].label) || '' };
      }
    }
    // nhân viên
    const end = ticketRow > 0 ? ticketRow : aoa.length;
    const seen = {};
    const observed = {};
    for (let r = firstStaff; r < end; r++) {
      const raw = cellStr(r, 0); if (!norm(raw)) continue;
      const nm = splitName(raw);
      let sf = cfg.staff.find(s => key(s.name) === key(nm.name));
      const g = fills ? FILL_GROUP[String(fills(r, 0) || '').toUpperCase().slice(-6)] : null;
      if (!sf) { sf = newStaff(nm.name, { tags: nm.tags, noNight: nm.noNight, group: g || 3 }); cfg.staff.push(sf); }
      else if (g) sf.group = g;
      seen[sf.id] = true;
      const prevN = cellStr(r, 17); if (typeof prevN === 'number') week.prevNights[sf.id] = prevN;
      const roles = new Set(sf.roles || []);
      const handle = (text, target) => {
        const pc = parseCell(text, cfg, cm);
        if (pc.status && !target.status) target.status = pc.status; else if (pc.status) pc.note.unshift(pc.status);
        for (const it of pc.items) { if (it.role) roles.add(it.role); target.items.push({ slot: it.slot, role: it.role, ...(it.tag ? { tag: it.tag } : {}) }); }
        if (pc.note.length) target.note = norm((target.note ? target.note + '; ' : '') + pc.note.join('; '));
      };
      const carry = { status: '', note: '', items: [] }; handle(cellStr(r, 1), carry);
      if (carry.status || carry.items.length || carry.note) week.carry[sf.id] = carry;
      for (let d = 0; d < 7; d++) {
        const c = { status: '', note: '', items: [] };
        handle(cellStr(r, 2 + 2 * d), c); handle(cellStr(r, 3 + 2 * d), c);
        if (c.status === 'TS' || c.status || c.items.length || c.note) { week.cells[sf.id] = week.cells[sf.id] || {}; week.cells[sf.id][d] = c; }
        for (const it of c.items) { const k = it.slot + '|' + d; observed[k] = observed[k] || {}; const rr = it.role || 'A'; observed[k][rr] = (observed[k][rr] || 0) + 1; }
      }
      sf.roles = ROLE_IDS.filter(x => roles.has(x));
    }
    // các nhóm khác (Ticket, Thai sản, PVDB): ghi chú tự do

async function resolveRole() {
  const me = lc(FBX.user.email);
  const ref = FBX.fs.doc('access/members');
  let s;
  try { s = await ref.get(); }
  catch (e) { if (e && e.code === 'permission-denied') return null; throw e; }
  const m = s.exists ? s.data() : {};
  const editors = (m.editors || []).map(lc), viewers = (m.viewers || []).map(lc);
  FBX.members = { editors, viewers };
  if (editors.includes(me)) return 'editor';
  if (viewers.includes(me)) return 'viewer';
  // đọc được nhưng không có tên: đây là chủ dự án (khai báo trong firestore.rules) → tự thêm vào người làm lịch
  editors.push(me);
  await ref.set({ editors, viewers, updatedAt: new Date().toISOString() }, { merge: true });
  return 'editor';
}
async function authGate() {
  firebase.initializeApp(window.FIREBASE_CONFIG);
  FBX.auth = firebase.auth(); FBX.fs = firebase.firestore();
  try { FBX.auth.languageCode = 'vi'; } catch (e) {}
  try { await FBX.auth.getRedirectResult(); } catch (e) { S.authErr = authMsg(e); }
  return new Promise(resolve => {
    let done = false;
    FBX.auth.onAuthStateChanged(async u => {
      FBX.user = u;
      if (done) { if (!u) location.reload(); return; }
      if (!u) { S.gate = 'login'; renderGate(); return; }
      if (!u.emailVerified) { S.gate = 'verify'; renderGate(); return; }
      S.gate = 'checking'; $('#main').innerHTML = '<div class="empty"><h2>Đang kiểm tra quyền…</h2></div>';
      let role = null;
      try { role = await resolveRole(); }
      catch (e) { S.gate = 'error'; S.authErr = 'Không đọc được quyền truy cập: ' + (e.message || e.code); renderGate(); return; }
      if (!role) { S.gate = 'denied'; renderGate(); return; }
      FBX.role = role; S.ro = role !== 'editor'; S.gate = null; S.authErr = ''; S.authInfo = '';
      document.body.classList.remove('gate'); document.body.classList.toggle('ro', S.ro);
      done = true; resolve(true);
    });
  });
}
async function authAction(a) {
  S.authErr = ''; S.authInfo = '';
  const email = ($('#lgEmail') || {}).value, pass = ($('#lgPass') || {}).value;
  if (email != null) S.lgEmail = email.trim();
  try {
    if (a === 'g-login') {
      const p = new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account' });
      try { await FBX.auth.signInWithPopup(p); }
      catch (e) { if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') await FBX.auth.signInWithRedirect(p); else throw e; }
    } else if (a === 'pw-login') await FBX.auth.signInWithEmailAndPassword(S.lgEmail, pass || '');
    else if (a === 'pw-signup') { const c = await FBX.auth.createUserWithEmailAndPassword(S.lgEmail, pass || ''); await c.user.sendEmailVerification(); }
    else if (a === 'pw-reset') { if (!S.lgEmail) { S.authErr = 'Nhập email trước rồi bấm Quên mật khẩu.'; } else { await FBX.auth.sendPasswordResetEmail(S.lgEmail); S.authInfo = 'Đã gửi thư đặt lại mật khẩu tới ' + S.lgEmail + '.'; } }
    else if (a === 'verify-resend') { await FBX.user.sendEmailVerification(); S.authInfo = 'Đã gửi lại thư xác minh.'; }
    else if (a === 'verify-check') { await FBX.user.reload(); await FBX.user.getIdToken(true); if (FBX.auth.currentUser.emailVerified) { location.reload(); return; } S.authErr = 'Email vẫn chưa được xác minh. Hãy bấm vào link trong thư.'; }
    else if (a === 'retry') { location.reload(); return; }
  } catch (e) { S.authErr = authMsg(e); }
  if (S.gate) renderGate();
}

function mutateWeek(fn, opts = {}) {

}

}
function undo() { if (!S.undo.length) return; S.redo.push(snapshot()); S.week = JSON.parse(S.undo.pop()); recompute(); Store.save('week', S.week.start); render(); toast('Đã hoàn tác'); }

    if (!any) continue;
    h += '<tr><td class="stick slotname">' + esc(s.id) + '<small>' + esc(s.flight) + ' · ' + C.fmtTime(s.time) + (s.night ? ' · đêm' : '') + '</small></td>';

      let cls = !x.on ? (x.haveT ? 'over' : 'off') : x.short ? 'short' : x.over ? 'over' : 'ok';
      const parts = ['S', 'C', 'G', 'GC', 'SE'].filter(r => (+x.need[r] || 0) || x.have[r]).map(r => r + ' ' + (x.have[r] || 0) + '/' + (+x.need[r] || 0));
      h += '<td class="cv ' + cls + (isSel ? ' sel' : '') + '" data-act="cov" data-slot="' + s.id + '" data-d="' + d + '" title="' + esc(x.label) + '">' +
        (x.on ? '<b>' + x.haveT + '/' + x.needT + '</b><small>' + esc(parts.join(' · ') || ' ') + '</small>' : '<b>' + (x.haveT ? 'CANX · ' + x.haveT + ' người' : 'Không bay') + '</b>') + '</td>';
    }

  }

function kpiRow() {
  const cov = S.val.cov; let short = 0, need = 0, have = 0, over = 0;
  for (const sid in cov) for (let d = 0; d < 7; d++) { const x = cov[sid][d]; if (x.on) { short += x.short; need += x.needT || 0; have += x.haveT || 0; over += x.over; } }
  const errs = S.val.list.filter(x => x.level === 'err' && x.sid).length;
  const warns = S.val.list.filter(x => x.level === 'warn').length;
  const pct = need ? Math.round((need - short) / need * 100) : 100;
  return '<div class="kpis">' +
    '<div class="kpi ' + (short ? 'err' : 'ok') + '"><div class="k">Vị trí còn thiếu</div><div class="v">' + short + '</div><div class="s">trên ' + need + ' vị trí cần trong tuần</div></div>' +
    '<div class="kpi"><div class="k">Đã phủ</div><div class="v">' + pct + '%</div><div class="s">' + have + ' lượt đã xếp' + (over ? ', thừa ' + over : '') + '</div></div>' +
    '<div class="kpi ' + (errs ? 'err' : 'ok') + '"><div class="k">Vi phạm luật</div><div class="v">' + errs + '</div><div class="s">trùng giờ, nghỉ chưa đủ, sai vị trí…</div></div>' +
    '<div class="kpi ' + (warns ? 'warn' : 'ok') + '"><div class="k">Cảnh báo</div><div class="v">' + warns + '</div><div class="s">thiếu OFF, chuyến huỷ còn người</div></div></div>';
}

function pickRole(sf, slotId, d) {

  return '';
}

function readFile(input, asText) {

    const f = input.files && input.files[0]; if (!f) return rej(new Error('Chưa chọn file'));
    const r = new FileReader(); r.onload = () => res({ name: f.name, data: r.result }); r.onerror = () => rej(r.error);

  });

function deleteWeek() {
  const start = S.week.start;
  modal('Xoá tuần ' + weekName(start) + '?', '<p style="margin:0">Mọi phân công, trạng thái và chấm công của tuần này sẽ bị xoá vĩnh viễn.</p>', [{ label: 'Huỷ' }, { label: 'Xoá tuần', cls: 'danger', fn: async () => {
    await Store.deleteWeek(start); S.weeks = S.weeks.filter(x => x !== start); S.week = null;
    if (S.weeks.length) await openWeek(S.weeks[S.weeks.length - 1]); else render();
    toast('Đã xoá tuần');
  } }]);
}

/* ================= SỰ KIỆN ================= */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act],[data-tab]'); if (!t) return;
  if (t.dataset.tab) { S.tab = t.dataset.tab; S.sel = null; S.covSel = null; S._keepScroll = false; render(); return; }
  const a = t.dataset.act;
  const w = S.week;
  switch (a) {
    case 'close': S.sel = null; S.covSel = null; S.covRole = null; render(); break;
    case 'wk-prev': case 'wk-next': {
      if (!w) break; const i = S.weeks.indexOf(w.start) + (a === 'wk-prev' ? -1 : 1);
      if (i >= 0 && i < S.weeks.length) await openWeek(S.weeks[i]); else toast(a === 'wk-prev' ? 'Không có tuần trước' : 'Chưa có tuần sau. Bấm "+ Tuần mới".'); break;
    }
    case 'wk-new': newWeekFlow(); break;
    case 'wk-del': deleteWeek(); break;
    case 'undo': undo(); break;
    case 'redo': redo(); break;
    case 'auto': if (w) openAuto(); break;
    case 'go-cfg': e.preventDefault(); S.tab = 'cfg'; S.cfgTab = 'staff'; render(); break;
    case 'cell': if (S.ro) break; S.sel = { sid: t.dataset.sid, d: +t.dataset.d }; render(); break;
    case 'sel-move': {
      if (!S.sel) break;
      if (t.dataset.dx) S.sel.d = Math.max(0, Math.min(6, S.sel.d + +t.dataset.dx));
      if (t.dataset.dy) { const l = staffList(); const order = S.cfg.groups.flatMap(g => l.filter(s => s.group === g.id)); const i = order.findIndex(s => s.id === S.sel.sid) + +t.dataset.dy; if (order[i]) S.sel.sid = order[i].id; }
      render(); break;
    }
    case 'it-add': {
      const { sid, d } = S.sel; const slot = t.dataset.slot, role = t.dataset.role || '';
      mutateWeek(w => { C.ensureCell(w, sid, d).items.push({ slot, role }); }); break;
    }
    case 'it-del': { const { sid, d } = S.sel; mutateWeek(w => { C.cellOf(w, sid, d).items.splice(+t.dataset.i, 1); }); break; }
    case 'it-lock': { const { sid, d } = S.sel; mutateWeek(w => { const it = C.cellOf(w, sid, d).items[+t.dataset.i]; it.lock = !it.lock; }); break; }
    case 'go-foot': { const a = $('#footAnchor'); if (a) a.scrollIntoView({ block: 'start' }); break; }
    case 'foot-cov': S.tab = 'cov'; S.covSel = { slot: t.dataset.slot, d: +t.dataset.d }; S.covRole = null; render(); break;
    case 'cov': S.covSel = { slot: t.dataset.slot, d: +t.dataset.d }; S.covRole = null; render(); break;
    case 'cov-add': { const { slot, d } = S.covSel; const sid = t.dataset.sid, role = t.dataset.role || ''; mutateWeek(w => { C.ensureCell(w, sid, d).items.push({ slot, role }); }); break; }
    case 'cov-del': { const { slot, d } = S.covSel; const sid = t.dataset.sid; mutateWeek(w => { const c = C.cellOf(w, sid, d); c.items = c.items.filter(i => i.slot !== slot); }); break; }
    case 'leave-clear': mutateWeek(w => { for (const sid in w.cells) for (const d in w.cells[sid]) { const c = w.cells[sid][d]; if (c.autoOff) { c.status = ''; c.autoOff = false; } } }); toast('Đã xoá các OFF do máy tự thêm'); break;
    case 'lock-all': mutateWeek(w => { for (const sid in w.cells) for (const d in w.cells[sid]) (w.cells[sid][d].items || []).forEach(i => i.lock = true); }); toast('Đã khoá mọi phân công hiện có'); break;
    case 'clear-auto':
      modal('Xoá phân công chưa khoá?', '<p style="margin:0">Mọi chuyến chưa khoá 🔒 sẽ bị bỏ, OFF tự thêm cũng bị bỏ. Trạng thái bạn nhập tay vẫn giữ. Có thể hoàn tác.</p>', [{ label: 'Huỷ' }, { label: 'Xoá', cls: 'danger', fn: () => {
        mutateWeek(w => { for (const sid in w.cells) for (const d in w.cells[sid]) { const c = w.cells[sid][d]; c.items = (c.items || []).filter(i => i.lock); if (c.autoOff) { c.status = ''; c.autoOff = false; } } });
      } }]); break;
    case 'plan-tog': {
      const { slot, d } = t.dataset;
      mutateWeek(w => { w.plan[slot] = w.plan[slot] || {}; const p = w.plan[slot][d] || C.planOf(S.cfg, w, slot, +d); w.plan[slot][d] = Object.assign({}, p, { on: !p.on }); }); break;
    }
    case 'plan-dem': {
      const { slot, d } = t.dataset; const s = slotById(slot); const p = C.planOf(S.cfg, w, slot, +d);
      const roles = ['S', 'C', 'G', 'GC', 'SE', 'A'];
      modal('Định mức ' + slot + ' · ' + C.dayLabel(w.start, +d), '<p class="help" style="margin-top:0">Số người cần cho riêng ngày này. Mặc định của slot: ' + esc(demandText(s.demand) || '0') + '.</p><div class="formgrid">' + roles.map(r => '<label><b>' + (r === 'A' ? 'Nhân viên thường' : '/' + r) + '</b><input class="inp" data-dem="' + r + '" value="' + esc(p.demand[r] || '') + '" inputmode="numeric"></label>').join('') + '</div>',
        [{ label: 'Dùng mặc định', fn: () => { mutateWeek(w => { if (w.plan[slot] && w.plan[slot][d]) delete w.plan[slot][d].demand; }); } }, { label: 'Huỷ' }, { label: 'Lưu', cls: 'pri', fn: host => {
          const dm = {}; host.querySelectorAll('[data-dem]').forEach(i => { const v = parseInt(i.value, 10); if (v > 0) dm[i.dataset.dem] = v; });
          mutateWeek(w => { w.plan[slot] = w.plan[slot] || {}; w.plan[slot][d] = Object.assign({}, C.planOf(S.cfg, w, slot, +d), { demand: dm }); });
        } }]); break;
    }
    case 'plan-reset':
      modal('Đặt lại lịch bay?', '<p style="margin:0">Lịch bay của tuần này sẽ theo ngày bay và số hiệu mặc định trong Cài đặt → Slot. Phân công giữ nguyên.</p>', [{ label: 'Huỷ' }, { label: 'Đặt lại', cls: 'pri', fn: () => { mutateWeek(w => { w.plan = C.newWeek(S.cfg, w.start, null).plan; }); } }]); break;
    case 'stat-metric': S.statMetric = t.dataset.k; render(); break;
    case 'jump': {
      if (t.dataset.sid) { S.tab = 'roster'; S.sel = { sid: t.dataset.sid, d: Math.max(0, +t.dataset.d) }; }
      else if (t.dataset.slot) { S.tab = 'cov'; S.covSel = { slot: t.dataset.slot, d: +t.dataset.d }; }
      render(); break;
    }
    case 'ts-day': S.tsDay = +t.dataset.d; render(); break;
    case 'cfg-tab': S.cfgTab = t.dataset.k; S._keepScroll = false; render(); break;
    case 'staff-add': mutateCfg(c => c.staff.push(C.newStaff('Nhân viên mới', { group: 3 }))); toast('Đã thêm. Sửa tên ở dòng cuối.'); break;
    case 'staff-del': {
      const sf = staffById(t.dataset.sid);
      modal('Xoá ' + sf.name + '?', '<p style="margin:0">Người này sẽ biến khỏi danh sách và mọi tuần. Nếu chỉ nghỉ tạm, hãy bỏ chọn "Đang làm".</p>', [{ label: 'Huỷ' }, { label: 'Xoá', cls: 'danger', fn: () => { mutateCfg(c => c.staff = c.staff.filter(s => s.id !== sf.id)); } }]); break;
    }
    case 'slot-add': mutateCfg(c => c.slots.push({ id: 'MOI' + (c.slots.length + 1), airline: '', flight: '', time: '1200', route: '', demand: { A: 2 }, night: false, nightWeight: 0, days: [1, 1, 1, 1, 1, 1, 1], dayLabels: {}, before: null, after: null, active: true, note: '' })); break;
    case 'slot-del': {
      const s = S.cfg.slots[+t.dataset.i];
      modal('Xoá slot ' + s.id + '?', '<p style="margin:0">Phân công đang dùng slot này sẽ không còn được tính.</p>', [{ label: 'Huỷ' }, { label: 'Xoá', cls: 'danger', fn: () => { mutateCfg(c => c.slots.splice(+t.dataset.i, 1)); } }]); break;
    }
    case 'code-add': mutateCfg(c => c.codes.push({ code: 'MÃ', label: '', block: 'none', off: 0, kind: 'duty' })); break;
    case 'code-del': mutateCfg(c => c.codes.splice(+t.dataset.i, 1)); break;
    case 'import-xlsx': $('#fileXlsx').click(); break;
    case 'import-json': $('#fileJson').click(); break;
    case 'export-xlsx': if (w) exportXlsx(); break;
    case 'export-json': exportJson(); break;
    case 'signout': if (FBX.auth) { Store.unsub.forEach(u => { try { u(); } catch (e) {} }); await FBX.auth.signOut(); location.reload(); } break;
    case 'g-login': case 'pw-login': case 'pw-signup': case 'pw-reset': case 'verify-resend': case 'verify-check': case 'retry': authAction(a); break;
    case 'reload': location.reload(); break;
    case 'trial': S.trial = true; S.gate = null; loadData(); break;
    case 'acc-save': saveAccess(); break;
    case 'copy-link': { const u = location.origin + location.pathname; try { await navigator.clipboard.writeText(u); toast('Đã chép link'); } catch (e) { toast(u); } break; }
    case 'reload-published':
      modal('Nạp lại bản đã đăng?', '<p style="margin:0">Mọi thay đổi chưa đăng trên trình duyệt này sẽ mất.</p>', [{ label: 'Huỷ' }, { label: 'Nạp lại', cls: 'danger', fn: () => {
        try { Object.keys(localStorage).filter(k => k.startsWith('pcsb:')).forEach(k => localStorage.removeItem(k)); } catch (e) {}
        location.reload();
      } }]); break;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'wkSel') { openWeek(t.value); return; }
  if (t.id === 'fileXlsx') { importXlsx(); return; }
  if (t.id === 'fileJson') { importJson(); return; }
  if (t.id === 'fg') { S.filter.group = +t.value; render(); return; }
  if (t.id === 'fi') { S.filter.issues = t.checked; render(); return; }
  if (t.id === 'ffoot') { S.showFoot = t.checked; try { localStorage.setItem('pcsb:foot', t.checked ? '1' : '0'); } catch (e) {} render(); return; }
  if (t.dataset.lv) {
    const [sid, d] = t.dataset.lv.split('|'); const v = t.value;
    mutateWeek(w => { const c = C.ensureCell(w, sid, +d); c.status = v; c.autoOff = false; });
    const c = C.cellOf(S.week, sid, +d); const k = codeOf(v);
    if (k && k.block !== 'none' && c && (c.items || []).length) toast('Người này đang có chuyến hôm đó. Bấm Tự động chia → Chỉ lấp chỗ trống để gỡ và xếp người khác.');
    return;
  }
  if (t.id === 'edRoleAdd') { S.roleAdd = t.value; render(); return; }
  if (t.id === 'covRole') { S.covRole = t.value; render(); return; }
  if (t.id === 'edStatus' || t.id === 'edNote') {
    const { sid, d } = S.sel; const v = t.value;
    mutateWeek(w => { const c = C.ensureCell(w, sid, d); if (t.id === 'edStatus') { c.status = v; c.autoOff = false; } else c.note = C.norm(v); }); return;
  }
  if (t.dataset.itrole != null) { const { sid, d } = S.sel; mutateWeek(w => { C.cellOf(w, sid, d).items[+t.dataset.itrole].role = t.value; }); return; }
  if (t.dataset.planLabel) {
    const [slot, d] = t.dataset.planLabel.split('|');
    mutateWeek(w => { w.plan[slot] = w.plan[slot] || {}; w.plan[slot][d] = Object.assign({}, C.planOf(S.cfg, w, slot, +d), { label: C.norm(t.value) }); }); return;
  }
  if (t.dataset.ts) {
    const [sid, d, f] = t.dataset.ts.split('|'); const v = t.value.trim() === '' ? '' : (parseFloat(t.value.replace(',', '.')) || 0);
    mutateWeek(w => { w.over = w.over || {}; w.over[sid] = w.over[sid] || {}; w.over[sid][d] = w.over[sid][d] || {}; w.over[sid][d][f] = v; }); return;
  }
  if (t.dataset.base) { const v = t.value.trim(); mutateWeek(w => { w.base = w.base || {}; if (v === '') delete w.base[t.dataset.base]; else w.base[t.dataset.base] = parseFloat(v.replace(',', '.')) || 0; }); return; }
  if (t.dataset.sf) {
    const [id, f] = t.dataset.sf.split('|');
    mutateCfg(c => { const s = c.staff.find(x => x.id === id); if (f === 'group') s.group = +t.value; else if (f === 'allow') s.allow = t.value.split(',').map(x => x.trim().toUpperCase()).filter(Boolean); else s[f] = f === 'name' ? C.norm(t.value) : t.value; }, { noRender: f === 'name' || f === 'note' || f === 'allow' }); return;
  }
  if (t.dataset.sfrole) { const [id, r] = t.dataset.sfrole.split('|'); mutateCfg(c => { const s = c.staff.find(x => x.id === id); const set = new Set(s.roles || []); t.checked ? set.add(r) : set.delete(r); s.roles = C.ROLE_IDS.filter(x => set.has(x)); }, { noRender: true }); return; }
  if (t.dataset.sfb) { const [id, f] = t.dataset.sfb.split('|'); mutateCfg(c => { c.staff.find(x => x.id === id)[f] = t.checked; }, { noRender: true }); return; }
  if (t.dataset.slf) {
    const [i, f] = t.dataset.slf.split('|'); const s = S.cfg.slots[+i]; let v = t.value.trim();
    if (f === 'id') {
      v = v.toUpperCase(); if (!v || S.cfg.slots.some((x, j) => j !== +i && x.id === v)) { toast('Mã slot trống hoặc bị trùng'); render(); return; }
      const old = s.id;
      mutateCfg(c => { c.slots[+i].id = v; });
      mutateWeek(w => { if (w.plan[old]) { w.plan[v] = w.plan[old]; delete w.plan[old]; } for (const sid in w.cells) for (const d in w.cells[sid]) (w.cells[sid][d].items || []).forEach(it => { if (it.slot === old) it.slot = v; }); });
      return;
    }
    mutateCfg(c => { const x = c.slots[+i]; if (['nightWeight'].includes(f)) x[f] = parseFloat(v.replace(',', '.')) || 0; else if (['before', 'after'].includes(f)) x[f] = v === '' ? null : parseInt(v, 10) || 0; else if (f === 'airline') x[f] = v.toUpperCase(); else x[f] = v; }, { noRender: true }); return;
  }
  if (t.dataset.slb) { const [i, f] = t.dataset.slb.split('|'); mutateCfg(c => { c.slots[+i][f] = t.checked; }, { noRender: true }); return; }
  if (t.dataset.sld) { const [i, r] = t.dataset.sld.split('|'); mutateCfg(c => { const v = parseInt(t.value, 10); if (v > 0) c.slots[+i].demand[r] = v; else delete c.slots[+i].demand[r]; }, { noRender: true }); return; }
  if (t.dataset.sldays) { const [i, d] = t.dataset.sldays.split('|'); mutateCfg(c => { c.slots[+i].days[+d] = t.checked ? 1 : 0; }, { noRender: true }); return; }
  if (t.dataset.cdf) { const [i, f] = t.dataset.cdf.split('|'); mutateCfg(c => { c.codes[+i][f] = f === 'off' ? (parseFloat(t.value.replace(',', '.')) || 0) : t.value; }, { noRender: true }); return; }
  if (t.dataset.rule) { const k = t.dataset.rule; mutateCfg(c => { const v = t.value; c.rules[k] = k === 'overlapOK' ? v : k === 'autoOff' ? v === 'true' : (parseFloat(String(v).replace(',', '.')) || 0); }, { noRender: true }); return; }
  if (t.dataset.grp != null) { mutateCfg(c => { c.groups[+t.dataset.grp].name = t.value; }, { noRender: true }); return; }
});
let qT;
document.addEventListener('input', e => {
  if (e.target.id === 'fq') { clearTimeout(qT); const v = e.target.value; qT = setTimeout(() => { S.filter.q = v; render(); const el = $('#fq'); if (el) { el.focus(); el.setSelectionRange(v.length, v.length); } }, 220); }
});
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && tag !== 'input' && tag !== 'textarea') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y' && tag !== 'input') { e.preventDefault(); redo(); }
  if (e.key === 'Escape') { if ($('#modalHost').innerHTML) closeModal(); else if (S.sel || S.covSel) { S.sel = null; S.covSel = null; render(); } }
});
boot();
})();

</script>
