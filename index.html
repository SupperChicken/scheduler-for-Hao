<body>
<title>Phân Ca Sân Bay</title>
<!-- Phân Ca Sân Bay · Bản quyền © 2026 ThienNV · thiennv@vnpt-technology.vn · 0888.99.33.00 -->
<meta name="author" content="ThienNV - thiennv@vnpt-technology.vn - 0888.99.33.00">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Bố cục: thanh điều khiển trên cùng + bảng lớn cuộn ngang, ngăn chỉnh sửa trượt bên phải. Màu lấy cảm hứng từ bảng chỉ dẫn sân bay: chữ xanh than, nhấn vàng tín hiệu. */
:root{
  --bg:#eef1f4; --panel:#ffffff; --panel2:#f6f8fa; --ink:#14213d; --ink2:#4a5874; --mute:#7c889e;
  --line:#d7dde6; --line2:#e7ebf0; --accent:#f2b705; --accentInk:#14213d; --accentSoft:#fff3c4;
  --night:#1f2f57; --nightInk:#e8eeff; --dayChip:#e6ecf5; --dayInk:#14213d;
  --ok:#1f8a4c; --okSoft:#e3f4ea; --warn:#b26a00; --warnSoft:#fff1d9; --err:#c62f2f; --errSoft:#fde6e4;
  --off:#8a94a6; --offSoft:#eceff3; --leave:#7a4bb8; --leaveSoft:#efe7fa; --sby:#1c6fb8; --sbySoft:#e2effb;
  --g1:#f6e3dc; --g2:#dcf0fa; --g3:#e2f3dc; --g4:#fbe9df; --g5:#fbf7d6; --g6:#d9e9f6; --g7:#ebe8f3;
  --shadow:0 8px 30px rgba(20,33,61,.14);
  --f-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1524; --panel:#161e31; --panel2:#1b2439; --ink:#e7ecf6; --ink2:#b3bdd2; --mute:#8590a8;
  --line:#2c3852; --line2:#232d44; --accent:#f2b705; --accentInk:#14213d; --accentSoft:#3a3112;
  --night:#3b5394; --nightInk:#f1f4ff; --dayChip:#25304a; --dayInk:#dfe6f5;
  --ok:#48c07a; --okSoft:#15301f; --warn:#e8a33c; --warnSoft:#33270f; --err:#ff6b62; --errSoft:#3a1a1a;
  --off:#97a1b5; --offSoft:#232b3e; --leave:#b892ef; --leaveSoft:#2b2140; --sby:#6cb2f0; --sbySoft:#15283d;
  --g1:#2f2420; --g2:#182c36; --g3:#1d2c1b; --g4:#33251c; --g5:#2f2c17; --g6:#172636; --g7:#24223a;
  --shadow:0 8px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1524; --panel:#161e31; --panel2:#1b2439; --ink:#e7ecf6; --ink2:#b3bdd2; --mute:#8590a8;
  --line:#2c3852; --line2:#232d44; --accent:#f2b705; --accentInk:#14213d; --accentSoft:#3a3112;
  --night:#3b5394; --nightInk:#f1f4ff; --dayChip:#25304a; --dayInk:#dfe6f5;
  --ok:#48c07a; --okSoft:#15301f; --warn:#e8a33c; --warnSoft:#33270f; --err:#ff6b62; --errSoft:#3a1a1a;
  --off:#97a1b5; --offSoft:#232b3e; --leave:#b892ef; --leaveSoft:#2b2140; --sby:#6cb2f0; --sbySoft:#15283d;
  --g1:#2f2420; --g2:#182c36; --g3:#1d2c1b; --g4:#33251c; --g5:#2f2c17; --g6:#172636; --g7:#24223a;
  --shadow:0 8px 30px rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
.ro .edit-only{display:none!important}
/* đăng nhập & người dùng */
.gate .cam,.gate .tabs,.gate .weeknav,.gate #bUndo,.gate #bRedo,.gate #saveSt,.gate [data-act="auto"]{display:none!important}
.userbox{display:flex;align-items:center;gap:8px;font-size:12px;flex-wrap:wrap}
.userbox .who{opacity:.85;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.userbox .online{color:#9fe0b4;font-weight:600;white-space:nowrap}
.gatebox{max-width:440px;margin:6vh auto 0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 22px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.gatebox h2{margin:0;font-size:20px}
.gatebox .btn{white-space:normal;text-align:center}
.gatebox p{margin:0}
.gatebox code{font-family:var(--f-mono);font-size:12.5px;background:var(--panel2);padding:1px 5px;border-radius:4px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px;font-weight:600}
.gl{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--panel);font-size:13px;font-weight:700}
.or{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.fl{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink2)}
.fl .inp{padding:9px 10px}
.foothead td{background:var(--accentSoft)!important;color:var(--ink)!important}
tr.foot td.cv{padding:4px 6px}
tr.foot td.cv b{font-size:13px}
tr.foot.tot td{background:var(--panel2);font-weight:600}
tr.foot.tot td.sum.hi{color:var(--err)}
td.lvc{min-width:118px}
td.lvc select{width:100%;font-weight:600}
td.lvc.k-off{background:var(--offSoft)} td.lvc.k-leave{background:var(--leaveSoft)} td.lvc.k-sby{background:var(--sbySoft)}
td.lvc.autoff select{border-style:dashed}
.copy{padding-inline:16px;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--panel);color:var(--ink2);font-size:12px;text-align:center;user-select:text}
.copy b{color:var(--ink)}

/* trình nhập dữ liệu */
.modal .box.wiz{width:min(1200px,100%);max-height:94vh;height:94vh;padding:0;display:flex;flex-direction:column}
.whead{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.whead h3{margin:0;font-size:16px}
.wbody{flex:1;overflow:auto;padding:14px 18px;display:flex;flex-direction:column;gap:10px;min-height:0}
.wbody h4{margin:4px 0 6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute)}
.wfoot{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line);padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.wgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.seg.wrap{flex-wrap:wrap}
.srcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.src{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.src span{font-size:12px;color:var(--ink2)}
.src.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--panel2)}
.drop{display:flex;flex-direction:column;gap:4px;border:2px dashed var(--line);border-radius:10px;padding:16px;cursor:pointer;background:var(--panel2)}
.drop span{font-size:12.5px;color:var(--ink2)}
.drop input{margin-top:6px;max-width:100%}
.aibox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.thumbs{display:flex;gap:10px;flex-wrap:wrap}
.th{width:160px}
.th img{width:160px;height:160px;object-fit:contain;background:var(--panel2);border:1px solid var(--line);border-radius:8px}
.pdf{width:160px;height:110px;display:grid;place-items:center;text-align:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;font-size:12px;overflow:hidden}
.revtop{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.revimgs{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;max-width:100%}
.revimgs img{height:150px;max-width:260px;object-fit:contain;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.revsum{flex:1;min-width:260px}
table.rev td{vertical-align:middle}
table.rev tr.off td{opacity:.45}
table.rev tr.wr td:last-child{background:var(--warnSoft)}
table.rev .meta{font-size:11px;color:var(--mute);max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.rev .why{font-size:11.5px;color:var(--warn)}
.spin{width:34px;height:34px;margin:0 auto 10px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin 0.9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.okc{color:var(--ok);font-weight:700}
.lockbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:9px 12px;margin-bottom:12px;border-radius:8px;background:var(--accentSoft);color:var(--ink);font-size:13px}
.wklock td.cell{cursor:default}
.issue.okk{background:var(--okSoft);color:var(--ok)}

.ro td.cell{cursor:default}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-ui);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
a{color:var(--sby)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* khung ứng dụng */
.app{display:flex;flex-direction:column;min-height:100%}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--ink);color:#fff;padding-inline:16px;padding-block:10px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
:root[data-theme="dark"] .top{background:#0a0f1c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .top{background:#0a0f1c}}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.01em;font-size:16px;white-space:nowrap}
.brand .tile{width:30px;height:30px;border-radius:6px;background:var(--accent);color:var(--accentInk);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;font-weight:600}
.weeknav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.weeknav .wk{font-weight:600;font-variant-numeric:tabular-nums;padding:0 6px;white-space:nowrap}
.tbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.18)}
.tbtn.pri{background:var(--accent);color:var(--accentInk);border-color:var(--accent);font-weight:600}
.tbtn.pri:hover{filter:brightness(1.05)}
.tbtn:disabled{opacity:.45;cursor:default}
.top select.tsel{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:6px;padding:5px 8px}
.top select.tsel option{color:#14213d}
.spacer{flex:1}
.save{font-size:12px;opacity:.85;display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#7fd19b;display:inline-block}
.dot.busy{background:var(--accent)} .dot.local{background:#9aa6bd} .dot.bad{background:#ff6b62}

.tabs{display:flex;gap:2px;padding-inline:16px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:11px 14px 9px;border-bottom:3px solid transparent;cursor:pointer;color:var(--ink2);font-weight:500;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab .badge{margin-left:6px}
.main{padding-inline:16px;padding-block:14px 40px;flex:1;min-width:0}

/* thanh công cụ trong tab */
.bar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:12px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accentInk);font-weight:600}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--panel);font-weight:600}
.btn.danger{color:var(--err);border-color:color-mix(in srgb,var(--err) 40%,var(--line))}
.btn.sm{padding:3px 8px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:default}
.inp,.sel{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 9px;min-width:0}
.inp.sm,.sel.sm{padding:3px 6px;font-size:12.5px}
.inp:focus,.sel:focus{border-color:var(--ink2);outline:none}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.muted{color:var(--mute)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:18px;padding:0 6px;border-radius:9px;font-size:11.5px;font-weight:600;background:var(--line2);color:var(--ink2);font-variant-numeric:tabular-nums}
.badge.err{background:var(--err);color:#fff} .badge.warn{background:var(--warn);color:#fff} .badge.ok{background:var(--ok);color:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:5px 10px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--panel);font-weight:600}

/* tóm tắt */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.kpi .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-weight:600}
.kpi .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.kpi .s{font-size:12px;color:var(--ink2)}
.kpi.err .v{color:var(--err)} .kpi.ok .v{color:var(--ok)} .kpi.warn .v{color:var(--warn)}

/* bảng chung */
.scroll{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);max-height:calc(100vh - 210px);min-height:240px}
table.g{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
table.g th,table.g td{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:6px 8px;vertical-align:top;text-align:left}
table.g thead th{position:sticky;top:0;z-index:3;background:var(--panel2);font-size:12px;font-weight:600;color:var(--ink2);white-space:nowrap;border-bottom:1px solid var(--line)}
table.g thead th.today{background:var(--accentSoft);color:var(--ink)}
table.g .stick{position:sticky;left:0;z-index:2;background:var(--panel)}
table.g thead .stick{z-index:4;background:var(--panel2)}
table.g tr.grp td{background:var(--panel2);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--ink2);padding:5px 10px}
table.g tr.grp td.stick{z-index:2}
.name{min-width:170px;max-width:220px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:5px solid transparent}
.gc1{border-left-color:#e3a58f!important} .gc2{border-left-color:#6cc3e8!important} .gc3{border-left-color:#8ccc7d!important}
.gc4{border-left-color:#eeaa82!important} .gc5{border-left-color:#e2d35a!important} .gc6{border-left-color:#5b9fd6!important} .gc7{border-left-color:#a597c9!important}
.name small{display:block;font-weight:400;color:var(--mute);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tagx{font-family:var(--f-mono);font-size:10.5px;padding:0 4px;border-radius:4px;background:var(--line2);color:var(--ink2);margin-left:4px;font-weight:600}

/* ô lịch */
td.cell{min-width:118px;max-width:150px;cursor:pointer;background:var(--panel);transition:background .1s}
td.cell:hover{background:var(--panel2)}
td.cell.sel{box-shadow:inset 0 0 0 2px var(--accent)}
td.cell.err{background:var(--errSoft)}
td.cell.warn{background:var(--warnSoft)}
td.cell.carry{background:var(--panel2);cursor:default;min-width:96px;opacity:.85}
.st{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;margin:0 3px 3px 0;background:var(--line2);color:var(--ink2);white-space:nowrap}
.st.k-off{background:var(--offSoft);color:var(--off);background-image:repeating-linear-gradient(135deg,transparent 0 5px,color-mix(in srgb,var(--off) 14%,transparent) 5px 7px)}
.st.k-leave{background:var(--leaveSoft);color:var(--leave)}
.st.k-sby{background:var(--sbySoft);color:var(--sby)}
.st.auto{outline:1px dashed var(--off)}
.its{display:flex;flex-wrap:wrap;gap:3px}
.chip{font-family:var(--f-mono);font-size:11.5px;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--dayChip);color:var(--dayInk);white-space:nowrap;line-height:1.5}
.chip.n{background:var(--night);color:var(--nightInk)}
.chip i{font-style:normal;opacity:.75}
.chip.bad{outline:2px solid var(--err);outline-offset:-1px}
.chip .lk{font-size:9px;margin-left:2px}
.nt{font-size:11px;color:var(--mute);margin-top:2px;max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td.sum{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2);min-width:46px}
td.sum.hi{color:var(--err);font-weight:700}

/* quân số */
td.cv{min-width:96px;cursor:pointer;text-align:center}
td.cv b{font-size:15px;font-variant-numeric:tabular-nums;display:block}
td.cv small{font-size:10.5px;color:var(--ink2);display:block;white-space:nowrap;font-family:var(--f-mono)}
td.cv.ok{background:var(--okSoft)} td.cv.ok b{color:var(--ok)}
td.cv.short{background:var(--errSoft)} td.cv.short b{color:var(--err)}
td.cv.over{background:var(--warnSoft)} td.cv.over b{color:var(--warn)}
td.cv.off{background:repeating-linear-gradient(135deg,var(--panel) 0 6px,var(--panel2) 6px 12px);color:var(--mute)}
td.cv.off b{font-size:12px;color:var(--mute)}
td.cv.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.slotname{font-family:var(--f-mono);font-weight:600}
.slotname small{display:block;font-family:var(--f-ui);font-weight:400;color:var(--mute);font-size:11px}

/* lịch bay */
td.fp{min-width:132px}
td.fp .row{display:flex;gap:6px;align-items:center}
td.fp.offd{background:repeating-linear-gradient(135deg,var(--panel) 0 6px,var(--panel2) 6px 12px)}
td.fp input.inp{width:100%;font-family:var(--f-mono);font-size:12px;padding:3px 6px}
.tog{border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:11px;font-weight:700;cursor:pointer;background:var(--okSoft);color:var(--ok);white-space:nowrap}
.tog.offb{background:var(--errSoft);color:var(--err)}
.dm{font-size:10.5px;color:var(--ink2);font-family:var(--f-mono);margin-top:3px;cursor:pointer;display:inline-block}
.dm.ovr{color:var(--warn);font-weight:700}

/* ngăn chỉnh sửa */
.drawer{position:fixed;z-index:50;top:0;right:0;bottom:0;width:min(420px,100vw);background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column}
.drawer header{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;padding-top:calc(14px + env(safe-area-inset-top,0px))}
.drawer header h3{margin:0;font-size:16px;line-height:1.3;text-wrap:balance}
.drawer header .sub{font-size:12.5px;color:var(--ink2)}
.drawer .body{overflow:auto;padding:12px 16px 24px;display:flex;flex-direction:column;gap:14px;flex:1;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.sec h4{margin:0 0 6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute)}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.li{display:flex;gap:8px;align-items:center;padding:7px 9px;border-bottom:1px solid var(--line2);min-width:0}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .why{font-size:11.5px;color:var(--err)}
.li .meta{font-size:11.5px;color:var(--mute)}
.li.dis{opacity:.62}
.li.clickable{cursor:pointer} .li.clickable:hover{background:var(--panel2)}
.issue{font-size:12.5px;padding:6px 9px;border-radius:6px;background:var(--errSoft);color:var(--err)}
.issue.warn{background:var(--warnSoft);color:var(--warn)}
.x{border:0;background:none;cursor:pointer;font-size:20px;line-height:1;color:var(--ink2);padding:2px 6px;margin-left:auto}
.scrim{position:fixed;inset:0;background:rgba(10,15,28,.35);z-index:45}

/* hộp thoại */
.modal{position:fixed;z-index:60;inset:0;display:grid;place-items:center;padding:16px;background:rgba(10,15,28,.45)}
.modal .box{background:var(--panel);border-radius:12px;box-shadow:var(--shadow);width:min(520px,100%);max-height:90vh;overflow:auto;padding:18px}
.modal h3{margin:0 0 8px;font-size:17px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.opt{display:flex;gap:10px;padding:10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;margin-top:8px}
.opt:has(input:checked){border-color:var(--ink);background:var(--panel2)}
.opt b{display:block}
.opt span{font-size:12.5px;color:var(--ink2)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:8px;z-index:70;box-shadow:var(--shadow);max-width:calc(100vw - 32px);font-size:13.5px}

/* thống kê */
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:980px){.two{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.card h3{margin:0 0 10px;font-size:14px}
.bars{display:flex;flex-direction:column;gap:3px;max-height:520px;overflow:auto}
.barrow{display:grid;grid-template-columns:120px minmax(0,1fr) 40px;gap:8px;align-items:center;font-size:12px}
.barrow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:12px;background:var(--line2);border-radius:3px;position:relative;overflow:hidden}
.track .fill{position:absolute;inset:0 auto 0 0;background:var(--night);border-radius:3px}
.track .avg{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--accent)}
.barrow .vv{text-align:right;font-variant-numeric:tabular-nums}
.issues{display:flex;flex-direction:column;gap:5px;max-height:520px;overflow:auto}
.issues .issue{cursor:pointer}

/* cài đặt */
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
table.g td input.inp,table.g td select.sel{width:100%}
td.c{text-align:center}
.help{font-size:12.5px;color:var(--ink2);max-width:72ch}
.formgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.formgrid label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink2);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.formgrid label b{color:var(--ink);font-size:13px}
.empty{padding:40px 20px;text-align:center;color:var(--ink2);background:var(--panel);border:1px dashed var(--line);border-radius:12px}
.empty h2{margin:0 0 6px;color:var(--ink);font-size:18px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--ink2);align-items:center}
.ts table.g td input.inp{width:62px;text-align:right;padding:3px 5px;font-variant-numeric:tabular-nums}
@media (max-width:640px){
  .brand span.long{display:none}
  .main{padding-block:10px 30px}
  .scroll{max-height:calc(100vh - 250px)}
  .name{min-width:120px;max-width:140px}
}
.fp .dm{display:block}.fp .dm.dly{cursor:pointer;color:var(--mute)}.fp .dm.dly.on{color:var(--err);font-weight:600}

/* ===== CORE: mô hình dữ liệu, kiểm tra luật, chia lịch tự động, nhập/xuất ===== */
const Core = (() => {
  const DAYS = ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'];
  const ROLE_DEFS = [
    { id: 'S', name: 'Supervisor (/S)' },

      { code: 'Đ', label: 'Đ', block: 'none', off: 0, kind: 'duty' }
    ];
  }
  // Slot mặc định suy ra từ file LỊCH 5-11OCT26 (định mức = số người thực tế được xếp)
  function defaultSlots() {
    const S = (id, airline, flight, time, route, demand, o = {}) => Object.assign({
      id, airline, flight, time, route, demand, night: false, nightWeight: 0,
      days: [1, 1, 1, 1, 1, 1, 1], dayLabels: {}, before: null, after: null, active: true, note: ''
    }, o);
    return [
      S('TW1', 'TW', 'TW008', '1145', 'ICN', { S: 1, A: 4 }),
      S('TW3', 'TW', 'TW26', '0050', 'CJJ', {}, { active: false, days: [1, 0, 0, 0, 1, 0, 0], note: 'Chưa có định mức trong file' }),
      S('TW4', 'TW', 'TW14', '0125', 'ICN', {}, { active: false, note: 'Chưa có định mức trong file' }),
      S('TW5', 'TW', 'TW30', '0130', 'TAE', {}, { active: false, note: 'Chưa có định mức trong file' }),
      S('LJ2', 'LJ', '', '0000', '', {}, { active: false, night: true, nightWeight: 3 }),
      S('LJ3', 'LJ', 'LJ082', '0015', 'ICN', { S: 1, GC: 1, A: 3 }, { night: true, nightWeight: 2.5 }),
      S('LJ4', 'LJ', 'LJ112', '0100', 'PUS', { S: 1, GC: 1, A: 3 }, { night: true, nightWeight: 3 }),
      S('AK1', 'AK', 'AK643', '1120', '', { S: 1, G: 1, A: 2 }, { days: [1, 1, 1, 1, 0, 1, 0] }),
      S('AK2', 'AK', 'AK649', '1220', '', { S: 1, G: 1, A: 2 }),
      S('AK3', 'AK', 'AK641', '1605', '', { S: 1, G: 1, A: 2 }),
      S('Z2', 'Z2', 'Z2823', '0855', '', { S: 1, G: 1, A: 2 }, { dayLabels: { 1: 'Z2827 1100', 3: 'Z2827 1100', 5: 'Z2827 1100' } }),
      S('RS', 'RS', 'RS512', '0040', '', { S: 1, A: 4 }, { night: true, nightWeight: 3 }),
      S('VZ1', 'VZ', 'VZ965', '1040', '', { S: 1, A: 3 }),
      S('VZ2', 'VZ', 'VZ961', '1315', '', { S: 1, A: 3 }),
      S('VZ3', 'VZ', 'VZ963', '1810', '', { A: 2 }, { note: 'VJQT' }),
      S('FD1', 'FD', 'FD635', '1005', '', { S: 1, G: 1, A: 2 }),
      S('FD3', 'FD', 'FD637', '1200', '', { S: 1, G: 1, A: 2 }),
      S('FD4', 'FD', 'FD639', '1810', '', { S: 1, G: 1, A: 2 }),
      S('OD', 'OD', 'OD503', '1250', '', { S: 1, A: 4 }, { days: [0, 1, 1, 1, 1, 1, 0] }),
      S('BX1', 'BX', 'BX774', '0045', '', { A: 3 }, { night: true, nightWeight: 3, note: 'Chỉ chuyến BX774' }),
      S('BX1-2', 'BX', 'BX774+BX7325', '0210', '', { S: 1, A: 3 }, { night: true, nightWeight: 4.5, before: 240, note: 'Làm cả BX774 và BX7325 (file cũ tính 3 + 1.5 giờ)' }),
      S('HX0', 'HX', 'HX543', '0400', '', { S: 1, C: 1, A: 3 }, { night: true, nightWeight: 4, overnight: false, days: [1, 1, 1, 0, 0, 0, 0], note: 'Chuyến 04:00 sáng sớm của chính ngày đó' }),
      S('HX1', 'HX', 'HX549', '1620', '', { S: 1, C: 1, A: 4 }),
      S('HX2', 'HX', 'HX547', '2050', '', { S: 1, C: 1, A: 4 }, { days: [1, 1, 1, 0, 0, 0, 0], note: 'A321' }),
      S('MH', 'MH', 'MH749', '1435', '', { S: 1, C: 1, A: 3 }, { days: [1, 0, 1, 1, 1, 1, 1], dayLabels: { 1: 'MH747 1125', 3: 'MH747 1125', 5: 'MH747 1125' } }),
      S('MH2', 'MH', 'MH8781', '1755', 'BKI', { S: 1, C: 1, A: 2 }, { days: [0, 0, 0, 1, 0, 0, 0] }),
      S('EK', 'EK', 'EK371', '2330', '', { S: 1, C: 1, G: 1, A: 7 }, { night: true, nightWeight: 2, days: [1, 0, 1, 0, 1, 0, 1] }),
      S('G1', 'G', 'Nhóm G1', '0200', '', {}, { active: false, night: true, nightWeight: 2 }),
      S('G2', 'G', 'Nhóm G2', '0200', '', { SE: 1, A: 7 }, { night: true, nightWeight: 3, days: [1, 0, 0, 0, 1, 0, 0] }),
      S('G3', 'G', 'Nhóm G3', '0200', '', { S: 1, SE: 1, A: 6 }, { night: true, nightWeight: 3.5 })
    ];
  }
  function emptyConfig() {
    return { version: 1, staff: [], slots: defaultSlots(), codes: defaultCodes(), rules: defaultRules(), groups: clone(GROUPS) };
  }
  function newStaff(name, o = {}) {
    return Object.assign({ id: 's' + uid(), name: norm(name), group: 3, roles: [], tags: [], noNight: false,
      allow: [], auto: true, active: true, kind: 'flight', note: '' }, o);
  }

  /* ---------- tuần ---------- */
  function mondayOf(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd);
    return isoDate(d);
  }
  function isoDate(d) { const p = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); }
  function addDays(iso, n) { const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return isoDate(d); }
  function dayLabel(start, d) { const x = new Date(addDays(start, d) + 'T00:00:00'); return DAYS[d] + ' ' + String(x.getDate()).padStart(2, '0') + '/' + String(x.getMonth() + 1).padStart(2, '0'); }

  function newWeek(cfg, start, prev) {
    const w = { start, plan: {}, cells: {}, carry: {}, prevNights: {}, over: {}, base: {}, notes: '' };
    for (const s of cfg.slots) {
      w.plan[s.id] = {};
      for (let d = 0; d < 7; d++) {
        const pp = prev && prev.plan && prev.plan[s.id] && prev.plan[s.id][d];
        w.plan[s.id][d] = pp ? { on: pp.on, label: pp.label, demand: pp.demand ? clone(pp.demand) : undefined }
          : { on: !!(s.active && s.days[d]), label: s.dayLabels[d] || (s.flight + ' ' + s.time + (s.route ? ' ' + s.route : '')).trim() };
      }
    }
    if (prev) {
      const st = stats(cfg, prev);
      for (const sf of cfg.staff) {
        const c = prev.cells[sf.id] && prev.cells[sf.id][6];
        if (c) w.carry[sf.id] = { status: c.status || '', note: c.note || '', items: (c.items || []).map(i => ({ slot: i.slot, role: i.role })) };
        w.prevNights[sf.id] = st.per[sf.id] ? st.per[sf.id].nights : 0;
      }
    }
    return w;
  }
  function fmtTime(t) { t = String(t || '').padStart(4, '0'); return t.slice(0, 2) + ':' + t.slice(2); }

  /* ---------- truy vấn ---------- */
  const slotMap = cfg => { const m = {}; cfg.slots.forEach(s => m[s.id] = s); return m; };
  const codeMap = cfg => { const m = {}; cfg.codes.forEach(c => m[key(c.code)] = c); return m; };
  function planOf(cfg, week, slotId, d) {
    const p = week.plan[slotId] && week.plan[slotId][d];
    const s = cfg.slots.find(x => x.id === slotId);
    if (!s) return { on: false, label: '', demand: {} };
    if (!p) return { on: !!(s.active && s.days[d]), label: s.dayLabels[d] || s.flight, demand: s.demand };
    return { on: !!p.on, label: p.label || '', demand: p.demand || s.demand };
  }
  function timeOfLabel(label, fallback) { const m = String(label || '').match(/\b(\d{4})\b/); return m ? m[1] : fallback; }
  // khung giờ làm (phút tính từ 00:00 thứ Hai). Chuyến trước giờ nightCutoff thuộc đêm của ngày đó.

      for (const sf of order) for (let d = 0; d < 7; d++) {
        const c = cellOf(week, sf.id, d); if (!c || !(c.items || []).length) continue;
        for (const it of c.items.slice().sort((a, b) => (a.lock ? 1 : 0) - (b.lock ? 1 : 0) || (b.auto ? 1 : 0) - (a.auto ? 1 : 0))) {
          if (it.lock) continue;

      for (const sf of allStaff) for (let d = 0; d < 7; d++) if (isOffLike(cellOf(week, sf.id, d))) offCount[d]++;

      const order = flightStaff.slice().sort(() => rand() - 0.5);
      for (const sf of order) {
        let offs = 0;
        for (let d = 0; d < 7; d++) { const c = cellOf(week, sf.id, d); const code = statusCode(cfg, cm, c); if (code && code.kind === 'off') offs += +code.off || 0; if (code && code.kind === 'leave') offs += 1; }
        if (offs >= r.minOffPerWeek) continue;

      const candsFor = p => {
        const k = p.slot.id + '|' + p.role;
        if (!candCache[k]) candCache[k] = flightStaff.filter(sf => checkAssign(ctx, sf, p.slot.id, d, p.role).length === 0);

      while (positions.length) {

        }

  /* ---------- nâng cấp cấu hình (một lần) ---------- */

  /* ---------- xử lý chuyến delay ---------- */
  // Người làm chuyến delay (ngày d) mà ca hôm sau (d+1) thiếu giờ nghỉ: đổi ca với người không bị delay có ca trễ hơn.

    const ctx = makeCtx(cfg, week);
    for (const sf of cfg.staff) {
      const c = cellOf(week, sf.id, d); if (!c || !(c.items || []).some(i => hit(i.slot))) continue;

        const why = checkAssign(ctx, sf, it.slot, d + 1, it.role || 'A', { ignore: { d: d + 1, slot: it.slot }, tag: it.tag });
        if (why.some(m => /nghỉ <|Trùng giờ/i.test(m))) bad.push(it.slot);
      }

  /* ---------- đọc file Excel (dạng bảng giá trị) ---------- */
  // aoa: mảng các dòng (giá trị đã tính); fills: hàm (r,c) -> mã màu ARGB hoặc null
  const FLIGHT_RE = /^(TW\d|LJ\d|AK\d|Z2|RS|VZ\d|FD\d|OD|BX1-2|BX\d|HX\d|MH\d?|EK|G\d|LJ3-4)(?:\s*\/\s*([A-Z0-9 ]+))?$/;
  function parseToken(tok, cfg, cm) {
    let t = norm(tok); if (!t) return null;
    let up = t.toUpperCase().replace(/^Z 2/, 'Z2').replace(/^M H/, 'MH');
    const code = cm[key(t)];
    if (code) return { type: 'status', code: code.code };
    const m = up.replace(/\s+(?=\/)/g, '').match(FLIGHT_RE);
    if (m) {

  function parseRosterAOA(aoa, fills, cfgIn) {

    off: '6B7486', offSoft: 'ECEFF3', leave: '7A4BB8', leaveSoft: 'EFE7FA', sby: '1C6FB8', sbySoft: 'E2EFFB', duty: '4A5874', dutySoft: 'F1F3F7',
    g: { 1: 'F6E3DC', 2: 'DCF0FA', 3: 'E2F3DC', 4: 'FBE9DF', 5: 'FBF7D6', 6: 'D9E9F6', 7: 'EBE8F3' }
  };
  const S = {
    title: { b: true, sz: 14, color: 'FFFFFF', fill: K.ink, v: 'center', wrap: false },
    sub: { i: true, color: K.ink2, fill: K.panel2, wrap: false },
    hdr: { b: true, color: 'FFFFFF', fill: K.ink, h: 'center', v: 'center' },
    hdrToday: { b: true, color: K.ink, fill: K.accent, h: 'center', v: 'center' },
    hdr2: { b: true, sz: 9, color: K.ink2, fill: K.line2, h: 'center' },
    grp: { b: true, color: K.ink2, fill: K.panel2, wrap: false },
    foothead: { b: true, color: K.ink, fill: K.accentSoft, wrap: false },
    name: g => ({ b: true, fill: K.g[g] || K.g[3] }),
    plain: {}, num: { h: 'right' }, numBad: { h: 'right', b: true, color: K.err },
    st: { off: { b: true, color: K.off, fill: K.offSoft }, leave: { b: true, color: K.leave, fill: K.leaveSoft }, sby: { b: true, color: K.sby, fill: K.sbySoft }, duty: { b: true, color: K.duty, fill: K.dutySoft }, '': { b: true, color: K.duty, fill: K.dutySoft } },
    fDay: { b: true, mono: true, color: K.ink, fill: K.day }, fNight: { b: true, mono: true, color: K.nightInk, fill: K.night },
    cOk: { b: true, h: 'center', color: K.ok, fill: K.okSoft }, cShort: { b: true, h: 'center', color: K.err, fill: K.errSoft }, cOver: { b: true, h: 'center', color: K.warn, fill: K.warnSoft }, cOff: { h: 'center', color: K.mute, fill: K.offSoft },
    bay: { b: true, color: K.ok, fill: K.okSoft }, canx: { b: true, color: K.err, fill: K.errSoft },
    copy: { i: true, sz: 9, color: K.mute, border: false, wrap: false }
  };
  const withErr = s => Object.assign({}, s, { err: true });

  /* ===== Dựng toàn bộ file từ dữ liệu tuần ===== */
  function exportWeek(cfg, week, opt) {
    const C = Core, DAYS = C.DAYS; opt = opt || {};
    const val = C.validate(cfg, week), per = C.stats(cfg, week).per, cov = val.cov, cm = C.codeMap(cfg), sm = C.slotMap(cfg);
    const today = opt.todayIdx == null ? -1 : opt.todayIdx;
    const wname = C.dayLabel(week.start, 0).slice(3) + ' – ' + C.dayLabel(week.start, 6).slice(3) + '/' + week.start.slice(0, 4);
    const copyTxt = 'Tạo bằng Phân Ca Sân Bay · Bản quyền ' + (opt.copyright || '');
    const codeK = c => { const k = c && c.status ? cm[C.key(c.status)] : null; return k ? k.kind : ''; };
    const itemsTxt = c => (c && c.items || []).map(i => i.slot + (i.role ? '/' + i.role : '') + (i.tag && i.tag !== 'LJ3-4' ? '/' + i.tag : '')).join(' + ');
    const hasNight = c => (c && c.items || []).some(i => sm[i.slot] && sm[i.slot].night);
    const sheets = [];

    /* --- 1. Lịch tuần --- */
    {
      const rows = [], merges = [], NC = 2 + 14 + 4;
      rows.push([{ v: 'LỊCH PHÂN CA TUẦN ' + wname, s: S.title }, ...Array(NC - 1).fill({ v: '', s: S.title })]); merges.push([0, 0, 0, NC - 1]);
      rows.push([{ v: 'Màu: xám = OFF · tím = phép/ốm/TS · xanh nhạt = standby · ô xanh than = có chuyến đêm · ô xanh nhạt = chuyến ngày · viền đỏ = vi phạm luật', s: S.sub }, ...Array(NC - 1).fill({ v: '', s: S.sub })]); merges.push([1, 0, 1, NC - 1]);
      const h = [{ v: 'Nhân viên', s: S.hdr }, { v: 'CN trước', s: S.hdr }];
      for (let d = 0; d < 7; d++) { h.push({ v: C.dayLabel(week.start, d), s: d === today ? S.hdrToday : S.hdr }, { v: '', s: d === today ? S.hdrToday : S.hdr }); merges.push([2, 2 + 2 * d, 2, 3 + 2 * d]); }
      h.push({ v: 'Ca', s: S.hdr }, { v: 'Đêm', s: S.hdr }, { v: 'Giờ đêm', s: S.hdr }, { v: 'OFF', s: S.hdr });
      rows.push(h);
      const h2 = [{ v: '', s: S.hdr2 }, { v: '', s: S.hdr2 }]; for (let d = 0; d < 7; d++) h2.push({ v: 'Trạng thái', s: S.hdr2 }, { v: 'Chuyến', s: S.hdr2 }); for (let i = 0; i < 4; i++) h2.push({ v: '', s: S.hdr2 });
      rows.push(h2);
      for (const g of cfg.groups) {
        const list = cfg.staff.filter(s => s.group === g.id); if (!list.length) continue;
        rows.push([{ v: g.name.toUpperCase() + ' · ' + list.length, s: S.grp }, ...Array(NC - 1).fill({ v: '', s: S.grp })]); merges.push([rows.length - 1, 0, rows.length - 1, NC - 1]);
        for (const sf of list) {
          const p = per[sf.id] || {}; const carry = week.carry && week.carry[sf.id];
          const r = [{ v: sf.name + (sf.tags && sf.tags.length ? ' ' + sf.tags.join(' ') : ''), s: S.name(sf.group) },
            { v: carry ? [carry.status, itemsTxt(carry)].filter(Boolean).join(' · ') : '', s: carry && hasNight(carry) ? S.fNight : carry && (carry.items || []).length ? S.fDay : S.plain }];
          for (let d = 0; d < 7; d++) {
            const c = C.cellOf(week, sf.id, d); const iss = val.cellIssues[sf.id + '|' + d]; const bad = iss && iss.some(x => x.level === 'err');
            const stTxt = c ? [c.status, c.note].filter(Boolean).join(' ') : '';
            let s1 = c && c.status ? S.st[codeK(c)] || S.st[''] : S.plain;
            let s2 = c && (c.items || []).length ? (hasNight(c) ? S.fNight : S.fDay) : S.plain;
            if (bad) { s1 = withErr(s1); s2 = withErr(s2); }
            r.push({ v: stTxt, s: s1 }, { v: itemsTxt(c), s: s2 });
          }
          r.push({ v: p.slots || '', s: S.num }, { v: p.nights || '', s: p.nights > cfg.rules.maxNightsPerWeek ? S.numBad : S.num }, { v: p.nightHours || '', s: S.num }, { v: p.off || '', s: (p.off || 0) < cfg.rules.minOffPerWeek && sf.kind === 'flight' && sf.active ? S.numBad : S.num });
          rows.push(r);
        }
      }
      // bảng đếm quân số cuối bảng
      rows.push([]);
      rows.push([{ v: 'ĐẾM QUÂN SỐ THEO CHUYẾN · đã xếp / cần', s: S.foothead }, ...Array(NC - 1).fill({ v: '', s: S.foothead })]); merges.push([rows.length - 1, 0, rows.length - 1, NC - 1]);
      const shortDay = [0, 0, 0, 0, 0, 0, 0];
      for (const s of cfg.slots) {
        const row = cov[s.id]; let any = false, wShort = 0;
        for (let d = 0; d < 7; d++) { if ((row[d].on && row[d].needT) || row[d].haveT) any = true; if (row[d].on) { wShort += row[d].short; shortDay[d] += row[d].short; } }
        if (!any) continue;
        const r = [{ v: s.id + ' · ' + s.flight + ' ' + C.fmtTime(s.time), s: { b: true, mono: true, fill: K.panel2 } }, { v: '', s: S.plain }];
        for (let d = 0; d < 7; d++) {
          const x = row[d]; const miss = ['S', 'C', 'G', 'GC', 'SE'].filter(q => +x.need[q] && (x.have[q] || 0) < +x.need[q]).map(q => 'thiếu /' + q).join(' ');
          const v = x.on ? x.haveT + '/' + x.needT + (miss ? ' ' + miss : '') : (x.haveT ? 'CANX · ' + x.haveT : '—');
          const st = !x.on ? (x.haveT ? S.cOver : S.cOff) : x.short ? S.cShort : x.over ? S.cOver : S.cOk;
          r.push({ v, s: st }, { v: '', s: st }); merges.push([rows.length, 2 + 2 * d, rows.length, 3 + 2 * d]);
        }
        r.push({ v: wShort ? 'thiếu ' + wShort : '✓', s: wShort ? S.cShort : S.cOk }, { v: '', s: wShort ? S.cShort : S.cOk }, { v: '', s: wShort ? S.cShort : S.cOk }, { v: '', s: wShort ? S.cShort : S.cOk }); merges.push([rows.length, 16, rows.length, 19]);
        rows.push(r);
      }
      const cnt = f => [0, 1, 2, 3, 4, 5, 6].map(d => cfg.staff.reduce((a, sf) => a + f(C.cellOf(week, sf.id, d)), 0));
      const tot = [['Tổng vị trí còn thiếu', shortDay, true], ['Số người đi làm', cnt(c => c && (c.items || []).length ? 1 : 0)], ['OFF', cnt(c => { const k = c && c.status ? cm[C.key(c.status)] : null; return k && k.kind === 'off' ? (+k.off || 0) : 0; })],
        ['Phép / ốm / thai sản', cnt(c => codeK(c) === 'leave' ? 1 : 0)], ['Standby (SBY)', cnt(c => codeK(c) === 'sby' ? 1 : 0)]];
      for (const [label, arr, red] of tot) {
        const r = [{ v: label, s: { b: true, fill: K.line2 } }, { v: '', s: { fill: K.line2 } }];
        arr.forEach((v, d) => { const st = red ? (v ? S.cShort : S.cOk) : { b: true, h: 'center', fill: K.line2 }; r.push({ v: v, s: st }, { v: '', s: st }); merges.push([rows.length, 2 + 2 * d, rows.length, 3 + 2 * d]); });
        rows.push(r);
      }
      rows.push([]); rows.push([{ v: copyTxt, s: S.copy }]);
      sheets.push({ name: 'Lịch tuần', rows, merges, cols: [24, 13, ...Array(14).fill(0).map((_, i) => i % 2 ? 15 : 11), 6, 6, 8, 6], freeze: { r: 4, c: 1 }, heights: { 0: 24 }, tab: K.ink, footer: copyTxt });
    }

    /* --- 2. Quân số --- */
    {
      const rows = [], merges = [];
      rows.push([{ v: 'QUÂN SỐ THEO CHUYẾN · tuần ' + wname, s: S.title }, ...Array(9).fill({ v: '', s: S.title })]); merges.push([0, 0, 0, 9]);
      rows.push([{ v: 'Slot', s: S.hdr }, { v: 'Chuyến', s: S.hdr }, ...DAYS.map((x, d) => ({ v: C.dayLabel(week.start, d), s: d === today ? S.hdrToday : S.hdr })), { v: 'Tuần', s: S.hdr }]);
      for (const s of cfg.slots) {
        const row = cov[s.id]; let any = false, wn = 0, wh = 0;
        for (let d = 0; d < 7; d++) { if ((row[d].on && row[d].needT) || row[d].haveT) any = true; wn += row[d].on ? row[d].needT : 0; wh += row[d].haveT; }
        if (!any) continue;
        const r = [{ v: s.id, s: { b: true, mono: true, fill: s.night ? K.day : K.panel2 } }, { v: s.flight + ' · ' + C.fmtTime(s.time) + (s.night ? ' · đêm' : ''), s: S.plain }];
        for (let d = 0; d < 7; d++) {
          const x = row[d]; const parts = ['S', 'C', 'G', 'GC', 'SE'].filter(q => (+x.need[q] || 0) || x.have[q]).map(q => q + ' ' + (x.have[q] || 0) + '/' + (+x.need[q] || 0)).join(' · ');
          r.push({ v: x.on ? x.haveT + '/' + x.needT + (parts ? '\n' + parts : '') : (x.haveT ? 'CANX · ' + x.haveT : 'Không bay'), s: !x.on ? (x.haveT ? S.cOver : S.cOff) : x.short ? S.cShort : x.over ? S.cOver : S.cOk });
        }
        r.push({ v: wh + '/' + wn, s: wh < wn ? S.cShort : S.cOk });
        rows.push(r);
      }
      rows.push([]); rows.push([{ v: copyTxt, s: S.copy }]);
      sheets.push({ name: 'Quân số', rows, merges, cols: [9, 20, 14, 14, 14, 14, 14, 14, 14, 10], freeze: { r: 2, c: 2 }, heights: { 0: 24 }, tab: K.ok, footer: copyTxt });
    }

    /* --- 3. Lịch bay --- */
    {
      const rows = [], merges = [];
      rows.push([{ v: 'LỊCH BAY · tuần ' + wname, s: S.title }, ...Array(7).fill({ v: '', s: S.title })]); merges.push([0, 0, 0, 7]);
      rows.push([{ v: 'Slot', s: S.hdr }, ...DAYS.map((x, d) => ({ v: C.dayLabel(week.start, d), s: d === today ? S.hdrToday : S.hdr }))]);
      for (const s of cfg.slots) {
        const ps = DAYS.map((x, d) => C.planOf(cfg, week, s.id, d));
        if (!ps.some(p => p.on || p.label)) continue;
        rows.push([{ v: s.id, s: { b: true, mono: true, fill: s.night ? K.day : K.panel2 } }, ...ps.map(p => ({ v: (p.label || '') + (p.on ? '' : ' · CANX'), s: p.on ? S.bay : S.canx }))]);
      }
      rows.push([]); rows.push([{ v: copyTxt, s: S.copy }]);
      sheets.push({ name: 'Lịch bay', rows, merges, cols: [9, 18, 18, 18, 18, 18, 18, 18], freeze: { r: 2, c: 1 }, heights: { 0: 24 }, tab: K.accent, footer: copyTxt });
    }

    /* --- 4. Order nghỉ --- */
    {
      const rows = [], merges = [];
      rows.push([{ v: 'ORDER NGHỈ / TRẠNG THÁI · tuần ' + wname, s: S.title }, ...Array(8).fill({ v: '', s: S.title })]); merges.push([0, 0, 0, 8]);
      rows.push([{ v: 'Nhân viên', s: S.hdr }, ...DAYS.map((x, d) => ({ v: C.dayLabel(week.start, d), s: d === today ? S.hdrToday : S.hdr })), { v: 'Tổng OFF', s: S.hdr }]);
      for (const g of cfg.groups) {
        const list = cfg.staff.filter(s => s.group === g.id); if (!list.length) continue;
        rows.push([{ v: g.name.toUpperCase(), s: S.grp }, ...Array(8).fill({ v: '', s: S.grp })]); merges.push([rows.length - 1, 0, rows.length - 1, 8]);
        for (const sf of list) {
          const r = [{ v: sf.name, s: S.name(sf.group) }]; let off = 0;
          for (let d = 0; d < 7; d++) { const c = C.cellOf(week, sf.id, d); const k = c && c.status ? cm[C.key(c.status)] : null; if (k && k.kind === 'off') off += +k.off || 0; r.push({ v: c ? [c.status, c.note].filter(Boolean).join(' ') : '', s: c && c.status ? S.st[codeK(c)] || S.st[''] : S.plain }); }
          r.push({ v: off, s: off < cfg.rules.minOffPerWeek && sf.kind === 'flight' && sf.active ? S.numBad : S.num });
          rows.push(r);
        }
      }
      rows.push([]); rows.push([{ v: copyTxt, s: S.copy }]);
      sheets.push({ name: 'Order nghỉ', rows, merges, cols: [24, 15, 15, 15, 15, 15, 15, 15, 9], freeze: { r: 2, c: 1 }, heights: { 0: 24 }, tab: K.leave, footer: copyTxt });
    }

    /* --- 5. Thống kê --- */
    {
      const airlines = [...new Set(cfg.slots.filter(s => s.active).map(s => s.airline))];
      const rows = [], merges = []; const NC = 9 + airlines.length;
      rows.push([{ v: 'THỐNG KÊ CÔNG BẰNG · tuần ' + wname, s: S.title }, ...Array(NC - 1).fill({ v: '', s: S.title })]); merges.push([0, 0, 0, NC - 1]);
      rows.push(['Nhân viên', 'Slot', 'Đêm', 'Đêm tuần trước', 'Giờ công đêm', 'Ngày làm', 'OFF', 'Phép/ốm', 'SBY', ...airlines].map(v => ({ v, s: S.hdr })));
      const fl = cfg.staff.filter(s => s.kind === 'flight');
      const maxNH = Math.max(1, ...fl.map(s => per[s.id].nightHours || 0));
      for (const sf of fl) {
        const p = per[sf.id]; const t = (p.nightHours || 0) / maxNH;
        const heat = t > 0.85 ? 'F6C9C4' : t > 0.6 ? 'FBE3C4' : t > 0.3 ? 'E9F2D9' : 'F4F6F8';
        rows.push([{ v: sf.name, s: S.name(sf.group) }, { v: p.slots, s: S.num }, { v: p.nights, s: p.nights > cfg.rules.maxNightsPerWeek ? S.numBad : S.num }, { v: p.prevNights, s: S.num }, { v: p.nightHours, s: { h: 'right', b: true, fill: heat } }, { v: p.workDays, s: S.num }, { v: p.off, s: S.num }, { v: p.leave, s: S.num }, { v: p.sby, s: S.num }, ...airlines.map(a => ({ v: p.byAirline[a] || '', s: S.num }))]);
      }
      rows.push([]); rows.push([{ v: 'Ô "Giờ công đêm" càng đỏ là càng nhiều giờ đêm so với người khác.', s: S.copy }]); rows.push([{ v: copyTxt, s: S.copy }]);
      sheets.push({ name: 'Thống kê', rows, merges, cols: [24, 7, 7, 10, 10, 9, 7, 9, 7, ...airlines.map(() => 6)], freeze: { r: 2, c: 1 }, heights: { 0: 24 }, tab: K.sby, footer: copyTxt });
    }

    /* --- 6. Chấm công --- */
    {
      const ts = C.timesheet(cfg, week); const rows = [], merges = [];
      const hd = ['Nhân viên']; for (let d = 0; d < 7; d++) hd.push(C.dayLabel(week.start, d), '', '', '');
      hd.push('Tổng OVER ngày (phút)', 'Tổng OVER đêm', 'Tổng BÙ ngày', 'Tổng BÙ đêm', 'Giờ công', 'Giờ công thực tế', 'Giờ đêm theo ca', 'Giờ công đêm thực tế');
      const NC = hd.length;
      rows.push([{ v: 'CHẤM CÔNG OVER / BÙ · tuần ' + wname, s: S.title }, ...Array(NC - 1).fill({ v: '', s: S.title })]); merges.push([0, 0, 0, NC - 1]);
      rows.push(hd.map(v => ({ v, s: S.hdr }))); for (let d = 0; d < 7; d++) merges.push([1, 1 + 4 * d, 1, 4 + 4 * d]);
      const h2 = [{ v: '', s: S.hdr2 }]; for (let d = 0; d < 7; d++) h2.push(...['OVER N', 'OVER Đ', 'BÙ N', 'BÙ Đ'].map(v => ({ v, s: S.hdr2 }))); for (let i = 0; i < 8; i++) h2.push({ v: '', s: S.hdr2 });
      rows.push(h2);
      for (const sf of cfg.staff.filter(s => s.kind === 'flight' && s.active)) {
        const o = (week.over && week.over[sf.id]) || {}; const t = ts[sf.id];
        const r = [{ v: sf.name, s: S.name(sf.group) }];
        for (let d = 0; d < 7; d++) { const x = o[d] || {}; r.push(...['on', 'od', 'bn', 'bd'].map(k => ({ v: x[k] === '' || x[k] == null ? '' : +x[k], s: x[k] ? { h: 'right', fill: k[0] === 'o' ? K.warnSoft : K.sbySoft } : S.num }))); }

        r.push({ v: t.on, s: S.num }, { v: t.od, s: S.num }, { v: t.bn, s: S.num }, { v: t.bd, s: S.num }, { v: t.base, s: S.num }, { v: rd(t.total), s: { h: 'right', b: true, fill: K.okSoft } }, { v: t.nightHours, s: S.num }, { v: rd(t.nightTotal), s: { h: 'right', b: true, fill: K.day } });
        rows.push(r);
      }
      rows.push([]); rows.push([{ v: copyTxt, s: S.copy }]);
      sheets.push({ name: 'Chấm công', rows, merges, cols: [24, ...Array(28).fill(6.5), 11, 11, 11, 11, 9, 11, 11, 12], freeze: { r: 3, c: 1 }, heights: { 0: 24 }, tab: K.warn, footer: copyTxt });
    }

    /* --- 7. Cảnh báo --- */
    {
      const rows = [], merges = [];
      rows.push([{ v: 'CẢNH BÁO VÀ VI PHẠM · tuần ' + wname, s: S.title }, ...Array(3).fill({ v: '', s: S.title })]); merges.push([0, 0, 0, 3]);
      rows.push(['Mức', 'Nhân viên', 'Ngày', 'Nội dung'].map(v => ({ v, s: S.hdr })));
      const lst = val.list.slice().sort((a, b) => (a.level === 'err' ? 0 : 1) - (b.level === 'err' ? 0 : 1));
      if (!lst.length) rows.push([{ v: 'OK', s: S.cOk }, { v: 'Không có vấn đề nào', s: S.plain }, '', '']);
      for (const x of lst) { const st = x.level === 'err' ? { b: true, color: K.err, fill: K.errSoft } : { b: true, color: K.warn, fill: K.warnSoft }; const sf = x.sid ? cfg.staff.find(s => s.id === x.sid) : null; rows.push([{ v: x.level === 'err' ? 'Lỗi' : 'Cảnh báo', s: st }, { v: sf ? sf.name : '', s: S.plain }, { v: x.d >= 0 ? DAYS[x.d] : '', s: S.plain }, { v: x.msg, s: S.plain }]); }
      rows.push([]); rows.push([{ v: copyTxt, s: S.copy }]);
      sheets.push({ name: 'Cảnh báo', rows, merges, cols: [10, 24, 7, 80], freeze: { r: 2, c: 0 }, heights: { 0: 24 }, tab: K.err, landscape: false, footer: copyTxt });
    }
    return build(sheets, { title: 'Lịch phân ca ' + wname, author: opt.author || '', company: opt.company || '', comments: copyTxt });
  }
  return { build, exportWeek, zip };
})();

(() => {

async function resolveRole() {
  const me = lc(FBX.user.email);
  const ref = FBX.fs.doc('access/members');
  let s;
  try { s = await ref.get(); }
  catch (e) {
    if (!(e && e.code === 'permission-denied')) throw e;
    // không đọc được danh sách: thử đọc lịch — đọc được nghĩa là người xem
    try { await FBX.fs.doc('config/main').get(); FBX.members = null; return 'viewer'; }
    catch (e2) { if (e2 && e2.code === 'permission-denied') return null; throw e2; }
  }
  const m = s.exists ? s.data() : {};
  const editors = (m.editors || []).map(lc), viewers = (m.viewers || []).map(lc);
  FBX.members = { editors, viewers };
  if (editors.includes(me)) return 'editor';
  if (viewers.includes(me)) return 'viewer';
  // đọc được nhưng không có tên: đây là chủ dự án (khai báo trong firestore.rules) → tự thêm vào người làm lịch
  editors.push(me);
  await ref.set({ editors, viewers, updatedAt: new Date().toISOString() }, { merge: true });
  return 'editor';
}
async function authGate() {

  try { FBX.auth.languageCode = 'vi'; } catch (e) {}

  return new Promise(resolve => {
    let done = false;
    FBX.auth.onAuthStateChanged(async u => {
      FBX.user = u;
      if (done) { if (!u) location.reload(); return; }

      FBX.role = role; S.ro = role !== 'editor'; S.gate = null; S.authErr = ''; S.authInfo = '';

}

function migrateCfg(cfg) {

      const p = C.planOf(S.cfg, w, s.id, d);

      const dm = demandText(p.demand);
      h += '<td class="fp' + (p.on ? '' : ' offd') + '"><div class="row"><button class="tog' + (p.on ? '' : ' offb') + '" data-act="plan-tog" data-slot="' + s.id + '" data-d="' + d + '">' + (p.on ? 'BAY' : 'CANX') + '</button>' +
        '<input class="inp" data-plan-label="' + s.id + '|' + d + '" value="' + esc(p.label) + '" aria-label="Chuyến ' + s.id + ' ' + DAYS[d] + '"></div>' +
        '<span class="dm' + (ovr ? ' ovr' : '') + '" data-act="plan-dem" data-slot="' + s.id + '" data-d="' + d + '" title="Sửa định mức ngày này">định mức: ' + esc(dm || '0') + (ovr ? ' (riêng)' : '') + '</span>' +
        (p.on && (s.covers || s.start) ? '<span class="dm">ca ' + C.shiftText(S.cfg, w, s, d) + '</span>' : '') +
        (p.on && !s.covers ? '<span class="dm dly' + (raw && +raw.delay ? ' on' : '') + '" data-act="plan-delay" data-slot="' + s.id + '" data-d="' + d + '">' + (raw && +raw.delay ? '⏱ delay ' + raw.delay + ' phút' : '⏱ báo delay') + '</span>' : '') + '</td>';
    }

  }
  h += '</tbody></table></div>';
  return h;
}
function demandText(dm) {
  dm = dm || {}; const parts = []; let tot = 0;
  for (const r of ['S', 'C', 'G', 'GC', 'SE']) if (+dm[r]) { parts.push(r + dm[r]); tot += +dm[r]; }
  tot += +dm.A || 0; if (+dm.A) parts.push('NV' + dm.A);
  return tot ? tot + ' (' + parts.join(' ') + ')' : '';
}

  const days = DAYS.map((x, d) => x + ' = ' + C.dayLabel(w, d).slice(3)).join(', ');
  const staff = S.cfg.staff.map(s => s.name).join(' | ');
  const slots = S.cfg.slots.filter(s => s.active).map(s => s.id + ' (' + s.flight + ' ' + C.fmtTime(s.time) + ')').join(', ');
  const codes = S.cfg.codes.map(c => c.code + ' = ' + c.label).join('; ');
  let p = 'Bạn đọc tài liệu chia lịch / chấm công của nhân viên phục vụ chuyến bay tại sân bay, thường viết tay trên giấy, tiếng Việt.\n' +
    'Tuần: ' + days + '.\nDanh sách nhân viên (tên chuẩn): ' + staff + '.\n' +
    'Mã slot chuyến bay: ' + slots + '. Sau mã có thể có vị trí /S (supervisor), /C, /G, /GC, /SE. Một ô có thể có 2 chuyến nối bằng dấu +.\n' +
    'Mã trạng thái: ' + codes + '.\n\n' +
    'Tài liệu hay gặp là SỔ ĐĂNG KÝ NGHỈ / NGUYỆN VỌNG viết tay: mỗi mục dạng "số. Tên { ngày/tháng: nội dung }". Ngày ghi dạng 9/10, 10/10 → đổi sang thứ theo bảng tuần ở trên; "5/10 - 6/10: NP" nghĩa là NP cả hai ngày. Chữ bị gạch ngang thì BỎ QUA. ' +
    'Chuẩn hoá cách viết tắt: "0 đêm", "ko đêm", "k° đêm", "kđ", "không đêm" → "K Đ"; "off 1/2 + sáng", "sáng + off 1/2" → "OFF1/2 + S"; "off 1/2 + đêm", "off 1/2 làm đêm" → "OFF1/2 + D"; "off" → "OFF"; "np", "nghỉ phép" → "NP". ' +
    'Chuyến bay ghi như "FD3+AK3", "Z2", "EK", "BX" thì giữ mã slot (BX đêm trễ → BX1). Các ý khác (làm khuya, đêm muộn, ko chiều 16h-18h, đi Sài Gòn sớm, đám giỗ, ko FD4…) để trong ngoặc đơn sau mã, ví dụ "K Đ (ko FD4)". ' +
    'Tên thường viết tắt (BTrâm = BÍCH TRÂM, A.Vũ = ANH VŨ, H.Nhi = HƯƠNG NHI, N Quỳnh = NGỰ QUỲNH) hoặc kèm số (Thảo 4, Ngọc 5): chọn tên chuẩn gần nhất. Người không ghi gì thì bỏ qua.\n' +
    'Quy tắc: chép đúng những gì nhìn thấy, không tự bịa thêm. Ô trống thì bỏ qua. Chữ không đọc được thì ghi dấu ? vào chỗ đó và hạ confidence. ' +
    '"name" là tên chuẩn gần nhất trong danh sách (để trống nếu không chắc), "name_raw" là tên đúng như viết trong tài liệu. confidence từ 0 đến 1.\n';
  if (kind === 'auto') p += 'Nhiệm vụ: trước hết xác định tài liệu là loại nào: "assign" (bảng phân ca theo người và ngày, có chuyến và/hoặc trạng thái), "leave" (chỉ danh sách nghỉ OFF/NP/ốm), "ts" (chấm công OVER/BÙ, số phút hoặc giờ), "plan" (lịch bay: số hiệu chuyến, giờ, CANX). ' +
    'Trả về JSON có trường "type" và dữ liệu tương ứng:\n' +
    '- assign hoặc leave: {"type":"assign","rows":[{"name_raw":"...","name":"...","cells":{"T2":"nội dung ô"},"confidence":0.9}],"warnings":[]}. Khoá cells chỉ dùng T2..T7, CN; một ngày có 2 ô thì nối bằng " + ".\n' +
    '- ts: {"type":"ts","rows":[{"name_raw":"...","name":"...","day":"T2","over_ngay":0,"over_dem":0,"bu_ngay":0,"bu_dem":0,"confidence":0.9}],"warnings":[]}, số liệu đổi ra PHÚT.\n' +
    '- plan: {"type":"plan","flights":[{"slot":"mã slot","day":"T2","text":"TW008 1145 ICN","canx":false,"confidence":0.9}],"warnings":[]}.';
  else if (kind === 'assign' || kind === 'leave') p += 'Nhiệm vụ: chép bảng phân ca. Trả về JSON đúng dạng: {"rows":[{"name_raw":"...","name":"...","cells":{"T2":"nội dung ô","T3":"..."},"confidence":0.9}],"warnings":["..."]}. ' +
    'Khoá trong cells chỉ dùng T2,T3,T4,T5,T6,T7,CN. Nếu một ngày có 2 ô (trạng thái và chuyến) thì nối bằng " + ". ' + (kind === 'leave' ? 'Chỉ cần các ô có trạng thái nghỉ (OFF, NP, ốm, phép…).' : '');
  else if (kind === 'ts') p += 'Nhiệm vụ: chép bảng chấm công làm thêm. Số liệu tính bằng PHÚT (nếu ghi giờ như 1h30 thì đổi ra 90). Trả về JSON: {"rows":[{"name_raw":"...","name":"...","day":"T2","over_ngay":0,"over_dem":0,"bu_ngay":0,"bu_dem":0,"confidence":0.9}],"warnings":[]}. Ô không có số thì để null.';
  else p += 'Nhiệm vụ: chép lịch bay theo ngày. Trả về JSON: {"flights":[{"slot":"mã slot trong danh sách nếu khớp","day":"T2","text":"số hiệu + giờ + sân bay như viết, vd TW008 1145 ICN","canx":false,"confidence":0.9}],"warnings":[]}.';
  if (hasText) p += '\n\nNội dung văn bản cần đọc:\n"""\n' + S.imp.text + '\n"""';
  return p;
}

/* ---------- Bản sao lưu tự động ---------- */
const Backup = {
  async create(label) {
    const id = 'b' + Date.now();
    const rec = { id, at: new Date().toISOString(), by: FBX.user ? FBX.user.email : '', label, week: S.week ? S.week.start : '', data: JSON.parse(JSON.stringify({ week: S.week, cfg: liveCfg() })) };
    const meta = { id, at: rec.at, by: rec.by, label, week: rec.week };
    if (Store.mode === 'fb' || Store.mode === 'db') {
      try {
        await Store.D.doc('backups/' + id).set(rec);
        const idx = Store.D.doc('config/backups'); const s = await idx.get();
        let list = s.exists ? (s.data().list || []) : []; list.unshift(meta);
        const drop = list.slice(30); list = list.slice(0, 30);
        await idx.set({ list });
        drop.forEach(x => Store.D.doc('backups/' + x.id).delete().catch(() => {}));
        return meta;
      } catch (e) { console.warn('backup cloud failed', e); meta.localOnly = true; }
    }
    const list = Store.lsGet('backups') || []; list.unshift(meta);
    while (list.length > 8) { const x = list.pop(); try { localStorage.removeItem('pcsb:backup:' + x.id); } catch (e) {} }
    if (!Store.lsSet('backup:' + id, rec)) { meta.failed = true; }
    Store.lsSet('backups', list);
    return meta;
  },
  async list() {
    let cloud = [];
    if (Store.mode === 'fb' || Store.mode === 'db') { try { const s = await Store.D.doc('config/backups').get(); cloud = s.exists ? (s.data().list || []) : []; } catch (e) {} }
    const local = (Store.lsGet('backups') || []).map(x => Object.assign({}, x, { localOnly: true }));
    return [...cloud, ...local].sort((a, b) => (a.at < b.at ? 1 : -1));
  },
  async get(meta) {
    if (!meta.localOnly && (Store.mode === 'fb' || Store.mode === 'db')) { const s = await Store.D.doc('backups/' + meta.id).get(); return s.exists ? s.data() : null; }
    return Store.lsGet('backup:' + meta.id);
  }
};
async function openBackups() {
  modal('Bản sao lưu tự động', '<p class="muted">Đang tải…</p>', [{ label: 'Đóng' }]);
  const list = await Backup.list();
  const host = $('#modalHost .box > div');
  if (!host) return;
  host.innerHTML = '<p class="help" style="margin-top:0">Mỗi lần nhập dữ liệu, máy tự lưu một bản trước khi ghi. Khôi phục sẽ đưa tuần về đúng trạng thái lúc đó (và tự sao lưu bản hiện tại trước).</p>' +
    (list.length ? '<div class="list">' + list.map((b, i) => '<div class="li"><div class="grow"><b>' + esc(b.label || 'Sao lưu') + '</b><div class="meta">' + new Date(b.at).toLocaleString('vi-VN') + ' · tuần ' + (b.week ? weekName(b.week) : '?') + (b.by ? ' · ' + esc(b.by) : '') + (b.localOnly ? ' · chỉ trên máy này' : '') + '</div></div><button class="btn sm" data-bk="' + i + '">Khôi phục</button></div>').join('') + '</div>' : '<p class="muted">Chưa có bản sao lưu nào.</p>');
  host.querySelectorAll('[data-bk]').forEach(btn => btn.onclick = async () => {
    const meta = list[+btn.dataset.bk];
    btn.disabled = true; btn.textContent = 'Đang khôi phục…';
    try {
      const rec = await Backup.get(meta); if (!rec || !rec.data || !rec.data.week) throw new Error('Không đọc được bản sao lưu');
      await Backup.create('Trước khi khôi phục bản ' + new Date(meta.at).toLocaleString('vi-VN'));
      const w = rec.data.week;
      if (!S.week || S.week.start !== w.start) { if (S.weeks.includes(w.start)) await openWeek(w.start); else S.weeks = [...new Set([...S.weeks, w.start])].sort(); }
      if (S.week && S.week.start === w.start) { S.undo.push(snapshot()); S.redo = []; }
      S.week = w; recompute(); Store.save('week', w.start); S.tab = 'roster'; closeModal(); render(); Store.watch();
      toast('Đã khôi phục tuần ' + weekName(w.start) + ' về lúc ' + new Date(meta.at).toLocaleString('vi-VN'));
    } catch (e) { toast('Lỗi: ' + e.message); btn.disabled = false; btn.textContent = 'Khôi phục'; }
  });
}

function openImport(kind) {
  if (S.week && S.week.locked) { toast('Tuần đang mở đã chốt. Mở khoá hoặc chuyển sang tuần khác để nhập.'); return; }
  if (S.ro || !S.week) { if (!S.week) toast('Hãy tạo hoặc mở một tuần trước.'); return; }
  S.imp = { step: 'source', kind: kind || 'auto', week: S.week.start, src: 'image', files: [], text: '', recs: [], warnings: [], engine: null, onlyIssues: false, mode: 'replace' };
  aiEngine().then(e => {
    if (!S.imp) return; S.imp.engine = e;
    if (S.imp.autoRun) { S.imp.autoRun = false; if (e && e.images) { impRunAI(false); return; } S.imp.error = 'AI đọc ảnh chưa được bật. Người quản lý lịch cần bật một lần ở Cài đặt & dữ liệu → Nhập / xuất dữ liệu → Đọc ảnh bằng AI. Trong lúc chờ, bạn có thể dùng cách Dán văn bản.'; }
    renderImport();

}

function curText(sid, d) {
  const c = C.cellOf(S.imp.wk || S.week, sid, d); if (!c) return '';

}
function reviewHtml() {
  const I = S.imp; const recs = I.recs;

  const dayOpts = sel => DAYS.map((x, d) => '<option value="' + d + '"' + (d === sel ? ' selected' : '') + '>' + C.dayLabel(I.week, d) + '</option>').join('');
  const codeOpts = sel => '<option value="">—</option>' + S.cfg.codes.map(c => '<option value="' + esc(c.code) + '"' + (C.key(c.code) === C.key(sel) ? ' selected' : '') + '>' + esc(c.code) + '</option>').join('') + (sel && !codeOf(sel) ? '<option selected>' + esc(sel) + '</option>' : '');
  // kiểm tra
  const slotIds = new Set(S.cfg.slots.map(s => s.id));
  const seen = {};
  for (const r of recs) {
    r.warn = [];
    if (I.kind !== 'plan') {
      if (!r.sid) r.warn.push('Chưa khớp nhân viên');
      else if (r.score < 0.9 || r.ambiguous) r.warn.push('Tên khớp chưa chắc (' + Math.round(r.score * 100) + '%)');
      const k = r.sid + '|' + r.d; if (r.sid && r.inc) { if (seen[k]) r.warn.push('Trùng người + ngày với dòng khác'); seen[k] = 1; }
    } else if (!slotIds.has(r.slot)) r.warn.push('Mã slot không có trong danh sách');
    if (r.conf != null && r.conf < 0.7) r.warn.push('AI đọc chưa chắc');
    if (/\?/.test(r.src || '') || /\?/.test(r.items || '') || /\?/.test(r.status || '')) r.warn.push('Có chỗ không đọc được (?)');
    if (I.kind === 'assign' && r.note && r.note.length) r.warn.push('Có chữ chưa nhận ra: ' + r.note);
  }
  const issues = recs.filter(r => r.warn.length).length;
  const unmatched = I.kind === 'plan' ? 0 : recs.filter(r => !r.sid).length;
  let h = '<div class="revtop">';

function tipFor(el) {
  if (el.dataset.tip) return el.dataset.tip;
  const m = mappedTip(el);
  if (el.title) { el.dataset.tip = m || el.title; el.removeAttribute('title'); return el.dataset.tip; }
  return m;
}
function mappedTip(el) {
  const d = el.dataset;
  if (d.act) {
    if (d.act === 'cell') return '';
    if (d.k && TIPS['act:' + d.act + ':' + d.k]) return TIPS['act:' + d.act + ':' + d.k];
    return TIPS['act:' + d.act] || '';
  }
  if (d.iact) {
    if (d.iact === 'kind' && typeof IMP_KINDS !== 'undefined' && IMP_KINDS[d.k]) return IMP_KINDS[d.k].desc;
    return TIPS['iact:' + d.iact] || '';
  }
  if (d.tab) return TIPS['tab:' + d.tab] || '';
  if (el.htmlFor === 'camQuick') return TIPS.cam;
  if (el.tagName === 'LABEL') { const inp = el.querySelector('input[id],select[id]'); if (inp && TIPS['id:' + inp.id]) return TIPS['id:' + inp.id]; }
  if (el.id && TIPS['id:' + el.id]) return TIPS['id:' + el.id];
  return '';
}
const TipUI = {
  el: null, timer: 0, cur: null, touch: false,
  init() {
    const css = document.createElement('style');
    css.textContent = '.qtip{position:fixed;z-index:9999;max-width:300px;padding:7px 10px;border-radius:8px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-left:3px solid var(--accent);font-size:12.5px;line-height:1.4;box-shadow:var(--shadow);pointer-events:none;opacity:0;transform:translateY(2px);transition:opacity .12s,transform .12s}.qtip.on{opacity:1;transform:none}';
    document.head.appendChild(css);
    this.el = document.createElement('div'); this.el.className = 'qtip'; this.el.setAttribute('role', 'tooltip'); document.body.appendChild(this.el);
    const sel = '[data-act],[data-iact],[data-tab],[data-tip],[title],label[for="camQuick"],label.chk,#wkSel,#fq,#fg';
    document.addEventListener('pointerdown', e => { this.touch = e.pointerType === 'touch'; this.hide(); }, true);
    document.addEventListener('mouseover', e => {
      if (this.touch || !matchMedia('(hover: hover)').matches) return;
      let t = e.target.closest && e.target.closest(sel);
      if (t === this.cur) return;
      this.hide(); if (!t) return;
      const text = tipFor(t); if (!text) return;
      this.cur = t;
      this.timer = setTimeout(() => this.show(t, text), t.closest('.g,.cov') ? 600 : 350);
    });
    document.addEventListener('mouseout', e => { if (this.cur && (!e.relatedTarget || !this.cur.contains(e.relatedTarget))) this.hide(); });
    addEventListener('scroll', () => this.hide(), true);
    addEventListener('keydown', () => this.hide(), true);
  },
  show(t, text) {
    if (!document.body.contains(t)) return;
    const el = this.el; el.textContent = text; el.classList.add('on');
    const r = t.getBoundingClientRect(), w = el.offsetWidth, h = el.offsetHeight;
    let x = r.left + r.width / 2 - w / 2; x = Math.max(8, Math.min(x, innerWidth - w - 8));
    let y = r.bottom + 8; if (y + h > innerHeight - 8) y = r.top - h - 8;
    el.style.left = x + 'px'; el.style.top = Math.max(8, y) + 'px';
  },
  hide() { clearTimeout(this.timer); this.cur = null; if (this.el) this.el.classList.remove('on'); }
};
